    <script>
        (function() {
            'use strict';

            const API_BASE = 'https://bedcheck-biu.onrender.com/api';

            let currentUser = null;
            let hostelData = null;
            let students = [];
            let scans = [];
            let activeTab = 'overview';
            let isLoading = true;

            const screenContent = document.getElementById('screenContent');
            const noticeText = document.getElementById('noticeText');
            const roleLabel = document.getElementById('roleLabel');
            const roleScope = document.getElementById('roleScope');
            const profileAvatar = document.getElementById('profileAvatar');
            const profileName = document.getElementById('profileName');
            const profileRoleLabel = document.getElementById('profileRoleLabel');
            const logoutBtn = document.getElementById('logoutBtn');
            const menuToggle = document.getElementById('menuToggle');

            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => toast.classList.remove('show'), 4000);
            }

            function getAuthHeaders() {
                const userData = sessionStorage.getItem('bedcheck_user');
                if (userData) {
                    try {
                        const user = JSON.parse(userData);
                        return { 'X-Staff-ID': user.id };
                    } catch (e) { return {}; }
                }
                return {};
            }

            function getStaffId() {
                const userData = sessionStorage.getItem('bedcheck_user');
                if (userData) {
                    try {
                        const user = JSON.parse(userData);
                        return user.id;
                    } catch (e) { return null; }
                }
                return null;
            }

            async function apiCall(endpoint, options = {}) {
                try {
                    const headers = {
                        'Content-Type': 'application/json',
                        ...getAuthHeaders(),
                        ...(options.headers || {})
                    };
                    let url = `${API_BASE}${endpoint}`;
                    if (endpoint === '/hra/hostel') {
                        const staffId = getStaffId();
                        if (staffId) url += `?staff_id=${staffId}`;
                    }
                    const response = await fetch(url, { ...options, headers });
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                    const data = await response.json();
                    if (!data.success) throw new Error(data.message || 'API error');
                    return data;
                } catch (error) {
                    showToast('Error: ' + error.message, 'error');
                    throw error;
                }
            }

            function updateUserDisplay() {
                if (currentUser) {
                    const name = currentUser.name || 'User';
                    const initials = currentUser.initials || name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase() ||
                    'U';
                    profileAvatar.textContent = initials;
                    profileName.textContent = name;
                    profileRoleLabel.textContent = currentUser.role || 'HRA';
                    roleLabel.textContent = currentUser.role || 'HRA';
                    if (hostelData) {
                        roleScope.textContent = hostelData.name + ' · Hostel Representative Admin';
                    }
                }
            }

            function setNotice(msg) { noticeText.textContent = msg; }

            function getInitials(name) {
                if (!name) return 'U';
                return name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
            }

            function attBadge(status) {
                const map = {
                    'Present': 'badge-present',
                    'Absent': 'badge-absent',
                    'Late': 'badge-late',
                    'Manual': 'badge-pending'
                };
                return `<span class="badge ${map[status] || 'badge-pending'}">${status || 'Unknown'}</span>`;
            }

            function renderLoading() {
                screenContent.innerHTML = `
                    <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
                    <p class="text-center text-muted">Loading reports...</p>
                `;
            }

            function renderNoHostel() {
                screenContent.innerHTML = `
                    <div class="card mt-4">
                        <div class="text-center p-4">
                            <i class="fas fa-building" style="font-size:3rem;color:#b9c7db;"></i>
                            <h2 class="mt-3">No Hostel Assigned</h2>
                            <p class="text-muted">You are not assigned to any hostel. Please contact the administrator.</p>
                            <button class="btn-primary mt-3" onclick="window.location.href='hra-index.html'"><i class="fas fa-arrow-left"></i> Back to Dashboard</button>
                        </div>
                    </div>
                `;
            }

            function renderError() {
                screenContent.innerHTML = `
                    <div class="card mt-4" style="border-color:#a84134;background:#f9e2de;">
                        <div class="text-center p-4">
                            <i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#a84134;"></i>
                            <h2 class="mt-3">Error Loading Data</h2>
                            <p class="text-muted">${noticeText.textContent}</p>
                            <button class="btn-primary mt-3" onclick="location.reload()"><i class="fas fa-refresh"></i> Refresh</button>
                        </div>
                    </div>
                `;
            }

            function renderReports() {
                const totalStudents = students.length;
                const present = students.filter(s => s.status === 'Present').length;
                const absent = students.filter(s => s.status === 'Absent').length;
                const late = students.filter(s => s.status === 'Late').length;
                const manual = students.filter(s => s.status === 'Manual' || s.verification_method === 'manual').length;
                const verified = present + manual;
                const completion = totalStudents > 0 ? Math.round((verified / totalStudents) * 100) : 0;
                const attendanceRate = totalStudents > 0 ? Math.round((present / totalStudents) * 100) : 0;

                const hostelName = hostelData?.name || 'Your Hostel';
                const totalRooms = hostelData?.total_rooms || 0;

                // Floor distribution
                const floorData = {};
                students.forEach(s => {
                    if (s.floor) {
                        floorData[s.floor] = (floorData[s.floor] || 0) + 1;
                    }
                });
                const floorKeys = Object.keys(floorData);
                const floorStats = floorKeys.map(floor => {
                    const count = floorData[floor];
                    const presentCount = students.filter(s => s.floor === floor && s.status === 'Present').length;
                    return { floor, total: count, present: presentCount, rate: count > 0 ? Math.round((presentCount / count) *
                            100) : 0 };
                });

                // Recent scans/activity
                const recentActivity = scans.slice(0, 5).map(s => {
                    const student = students.find(st => st.id === s.student_id);
                    const time = new Date(s.created_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                    return { time, name: student?.name || 'Unknown', status: s.status || 'Verified' };
                });

                const html = `
                    <div class="page-heading">
                        <div>
                            <p class="eyebrow"><i class="fas fa-chart-bar"></i> HRA · Reports</p>
                            <h1>${hostelName} Reports</h1>
                            <p class="desc">
                                <span class="assigned-hostel-badge">
                                    <i class="fas fa-building"></i> ${hostelName}
                                </span>
                                <span class="text-muted" style="margin-left:0.5rem;">${totalStudents} students</span>
                            </p>
                        </div>
                        <div class="action-group">
                            <button class="btn-outline" onclick="exportReport()"><i class="fas fa-download"></i> Export CSV</button>
                            <button class="btn-primary" onclick="showToast('Generating PDF...','info')"><i class="fas fa-file-pdf"></i> Generate PDF</button>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <div class="flex-center gap-2 flex-wrap">
                        <button class="tab-btn ${activeTab === 'overview' ? 'active' : ''}" onclick="setTab('overview')">Overview</button>
                        <button class="tab-btn ${activeTab === 'students' ? 'active' : ''}" onclick="setTab('students')">Student List</button>
                        <button class="tab-btn ${activeTab === 'attendance' ? 'active' : ''}" onclick="setTab('attendance')">Attendance Details</button>
                    </div>

                    ${activeTab === 'overview' ? `
                    <div class="mt-4">
                        <div class="metric-grid">
                            <div class="metric-card">
                                <div class="metric-icon blue"><i class="fas fa-users"></i></div>
                                <div class="metric-value">${totalStudents}</div>
                                <div class="metric-title">Total Students</div>
                            </div>
                            <div class="metric-card" style="border-left:3px solid #2d6545;">
                                <div class="metric-icon green"><i class="fas fa-check-circle"></i></div>
                                <div class="metric-value" style="color:#2d6545;">${present}</div>
                                <div class="metric-title">Present</div>
                            </div>
                            <div class="metric-card" style="border-left:3px solid #8a3328;">
                                <div class="metric-icon red"><i class="fas fa-user-slash"></i></div>
                                <div class="metric-value" style="color:#8a3328;">${absent + late}</div>
                                <div class="metric-title">Absent / Late</div>
                            </div>
                        </div>

                        <div class="grid-2 mt-4">
                            <div class="card">
                                <div class="card-title"><span class="icon"><i class="fas fa-chart-pie"></i></span> Attendance Overview</div>
                                <div class="mt-3">
                                    <div class="flex-between"><span class="text-muted">Present</span><span class="font-bold" style="color:#2d6545;">${present} (${attendanceRate}%)</span></div>
                                    <div class="progress-bar mt-1"><div class="fill" style="width:${attendanceRate}%;background:#2d6545;"></div></div>
                                    <div class="flex-between mt-2"><span class="text-muted">Absent</span><span class="font-bold" style="color:#8a3328;">${absent}</span></div>
                                    <div class="progress-bar mt-1"><div class="fill" style="width:${totalStudents > 0 ? (absent / totalStudents) * 100 : 0}%;background:#a84134;"></div></div>
                                    <div class="flex-between mt-2"><span class="text-muted">Late</span><span class="font-bold" style="color:#d97706;">${late}</span></div>
                                    <div class="progress-bar mt-1"><div class="fill" style="width:${totalStudents > 0 ? (late / totalStudents) * 100 : 0}%;background:#d09b2e;"></div></div>
                                    <div class="flex-between mt-2"><span class="text-muted">Manual Verification</span><span class="font-bold" style="color:#315b8a;">${manual}</span></div>
                                    <div class="progress-bar mt-1"><div class="fill" style="width:${totalStudents > 0 ? (manual / totalStudents) * 100 : 0}%;background:#315b8a;"></div></div>
                                    <div class="flex-between mt-2"><span class="text-muted">Verification Rate</span><span class="font-bold" style="color:#a77915;">${completion}%</span></div>
                                    <div class="progress-bar mt-1"><div class="fill" style="width:${completion}%;background:#d6ad4b;"></div></div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-title"><span class="icon"><i class="fas fa-layer-group"></i></span> Floor Distribution</div>
                                <div class="mt-3">
                                    ${floorStats.length > 0 ? floorStats.map(f => `
                                        <div class="flex-between"><span class="text-muted">${f.floor}</span><span class="font-bold">${f.present}/${f.total} (${f.rate}%)</span></div>
                                        <div class="progress-bar mt-1"><div class="fill" style="width:${f.rate}%;"></div></div>
                                    `).join('') : '<p class="text-muted text-sm">No floor data available</p>'}
                                </div>
                            </div>
                        </div>

                        <div class="card mt-4">
                            <div class="card-title"><span class="icon"><i class="fas fa-clock"></i></span> Recent Activity</div>
                            <div class="mt-3">
                                ${recentActivity.length > 0 ? recentActivity.map(a => `
                                    <div class="flex-between" style="padding:0.3rem 0;border-bottom:1px solid #f0ebe2;">
                                        <span><span class="font-bold">${a.name}</span> ${a.status}</span>
                                        <span class="text-xs text-muted">${a.time}</span>
                                    </div>
                                `).join('') : '<p class="text-muted text-sm">No recent activity</p>'}
                            </div>
                        </div>

                        <div class="card mt-4" style="border-color:#d6ad4b;background:#fbf7ef;">
                            <div class="card-title"><span class="icon"><i class="fas fa-chart-simple"></i></span> Quick Stats</div>
                            <div class="grid-3 mt-2">
                                <div class="text-center p-2"><span class="text-xs text-muted">Total Rooms</span><br><span class="font-bold text-lg" style="color:#a77915;">${totalRooms}</span></div>
                                <div class="text-center p-2"><span class="text-xs text-muted">Verification Rate</span><br><span class="font-bold text-lg" style="color:#a77915;">${completion}%</span></div>
                                <div class="text-center p-2"><span class="text-xs text-muted">Attendance Rate</span><br><span class="font-bold text-lg" style="color:#a77915;">${attendanceRate}%</span></div>
                            </div>
                        </div>
                    </div>
                    ` : ''}

                    ${activeTab === 'students' ? `
                    <div class="card mt-4">
                        <div class="flex-between">
                            <div class="card-title"><span class="icon"><i class="fas fa-users"></i></span> Student List</div>
                            <div class="flex-center gap-2">
                                <input type="text" id="studentSearch" placeholder="Search..." style="padding:0.4rem 0.6rem;border:1px solid #cbd2db;border-radius:0.5rem;font-size:0.8rem;outline:none;" oninput="filterStudentList()" />
                                <select id="statusFilter" onchange="filterStudentList()" style="padding:0.4rem 0.6rem;border:1px solid #cbd2db;border-radius:0.5rem;font-size:0.8rem;outline:none;background:white;">
                                    <option value="all">All Status</option>
                                    <option value="Present">Present</option>
                                    <option value="Absent">Absent</option>
                                    <option value="Late">Late</option>
                                    <option value="Manual">Manual</option>
                                </select>
                            </div>
                        </div>
                        <div class="table-wrap mt-3">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Student</th>
                                        <th>Matric</th>
                                        <th>Room</th>
                                        <th>Status</th>
                                        <th>Verification</th>
                                    </tr>
                                </thead>
                                <tbody id="studentTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                    ` : ''}

                    ${activeTab === 'attendance' ? `
                    <div class="mt-4">
                        <div class="grid-2">
                            <div class="card">
                                <div class="card-title"><span class="icon"><i class="fas fa-list"></i></span> Attendance Summary</div>
                                <div class="mt-3">
                                    <div class="flex-between"><span class="text-muted">Total Students</span><span class="font-bold">${totalStudents}</span></div>
                                    <div class="flex-between mt-2"><span class="text-muted">Present</span><span class="badge badge-present">${present}</span></div>
                                    <div class="flex-between mt-2"><span class="text-muted">Absent</span><span class="badge badge-absent">${absent}</span></div>
                                    <div class="flex-between mt-2"><span class="text-muted">Late</span><span class="badge badge-late">${late}</span></div>
                                    <div class="flex-between mt-2"><span class="text-muted">Manual Verification</span><span class="badge badge-pending">${manual}</span></div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-title"><span class="icon"><i class="fas fa-layer-group"></i></span> Attendance by Floor</div>
                                <div class="mt-3">
                                    ${floorStats.length > 0 ? floorStats.map(f => `
                                        <div class="flex-between"><span class="text-muted">${f.floor}</span><span class="font-bold">${f.present}/${f.total} (${f.rate}%)</span></div>
                                        <div class="progress-bar mt-1"><div class="fill" style="width:${f.rate}%;"></div></div>
                                    `).join('') : '<p class="text-muted text-sm">No floor data available</p>'}
                                </div>
                            </div>
                        </div>

                        <div class="card mt-4">
                            <div class="card-title"><span class="icon"><i class="fas fa-clock"></i></span> Recent Activity</div>
                            <div class="mt-3">
                                ${recentActivity.length > 0 ? recentActivity.map(a => `
                                    <div class="flex-between" style="padding:0.3rem 0;border-bottom:1px solid #f0ebe2;">
                                        <span><span class="font-bold">${a.name}</span> ${a.status}</span>
                                        <span class="text-xs text-muted">${a.time}</span>
                                    </div>
                                `).join('') : '<p class="text-muted text-sm">No recent activity</p>'}
                            </div>
                        </div>
                    </div>
                    ` : ''}

                    <div class="mt-6 pt-4 border-t text-center">
                        <p class="text-xs text-muted">
                            BIU BedCheck System v1.0 · © Benson Idahosa University
                            <span class="ml-4"><span class="status-dot green"></span> System Online</span>
                            <span class="ml-4">Report generated: ${new Date().toLocaleString()}</span>
                        </p>
                    </div>
                `;

                screenContent.innerHTML = html;

                if (activeTab === 'students') {
                    renderStudentTable('all', '');
                }
            }

            function renderStudentTable(statusFilter = 'all', searchTerm = '') {
                const tbody = document.getElementById('studentTableBody');
                if (!tbody) return;

                let filtered = students;
                if (statusFilter && statusFilter !== 'all') {
                    filtered = filtered.filter(s => s.status === statusFilter);
                }
                if (searchTerm) {
                    const search = searchTerm.toLowerCase();
                    filtered = filtered.filter(s =>
                        (s.name || '').toLowerCase().includes(search) ||
                        (s.matric || '').toLowerCase().includes(search) ||
                        (s.room || '').toLowerCase().includes(search)
                    );
                }

                tbody.innerHTML = filtered.map(s => `
                    <tr>
                        <td>
                            <div style="display:flex;align-items:center;gap:0.5rem;">
                                <span class="avatar">${getInitials(s.name)}</span>
                                <span class="font-bold">${s.name || 'Unknown'}</span>
                            </div>
                        </td>
                        <td>${s.matric || '—'}</td>
                        <td>${s.room || '—'}</td>
                        <td>${attBadge(s.status)}</td>
                        <td>
                            ${s.fingerprint ? '<span class="badge badge-approved"><i class="fas fa-fingerprint"></i> Fingerprint</span>' :
                              s.status === 'Manual' ? '<span class="badge badge-pending"><i class="fas fa-pen"></i> Manual</span>' :
                              '<span class="badge badge-pending">—</span>'}
                        </td>
                    </tr>
                `).join('') || '<tr><td colspan="5" class="text-center text-muted" style="padding:2rem;">No students found</td></tr>';
            }

            function filterStudentList() {
                const search = document.getElementById('studentSearch');
                const filter = document.getElementById('statusFilter');
                if (search && filter) {
                    renderStudentTable(filter.value, search.value);
                }
            }

            function setTab(tab) {
                activeTab = tab;
                renderReports();
            }

            function exportReport() {
                if (students.length === 0) {
                    showToast('No data to export', 'error');
                    return;
                }
                const header = 'Name,Matric,Room,Status,Verification Method\n';
                const rows = students.map(s =>
                    `${s.name || 'Unknown'},${s.matric || '—'},${s.room || '—'},${s.status || 'Unknown'},${s.fingerprint ? 'Fingerprint' : s.status === 'Manual' ? 'Manual' : '—'}`
                ).join('\n');
                const blob = new Blob([header + rows], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `reports_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
                URL.revokeObjectURL(url);
                showToast(`${students.length} records exported`, 'success');
            }

            async function loadAllData() {
                try {
                    renderLoading();
                    const userData = sessionStorage.getItem('bedcheck_user') || localStorage.getItem('bedcheck_user');
                    if (!userData) { window.location.replace('../Login.html'); return; }
                    try {
                        currentUser = JSON.parse(userData);
                        if (!sessionStorage.getItem('bedcheck_user')) sessionStorage.setItem('bedcheck_user', userData);
                        if (!currentUser.id) { showToast('User data incomplete', 'error');
                            setTimeout(() => window.location.replace('../Login.html'), 2000); return; }
                    } catch (e) { window.location.replace('../Login.html'); return; }
                    updateUserDisplay();

                    const hostelRes = await apiCall(`/hra/hostel`);
                    hostelData = hostelRes.data;
                    if (!hostelData) {
                        roleScope.textContent = 'No hostel assigned';
                        showToast('No hostel assigned', 'error');
                        renderNoHostel();
                        return;
                    }
                    roleScope.textContent = hostelData.name + ' · Hostel Representative Admin';
                    document.getElementById('mobileRoleFooter').textContent = `HRA · ${hostelData.name} Hostel`;
                    setNotice(`${hostelData.name} · Reports`);
                    updateUserDisplay();

                    const [studentsRes, scansRes] = await Promise.all([
                        apiCall(`/hostels/${hostelData.id}/students`).catch(() => ({ data: [] })),
                        apiCall(`/bedcheck/scans?hostel_id=${hostelData.id}`).catch(() => ({ data: [] }))
                    ]);

                    students = studentsRes.data || [];
                    scans = scansRes.data || [];

                    const now = new Date();
                    document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    renderReports();
                } catch (error) {
                    console.error('Load error:', error);
                    showToast('Error loading data: ' + error.message, 'error');
                    setNotice('Error loading reports data. Please refresh.');
                    renderError();
                }
            }

            function handleLogout() {
                sessionStorage.removeItem('bedcheck_user');
                localStorage.removeItem('bedcheck_user');
                showToast('Logging out...', 'success');
                setTimeout(() => window.location.replace('../Login.html'), 500);
            }

            function openMobileDrawer() {
                document.getElementById('mobileDrawer').classList.add('open');
                document.getElementById('drawerOverlay').classList.add('show');
            }

            function closeMobileDrawer() {
                document.getElementById('mobileDrawer').classList.remove('open');
                document.getElementById('drawerOverlay').classList.remove('show');
            }

            function init() {
                const userData = sessionStorage.getItem('bedcheck_user') || localStorage.getItem('bedcheck_user');
                if (!userData) { window.location.replace('../Login.html'); return; }
                try {
                    currentUser = JSON.parse(userData);
                    if (!sessionStorage.getItem('bedcheck_user')) sessionStorage.setItem('bedcheck_user', userData);
                    if (!currentUser.id) { showToast('User data incomplete', 'error');
                        setTimeout(() => window.location.replace('../Login.html'), 2000); return; }
                    updateUserDisplay();
                    loadAllData();
                } catch (e) { console.error('Error parsing user data:', e);
                    window.location.replace('../Login.html'); }

                logoutBtn.addEventListener('click', handleLogout);
                menuToggle.addEventListener('click', openMobileDrawer);
                document.getElementById('closeDrawer').addEventListener('click', closeMobileDrawer);
                document.getElementById('drawerOverlay').addEventListener('click', closeMobileDrawer);
            }

            window.showToast = showToast;
            window.setTab = setTab;
            window.filterStudentList = filterStudentList;
            window.exportReport = exportReport;

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>

</body>
</html>
