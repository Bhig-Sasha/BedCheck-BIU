            display: grid;
            place-items: center;
            font-size: 3rem;
            color: #10233f;
        }
        .qr-code-image img { width: 100%; height: 100%; object-fit: contain; }
        .qr-container-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .qr-container-loading i { font-size: 1.5rem; color: #a77915; animation: spin 1s linear infinite; }
        .qr-container-error { text-align: center; padding: 1rem; color: #a84134; }
        .qr-container-empty { text-align: center; padding: 1rem; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #e8e4de; border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: #d6ad4b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #c49a2a; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- ===== PORTAL ===== -->

                <div>
                    <div class="brand-text">BIU BedCheck</div>
                    <div class="brand-sub">Management System</div>
                </div>
            </div>
            <nav id="mobileNav">
                <a href="hra-index.html" class="nav-item active"><i class="fas fa-home"></i> Dashboard</a>
                <a href="MyHostel.html" class="nav-item"><i class="fas fa-building"></i> My Hostel</a>
                <a href="ReviewBedCheck.html" class="nav-item"><i class="fas fa-clipboard-check"></i> Review BedCheck</a>
                <a href="Reports.html" class="nav-item"><i class="fas fa-chart-bar"></i> Reports</a>
                <a href="Profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>
            </nav>
            <div class="drawer-footer" id="mobileRoleFooter">HRA · Loading...</div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="header-inner">
                    <div class="header-left">
                        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                        <div>
                            <p class="header-date" id="currentDate">Loading...</p>
                            <p class="header-title">BIU BedCheck</p>

            </header>

                <div class="notice-banner" id="noticeBanner">
                    <i class="fas fa-home"></i>

                    <div class="loading-spinner"><i class="fas fa-spinner"></i></div>

            </div>

    </div>

    <script>
        (function() {
            'use strict';

            const API_BASE = 'https://bedcheck-biu.onrender.com/api';

            let currentUser = null;
            let hostelData = null;
            let students = [];
            let staff = [];
            let floors = [];
            let rooms = [];
            let bedSpaces = [];
            let sessionData = null;
            let alerts = [];
            let scans = [];
            let pendingCases = [];
            let qrData = null;
            let clockInterval = null;

            const screenContent = document.getElementById('screenContent');
            const noticeText = document.getElementById('noticeText');
            const roleLabel = document.getElementById('roleLabel');
            const roleScope = document.getElementById('roleScope');
            const profileAvatar = document.getElementById('profileAvatar');
            const profileName = document.getElementById('profileName');
            const profileRoleLabel = document.getElementById('profileRoleLabel');
            const logoutBtn = document.getElementById('logoutBtn');
            const menuToggle = document.getElementById('menuToggle');

            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => toast.classList.remove('show'), 4000);
            }
            window.showToast = showToast;

            function getStaffId() {
                const userData = sessionStorage.getItem('bedcheck_user');
                if (userData) {
                    try {
                        const user = JSON.parse(userData);
                        return user.id;
                    } catch (e) { return null; }
                }
                return null;
            }

            function getAuthHeaders() {
                const userData = sessionStorage.getItem('bedcheck_user');
                if (userData) {
                    try {
                        const user = JSON.parse(userData);
                        return { 'X-Staff-ID': user.id };
                    } catch (e) { return {}; }
                }
                return {};
            }

            async function apiCall(endpoint, options = {}) {
                try {
                    const headers = {
                        'Content-Type': 'application/json',
                        ...getAuthHeaders(),
                        ...(options.headers || {})
                    };
                    let url = `${API_BASE}${endpoint}`;
                    if (endpoint === '/hra/hostel') {
                        const staffId = getStaffId();
                        if (staffId) url += `?staff_id=${staffId}`;
                    }
                    const response = await fetch(url, { ...options, headers });
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                    const data = await response.json();
                    if (!data.success) throw new Error(data.message || 'API error');
                    return data;
                } catch (error) {
                    showToast('Error: ' + error.message, 'error');
                    throw error;
                }
            }

            function updateUserDisplay() {
                if (currentUser) {
                    const name = currentUser.name || 'User';
                    const initials = currentUser.initials || name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase() ||
                    'U';
                    profileAvatar.textContent = initials;
                    profileName.textContent = name;
                    profileRoleLabel.textContent = currentUser.role || 'HRA';
                    roleLabel.textContent = currentUser.role || 'HRA';
                    if (hostelData) {
                        roleScope.textContent = hostelData.name + ' · Hostel Representative Admin';
                    }
                }
            }

            function setNotice(msg) { noticeText.textContent = msg; }

            function statusBadge(status) {
                const map = {
                    'Active': 'badge-active',
                    'Inactive': 'badge-inactive',
                    'Working': 'badge-active',
                    'Idle': 'badge-pending',
                    'Completed': 'badge-approved',
                    'Not Started': 'badge-pending',
                    'Present': 'badge-approved',
                    'Absent': 'badge-inactive',
                    'Pending': 'badge-pending',
                    'Full': 'badge-approved',
                    'Available': 'badge-pending',
                    'Maintenance': 'badge-inactive'
                };
                return `<span class="badge ${map[status] || 'badge-pending'}">${status || 'Unknown'}</span>`;
            }

            async function loadHostelQR() {
                try {
                    const qrContainer = document.getElementById('qrContainer');
                    if (!qrContainer) return;

                    qrContainer.innerHTML =
                        `<div class="qr-container-loading"><i class="fas fa-spinner"></i> Loading QR...</div>`;

                    try {
                        const hostelId = hostelData?.id;
                        if (!hostelId) {
                            qrContainer.innerHTML =
                                `<div class="qr-container-error"><i class="fas fa-exclamation-triangle"></i> <span>No hostel assigned.</span></div>`;
                            return;
                        }

                        const response = await apiCall(`/qr/hostel/${hostelId}`);
                        const qrDataResult = response.data;

                        if (qrDataResult) {
                            const qrCode = qrDataResult.code;
                            const generatedAt = new Date(qrDataResult.generated_at).toLocaleString();
                            const usageCount = qrDataResult.usage_count || 0;
                            const expiresAt = qrDataResult.expires_at ? new Date(qrDataResult.expires_at).toLocaleDateString() :
                                'Never';
                            const hostelName = qrDataResult.hostel?.name || hostelData?.name || 'Hostel';
                            const createdByName = qrDataResult.created_by_name || 'Unknown';

                            qrContainer.innerHTML = `
                                <div style="padding:0.5rem 0;">
                                    <div class="qr-code-image"><i class="fas fa-qrcode"></i></div>
                                    <div class="font-bold mt-1 text-center" style="font-size:0.8rem;">${hostelName}</div>
                                    <div class="text-xs text-muted text-center">QR: ${qrCode}</div>
                                    <div class="text-xs text-muted text-center">Generated: ${generatedAt}</div>
                                    <div class="text-xs text-muted text-center">Scans: ${usageCount}</div>
                                    <div class="mt-2 flex gap-2" style="justify-content:center;flex-wrap:wrap;">
                                        <button class="btn-primary" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="window.showQRCodeModal()">
                                            <i class="fas fa-qrcode"></i> View QR
                                        </button>
                                        <button class="btn-outline" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="window.downloadQRCode('${qrCode}')">
                                            <i class="fas fa-download"></i> Download
                                        </button>
                                        <button class="btn-outline" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="window.regenerateQRCode()">
                                            <i class="fas fa-sync"></i> Regenerate
                                        </button>
                                    </div>
                                </div>
                            `;
                            qrData = qrDataResult;
                            window._qrData = qrDataResult;

                            const statusBadge = document.getElementById('qrStatusBadge');
                            if (statusBadge) {
                                statusBadge.className = 'badge badge-approved';
                                statusBadge.textContent = '✅ ACTIVE';
                            }
                        } else {
                            qrContainer.innerHTML = `
                                <div class="qr-container-empty">
                                    <div style="width:6rem;height:6rem;margin:0 auto;background:#f5f1e8;border:2px dashed #ded6c9;border-radius:0.5rem;display:grid;place-items:center;font-size:3rem;color:#68768a;">
                                        <i class="fas fa-qrcode"></i>
                                    </div>
                                    <div class="text-sm text-muted mt-2">No QR code generated</div>
                                    <button class="btn-primary mt-2" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="window.generateQRCode()">
                                        <i class="fas fa-plus"></i> Generate QR
                                    </button>
                                </div>
                            `;
                            qrData = null;
                            window._qrData = null;
                            const statusBadge = document.getElementById('qrStatusBadge');
                            if (statusBadge) {
                                statusBadge.className = 'badge badge-pending';
                                statusBadge.textContent = '⏳ NOT GENERATED';
                            }
                        }
                    } catch (error) {
                        if (error.message.includes('404') || error.message.includes('No active QR')) {
                            qrContainer.innerHTML = `
                                <div class="qr-container-empty">
                                    <div style="width:6rem;height:6rem;margin:0 auto;background:#f5f1e8;border:2px dashed #ded6c9;border-radius:0.5rem;display:grid;place-items:center;font-size:3rem;color:#68768a;">
                                        <i class="fas fa-qrcode"></i>
                                    </div>
                                    <div class="text-sm text-muted mt-2">No QR code for this hostel</div>
                                    <button class="btn-primary mt-2" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="window.generateQRCode()">
                                        <i class="fas fa-plus"></i> Generate QR
                                    </button>
                                </div>
                            `;
                        } else {
                            qrContainer.innerHTML =
                                `<div class="qr-container-error"><i class="fas fa-exclamation-triangle"></i> Error: ${error.message}</div>`;
                        }
                        qrData = null;
                        window._qrData = null;
                        const statusBadge = document.getElementById('qrStatusBadge');
                        if (statusBadge) {
                            statusBadge.className = 'badge badge-inactive';
                            statusBadge.textContent = '⚠️ ERROR';
                        }
                    }
                } catch (error) {
                    console.error('QR error:', error);
                    const qrContainer = document.getElementById('qrContainer');
                    if (qrContainer) {
                        qrContainer.innerHTML =
                            `<div class="qr-container-error"><i class="fas fa-exclamation-triangle"></i> Error loading QR</div>`;
                    }
                }
            }
            window.loadHostelQR = loadHostelQR;

            async function generateQRCode() {
                try {
                    const staffId = getStaffId();
                    if (!staffId) { showToast('Staff ID not found', 'error'); return; }
                    const hostelId = hostelData?.id;
                    if (!hostelId) { showToast('No hostel assigned', 'error'); return; }

                    showToast('Generating QR code...', 'info');
                    const response = await apiCall('/qr/generate', {
                        method: 'POST',
                        body: JSON.stringify({ hostel_id: hostelId }),
                        headers: {
                            'X-Staff-Name': currentUser?.name || 'HRA',
                            'X-Staff-Role': currentUser?.role || 'HRA'
                        }
                    });

                    if (response.success) {
                        showToast('QR code generated!', 'success');
                        qrData = response.data;
                        window._qrData = qrData;
                        await loadHostelQR();
                    }
                } catch (error) {
                    showToast('Error: ' + error.message, 'error');
                }
            }
            window.generateQRCode = generateQRCode;

            async function regenerateQRCode() {
                if (!confirm('This will replace the current QR code. Continue?')) return;
                showToast('Regenerating...', 'info');
                const response = await apiCall('/qr/generate', {
                    method: 'POST',
                    body: JSON.stringify({ hostel_id: hostelData?.id }),
                    headers: {
                        'X-Staff-Name': currentUser?.name || 'HRA',
                        'X-Staff-Role': currentUser?.role || 'HRA'
                    }
                });
                if (response.success) {
                    showToast('QR regenerated!', 'success');
                    qrData = response.data;
                    window._qrData = qrData;
                    await loadHostelQR();
                }
            }
            window.regenerateQRCode = regenerateQRCode;

            function showQRCodeModal() {
                const currentQrData = qrData || window._qrData;
                if (!currentQrData) { showToast('No QR code available', 'error'); return; }

                const overlay = document.createElement('div');
                overlay.style.cssText = `
                    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                    background: rgba(0,0,0,0.7); z-index: 1000;
                    display: flex; align-items: center; justify-content: center;
                    cursor: pointer;
                `;
                overlay.onclick = function() { this.remove(); };

                const modal = document.createElement('div');
                modal.style.cssText = `
                    background: white; border-radius: 1rem; padding: 2rem;
                    max-width: 90vw; max-height: 90vh;
                    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
                    position: relative;
                `;
                modal.onclick = function(e) { e.stopPropagation(); };

                const hostelName = currentQrData.hostel?.name || hostelData?.name || 'Hostel';
                const createdByName = currentQrData.created_by_name || 'Unknown';

                modal.innerHTML = `
                    <h3 style="font-family:'Merriweather',serif;margin-bottom:0.5rem;">${hostelName} QR Code</h3>
                    <div style="width:200px;height:200px;margin:0 auto;background:#fff;border:2px solid #ded6c9;border-radius:0.5rem;display:grid;place-items:center;font-size:6rem;color:#10233f;">
                        <i class="fas fa-qrcode"></i>
                    </div>
                    <div style="margin-top:0.5rem;font-size:0.8rem;font-weight:600;">${currentQrData.code}</div>
                    <div style="font-size:0.7rem;color:#68768a;">Generated: ${new Date(currentQrData.generated_at).toLocaleString()}</div>
                    <div style="font-size:0.7rem;color:#68768a;">Created by: ${createdByName}</div>
                    <button class="btn-primary mt-3" onclick="this.closest('div[style]').parentElement.remove()" style="font-size:0.8rem;padding:0.4rem 1.5rem;">
                        Close
                    </button>
                `;
                overlay.appendChild(modal);
                document.body.appendChild(overlay);
            }
            window.showQRCodeModal = showQRCodeModal;

            function downloadQRCode(qrCode) {
                if (!qrCode) { showToast('No QR code', 'error'); return; }
                showToast(`Downloading QR: ${qrCode}`, 'success');
            }
            window.downloadQRCode = downloadQRCode;

            function startClock() {
                if (clockInterval) clearInterval(clockInterval);
                clockInterval = setInterval(() => {
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    const heroClock = document.getElementById('heroClock');
                    const heroCountdown = document.getElementById('heroCountdown');
                    if (heroClock) heroClock.textContent = timeStr;

                    const end = new Date();
                    end.setHours(23, 59, 59, 0);
                    const diff = Math.max(0, Math.floor((end - now) / 1000));
                    const hrs = Math.floor(diff / 3600);
                    const mins = Math.floor((diff % 3600) / 60);
                    const secs = diff % 60;
                    const countdownStr = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                    if (heroCountdown) heroCountdown.textContent = `⏱ ${countdownStr}`;
                }, 1000);
            }

            // ===== RENDER =====
            async function renderDashboard() {
                if (!hostelData) {
                    screenContent.innerHTML = `
                        <div class="card mt-4">
                            <div class="text-center p-4">
                                <i class="fas fa-building" style="font-size:3rem;color:#b9c7db;"></i>
                                <h2 class="mt-3">No Hostel Assigned</h2>
                                <p class="text-muted">You are not assigned to any hostel. Please contact the administrator.</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                const now = new Date();
                const hostelName = hostelData.name || 'Your Hostel';
                const totalStudents = students.length;
                const present = students.filter(s => s.status === 'Present' || s.status === 'Verified').length;
                const absent = students.filter(s => s.status === 'Absent').length;
                const late = students.filter(s => s.status === 'Late').length;
                const assigned = students.filter(s => s.room_id !== null && s.room_id > 0).length;
                const verified = present;
                const completion = totalStudents > 0 ? Math.round((verified / totalStudents) * 100) : 0;

                const hasSession = sessionData !== null && sessionData.status === 'Active';
                const sessionStart = sessionData?.start_time || '10:00 PM';
                const sessionEnd = sessionData?.end_time || '12:00 AM';

                const hour = now.getHours();
                let greeting = 'Good Evening';
                if (hour < 12) greeting = 'Good Morning';
                else if (hour < 17) greeting = 'Good Afternoon';

                const floorData = floors.map(f => {
                    const floorStudents = students.filter(s => s.floor_flat_id === f.id);
                    const total = floorStudents.length;
                    const checked = floorStudents.filter(s => s.status === 'Present' || s.status === 'Verified').length;
                    const progress = total > 0 ? Math.round((checked / total) * 100) : 0;
                    const ra = staff.find(s => s.assigned_floor === f.id && (s.role === 'RA' || s.role === 'Resident Advisor'));
                    return {
                        name: f.name || 'Floor ' + f.id,
                        total: total,
                        checked: checked,
                        progress: progress,
                        ra: ra?.name || 'Not assigned',
                        status: progress === 100 ? 'Completed' : progress > 50 ? 'In progress' : 'Pending'
                    };
                });

                pendingCases = students
                    .filter(s => s.status === 'Absent' || s.status === 'Late' || (s.room_id === null || s.room_id === 0))
                    .slice(0, 4)
                    .map(s => ({
                        id: s.matric || s.id,
                        name: s.name || 'Unknown',
                        desc: s.status === 'Absent' ? 'Absent without clearance' :
                            s.status === 'Late' ? 'Late return after curfew' :
                            'Room mismatch during scan',
                        urgency: s.status === 'Absent' ? 'Urgent' :
                            s.status === 'Late' ? 'Review' : 'Investigate'
                    }));

                const recentActivity = scans.slice(0, 5).map(s => {
                    const student = students.find(st => st.id === s.student_id);
                    const time = new Date(s.created_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                    let text = `${student?.name || 'Unknown'} ${s.status === 'Verified' ? 'verified' : 'scanned'}`;
                    let detail = s.room || '';
                    return { time, text, detail, status: s.status };
                });

                if (recentActivity.length === 0) {
                    staff.filter(s => s.role === 'RA' || s.role === 'Resident Advisor').forEach(ra => {
                        if (ra.submission_status && ra.submission_status !== 'Not Started') {
                            recentActivity.push({
                                time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
                                text: `${ra.name} submitted floor report`,
                                detail: ra.assigned_floor || '',
                                status: 'Submitted'
                            });
                        }
                    });
                }

                let hostelRoomCount = 0;
                let hostelBedCount = 0;
                let hostelOccupiedBeds = 0;
                let hostelAvailableBeds = 0;

                const roomsByFloor = {};
                const floorIds = floors.map(f => f.id);
                rooms.forEach(room => {
                    const floorId = room.floor_flat_id;
                    if (!floorIds.includes(floorId)) return;
                    if (!roomsByFloor[floorId]) {
                        const floor = floors.find(f => f.id === floorId);
                        roomsByFloor[floorId] = { floorName: floor?.name || 'Unknown Floor', rooms: [] };
                    }
                    const roomBedSpaces = bedSpaces.filter(b => b.room_id === room.id);
                    const occupied = roomBedSpaces.filter(b => b.status === 'occupied' || b.student_id !== null).length;
                    const capacity = roomBedSpaces.length || 0;
                    const available = capacity - occupied;
                    let status = 'No Beds';
                    if (capacity > 0) {
                        if (occupied === capacity) status = 'Full';
                        else if (occupied > 0 && available > 0) status = 'Partial';
                        else if (available === capacity) status = 'Available';
                    }
                    roomsByFloor[floorId].rooms.push({
                        code: room.room_code || 'Room ' + room.id,
                        capacity: capacity,
                        occupied: occupied,
                        available: available,
                        status: status
                    });
                    hostelRoomCount++;
                    hostelBedCount += capacity;
                    hostelOccupiedBeds += occupied;
                    hostelAvailableBeds += available;
                });

                let roomTableHtml = '';
                if (Object.keys(roomsByFloor).length > 0) {
                    const sortedFloorKeys = Object.keys(roomsByFloor).sort((a, b) => {
                        const nameA = roomsByFloor[a].floorName;
                        const nameB = roomsByFloor[b].floorName;
                        return nameA.localeCompare(nameB);
                    });
                    sortedFloorKeys.forEach(floorId => {
                        const floorGroup = roomsByFloor[floorId];
                        roomTableHtml += `
                            <div class="floor-group" style="margin-bottom:0.75rem;">
                                <div style="display:flex;justify-content:space-between;align-items:center;padding:0.3rem 0.75rem;background:#f0ebe3;border-radius:0.4rem;font-weight:600;font-size:0.8rem;margin-bottom:0.25rem;">
                                    <span>${floorGroup.floorName}</span>
                                    <span style="font-size:0.65rem;color:#68768a;font-weight:400;">${floorGroup.rooms.length} rooms</span>
                                </div>
                                ${floorGroup.rooms.map(r => `
                                    <div style="display:grid;grid-template-columns:1fr 0.8fr 0.8fr 0.8fr 0.8fr 0.8fr;padding:0.3rem 0.75rem;font-size:0.8rem;border-bottom:1px solid #f5f1e8;align-items:center;">
                                        <span style="font-weight:600;">${r.code}</span>
                                        <span>${r.capacity}</span>
                                        <span>${r.occupied}</span>
                                        <span>${r.available}</span>
                                        <span>${statusBadge(r.status)}</span>
                                        <span><button class="btn-ghost" style="font-size:0.6rem;" onclick="showToast('Viewing ${r.code}','info')">View</button></span>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    });
                } else {
                    roomTableHtml = '<p class="text-muted text-sm">No rooms found</p>';
                }

                const html = `
                    <div class="hero-header">
                        <div class="hero-left">
                            <div class="hostel-name">${hostelName}</div>
                            <div class="hostel-sub">
                                <span class="badge ${hasSession ? 'badge-live' : 'badge-inactive'}" style="font-size:0.7rem;">
                                    ${hasSession ? '🟢 BEDCHECK LIVE' : '⏳ No Active Session'}
                                </span>
                                <span>· ${hostelData.type || 'Hostel'}</span>
                                <span>· ${totalStudents} students</span>
                            </div>
                            <div class="greeting">${greeting}, <span class="highlight">${currentUser?.name || 'HRA'}</span></div>
                        </div>
                        <div class="hero-right">
                            <div class="clock" id="heroClock">--:--:--</div>
                            <div class="clock-label">Night Session · ${sessionStart} — ${sessionEnd}</div>
                            <div class="countdown" id="heroCountdown">⏱ --:--:--</div>
                        </div>
                    </div>

                    <div class="stat-card-grid">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-users"></i></div>
                            <div class="stat-number">${totalStudents}</div>
                            <div class="stat-label">Total Students</div>
                            <div class="stat-sub">Registered students</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-check-circle" style="color:#2d6545;"></i></div>
                            <div class="stat-number" style="color:#2d6545;">${present}</div>
                            <div class="stat-label">Present</div>
                            <div class="stat-sub">Currently present</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-times-circle" style="color:#a84134;"></i></div>
                            <div class="stat-number" style="color:#a84134;">${absent}</div>
                            <div class="stat-label">Absent</div>
                            <div class="stat-sub">Currently absent</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-clock" style="color:#d97706;"></i></div>
                            <div class="stat-number" style="color:#d97706;">${late}</div>
                            <div class="stat-label">Late</div>
                            <div class="stat-sub">Late arrivals</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-globe"></i></div>
                            <div class="stat-number">${students.length}</div>
                            <div class="stat-label">Online Registered</div>
                            <div class="stat-sub">Total registrations</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-home" style="color:#2d6545;"></i></div>
                            <div class="stat-number" style="color:#2d6545;">${assigned}</div>
                            <div class="stat-label">Assigned Hostel</div>
                            <div class="stat-sub">With hostel assignment</div>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="card">
                            <div class="flex-between">
                                <div class="card-title" style="font-size:1rem;">Active BedCheck Session</div>
                                <span class="badge ${hasSession ? 'badge-live' : 'badge-inactive'}" style="font-size:0.7rem;">${hasSession ? 'LIVE' : 'INACTIVE'}</span>
                            </div>
                            <div class="mt-2">
                                <div class="flex-between"><span class="text-muted">Session</span><span class="font-bold">Night BedCheck</span></div>
                                <div class="flex-between"><span class="text-muted">Time</span><span class="font-bold">${sessionStart} — ${sessionEnd}</span></div>
                                <div class="flex-between"><span class="text-muted">Progress</span><span class="font-bold">${completion}%</span></div>
                                <div class="flex-between"><span class="text-muted">Students Checked</span><span class="font-bold">${verified} / ${totalStudents}</span></div>
                                <div class="progress-bar mt-1"><div class="fill" style="width:${completion}%;background:${completion === 100 ? '#2d6545' : '#d6ad4b'};"></div></div>
                                <div class="mt-2 text-sm" style="color:#d6ad4b;">
                                    <i class="fas fa-check-circle"></i> ${hasSession ? 'Session running normally' : 'No active session'}
                                </div>
                            </div>
                            <div class="mt-3 flex gap-2" style="flex-wrap:wrap;">
                                <button class="btn-primary" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="showToast('Viewing session details','info')"><i class="fas fa-eye"></i> View Session</button>
                                ${hasSession ? `<button class="btn-outline" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="showToast('Auto-close triggered','success')"><i class="fas fa-lock"></i> Auto-close</button>` : ''}
                            </div>
                        </div>

                        <div class="card">
                            <div class="flex-between">
                                <div class="card-title" style="font-size:1rem;">Hostel QR Code</div>
                                <span id="qrStatusBadge" class="badge badge-pending" style="font-size:0.7rem;">⏳ LOADING...</span>
                            </div>
                            <div id="qrContainer">
                                <div class="loading-spinner" style="padding:1rem;">
                                    <i class="fas fa-spinner"></i> Loading QR...
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card mt-4">
                        <div class="flex-between">
                            <div class="card-title" style="font-size:1rem;">Floor / Flat Status</div>
                            <span class="badge badge-approved" style="font-size:0.6rem;">${floors.length} ${hostelData.type === 'flat' ? 'Flats' : 'Floors'}</span>
                        </div>
                        <div class="grid-2 mt-2">
                            ${floorData.length > 0 ? floorData.map(f => `
                                <div class="floor-card" onclick="showToast('Viewing ${f.name} details','info')">
                                    <div class="flex-between">
                                        <span class="floor-name">${f.name}</span>
                                        <span class="badge ${f.status === 'Completed' ? 'badge-approved' : f.status === 'In progress' ? 'badge-pending' : 'badge-inactive'}" style="font-size:0.55rem;">${f.status}</span>
                                    </div>
                                    <div class="floor-stats">
                                        <span>${f.checked} / ${f.total}</span>
                                        <span class="floor-progress">
                                            <div class="progress-bar"><div class="fill" style="width:${f.progress}%;background:${f.progress === 100 ? '#2d6545' : '#d6ad4b'};"></div></div>
                                        </span>
                                        <span style="font-weight:600;font-size:0.7rem;">${f.progress}%</span>
                                    </div>
                                    <div class="floor-ra">RA: ${f.ra}</div>
                                </div>
                            `).join('') : '<p class="text-muted text-sm">No floors configured</p>'}
                        </div>
                    </div>

                    <div class="card mt-4">
                        <div class="flex-between">
                            <div class="card-title" style="font-size:1rem;">Room Occupancy & Bed Availability</div>
                            <span class="text-xs text-muted">${hostelRoomCount} rooms · ${hostelBedCount} beds (${hostelOccupiedBeds} occupied · ${hostelAvailableBeds} available)</span>
                        </div>
                        <div class="mt-2">
                            <div style="display:grid;grid-template-columns:1fr 0.8fr 0.8fr 0.8fr 0.8fr 0.8fr;padding:0.4rem 0.75rem;font-weight:700;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.05em;color:#68768a;border-bottom:2px solid #ded6c9;background:#fbf7ef;border-radius:0.4rem 0.4rem 0 0;">
                                <span>Room</span><span>Capacity</span><span>Occupied</span><span>Available</span><span>Status</span><span>Action</span>
                            </div>
                            ${roomTableHtml}
                        </div>
                    </div>

                    <div class="grid-2 mt-4">
                        <div class="card">
                            <div class="flex-between">
                                <div class="card-title" style="font-size:1rem;">Pending Cases</div>
                                <span class="badge badge-urgent" style="font-size:0.7rem;">${pendingCases.length}</span>
                            </div>
                            <div class="scrollable-section mt-2">
                                ${pendingCases.length > 0 ? pendingCases.map(c => `
                                    <div class="case-item">
                                        <div class="case-details">
                                            <div class="case-id">${c.name}</div>
                                            <div class="case-desc">${c.desc}</div>
                                        </div>
                                        <div class="case-action">
                                            <span class="badge ${c.urgency === 'Urgent' ? 'badge-urgent' : c.urgency === 'Review' ? 'badge-review' : 'badge-pending'}" style="font-size:0.5rem;">${c.urgency}</span>
                                        </div>
                                    </div>
                                `).join('') : '<p class="text-muted text-sm">No pending cases</p>'}
                            </div>
                            <div class="mt-2">
                                <button class="btn-ghost" style="font-size:0.7rem;" onclick="showToast('Opening all cases','info')"><i class="fas fa-chevron-right"></i> Open all cases</button>
                            </div>
                        </div>

                        <div class="card">
                            <div class="flex-between">
                                <div class="card-title" style="font-size:1rem;">Recent Activity</div>
                                <span class="badge badge-approved" style="font-size:0.6rem;"><span class="status-dot green"></span> Live</span>
                            </div>
                            <div class="scrollable-section mt-2">
                                ${recentActivity.length > 0 ? recentActivity.map(a => `
                                    <div class="activity-item">
                                        <span class="activity-time">${a.time}</span>
                                        <div class="activity-text">
                                            <span class="highlight">${a.text}</span>
                                            ${a.detail ? `· ${a.detail}` : ''}
                                        </div>
                                        <span class="badge ${a.status === 'Verified' || a.status === 'Present' ? 'badge-approved' : a.status === 'Late' ? 'badge-pending' : 'badge-inactive'}" style="font-size:0.5rem;">${a.status || 'Done'}</span>
                                    </div>
                                `).join('') : '<p class="text-muted text-sm">No recent activity</p>'}
                            </div>
                        </div>
                    </div>

                    <div class="action-bar mt-4">
                        <div class="action-group">
                            <button class="btn-primary" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="showToast('Opening RA submissions review','info')"><i class="fas fa-check-double"></i> Review RA submissions</button>
                            <button class="btn-outline" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="showToast('Generating nightly report','success')"><i class="fas fa-file-alt"></i> Generate report</button>
                            <button class="btn-outline" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="showToast('Downloading hostel QR','success')"><i class="fas fa-qrcode"></i> Download QR</button>
                        </div>
                        <div class="text-xs text-muted">
                            <i class="fas fa-clock"></i> Auto-close: ${sessionEnd || '12:00 AM'}
                        </div>
                    </div>

                    <div class="mt-6 pt-4 border-t text-center">
                        <p class="text-xs text-muted">
                            BIU BedCheck System v1.0 · © Benson Idahosa University
                            <span class="ml-4"><span class="status-dot green"></span> System Online</span>
                        </p>
                    </div>
                `;

                screenContent.innerHTML = html;
                startClock();

                setTimeout(() => { loadHostelQR(); }, 500);
            }

            // ===== DATA LOADING =====
            async function loadAllData() {
                try {
                    const userData = sessionStorage.getItem('bedcheck_user') || localStorage.getItem('bedcheck_user');
                    if (!userData) { window.location.replace('../Login.html'); return; }
                    try {
                        currentUser = JSON.parse(userData);
                        if (!sessionStorage.getItem('bedcheck_user')) sessionStorage.setItem('bedcheck_user', userData);
                        if (!currentUser.id) { showToast('User data incomplete', 'error');
                            setTimeout(() => window.location.replace('../Login.html'), 2000); return; }
                    } catch (e) { window.location.replace('../Login.html'); return; }
                    updateUserDisplay();

                    const hostelRes = await apiCall(`/hra/hostel`);
                    hostelData = hostelRes.data;
                    if (!hostelData) {
                        roleScope.textContent = 'No hostel assigned';
                        showToast('No hostel assigned', 'error');
                        renderDashboard();
                        return;
                    }
                    roleScope.textContent = hostelData.name + ' · Hostel Representative Admin';
                    document.getElementById('mobileRoleFooter').textContent = `HRA · ${hostelData.name} Hostel`;
                    setNotice(`${hostelData.name} · HRA Dashboard`);
                    updateUserDisplay();

                    const [studentsRes, staffRes, floorsRes, roomsRes, bedRes, sessionRes, alertRes, scanRes] = await Promise
                        .all([
                            apiCall(`/hostels/${hostelData.id}/students`).catch(() => ({ data: [] })),
                            apiCall(`/hostels/${hostelData.id}/staff`).catch(() => ({ data: [] })),
                            apiCall(`/floors-flats?hostel_id=${hostelData.id}`).catch(() => ({ data: [] })),
                            apiCall(`/rooms?hostel_id=${hostelData.id}`).catch(() => ({ data: [] })),
                            apiCall(`/bed-spaces?hostel_id=${hostelData.id}`).catch(() => ({ data: [] })),
                            apiCall(`/hostels/${hostelData.id}/session`).catch(() => ({ data: null })),
                            apiCall(`/hostels/${hostelData.id}/alerts`).catch(() => ({ data: [] })),
                            apiCall(`/bedcheck/scans?hostel_id=${hostelData.id}`).catch(() => ({ data: [] }))
                        ]);

                    students = studentsRes.data || [];
                    staff = staffRes.data || [];
                    floors = floorsRes.data || [];
                    rooms = roomsRes.data || [];
                    bedSpaces = bedRes.data || [];
                    sessionData = sessionRes.data || null;
                    alerts = alertRes.data || [];
                    scans = scanRes.data || [];

                    const now = new Date();
                    document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    renderDashboard();
                } catch (error) {
                    console.error('Load error:', error);
                    showToast('Error loading data: ' + error.message, 'error');
                    setNotice('Error loading dashboard data. Please refresh.');
                    screenContent.innerHTML = `
                        <div class="card mt-4" style="border-color:#a84134;background:#f9e2de;">
                            <div class="text-center p-4">
                                <i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#a84134;"></i>
                                <h2 class="mt-3">Error Loading Data</h2>
                                <p class="text-muted">${error.message}</p>
                                <button class="btn-primary mt-3" onclick="location.reload()"><i class="fas fa-refresh"></i> Refresh</button>
                            </div>
                        </div>
                    `;
                }
            }

            function handleLogout() {
                sessionStorage.removeItem('bedcheck_user');
                localStorage.removeItem('bedcheck_user');
                showToast('Logging out...', 'success');
                setTimeout(() => window.location.replace('../Login.html'), 500);
            }

            function openMobileDrawer() {
                document.getElementById('mobileDrawer').classList.add('open');
                document.getElementById('drawerOverlay').classList.add('show');
            }

            function closeMobileDrawer() {
                document.getElementById('mobileDrawer').classList.remove('open');
                document.getElementById('drawerOverlay').classList.remove('show');
            }

            function init() {
                const userData = sessionStorage.getItem('bedcheck_user') || localStorage.getItem('bedcheck_user');
                if (!userData) { window.location.replace('../Login.html'); return; }
                try {
                    currentUser = JSON.parse(userData);
                    if (!sessionStorage.getItem('bedcheck_user')) sessionStorage.setItem('bedcheck_user', userData);
                    if (!currentUser.id) { showToast('User data incomplete', 'error');
                        setTimeout(() => window.location.replace('../Login.html'), 2000); return; }
                    updateUserDisplay();
                    loadAllData();
                } catch (e) { console.error('Error parsing user data:', e);
                    window.location.replace('../Login.html'); }

                logoutBtn.addEventListener('click', handleLogout);
                menuToggle.addEventListener('click', openMobileDrawer);
                document.getElementById('closeDrawer').addEventListener('click', closeMobileDrawer);
                document.getElementById('drawerOverlay').addEventListener('click', closeMobileDrawer);
            }

            window.loadHostelQR = loadHostelQR;
            window.generateQRCode = generateQRCode;
            window.regenerateQRCode = regenerateQRCode;
            window.showQRCodeModal = showQRCodeModal;
            window.downloadQRCode = downloadQRCode;
            window.showToast = showToast;
            window.loadAllData = loadAllData;

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>

</body>
</html>
