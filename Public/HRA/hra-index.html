        ::-webkit-scrollbar-thumb:hover { background: #c49a2a; }

</head>

            <nav id="mobileNav">
                <a href="hra-index.html" class="nav-item active"><i class="fas fa-home"></i> Dashboard</a>
                <a href="MyHostel.html" class="nav-item"><i class="fas fa-building"></i> My Hostel</a>
                <a href="ReviewBedCheck.html" class="nav-item"><i class="fas fa-clipboard-check"></i> Review BedCheck</a>
                <a href="Reports.html" class="nav-item"><i class="fas fa-chart-bar"></i> Reports</a>

                </div>

        </main>

    <script>
        (function() {
            'use strict';

            const API_BASE = 'https://bedcheck-biu.onrender.com/api';

            let currentUser = null;
            let hostelData = null;
            let students = [];
            let staff = [];
            let floors = [];
            let rooms = [];
            let scans = [];
            let sessionData = null;
            let clockInterval = null;

            const screenContent = document.getElementById('screenContent');
            const noticeText = document.getElementById('noticeText');
            const roleLabel = document.getElementById('roleLabel');
            const roleScope = document.getElementById('roleScope');
            const profileAvatar = document.getElementById('profileAvatar');
            const profileName = document.getElementById('profileName');
            const profileRoleLabel = document.getElementById('profileRoleLabel');
            const logoutBtn = document.getElementById('logoutBtn');
            const menuToggle = document.getElementById('menuToggle');

            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => toast.classList.remove('show'), 4000);
            }
            window.showToast = showToast;

            function getStaffId() {
                const userData = sessionStorage.getItem('bedcheck_user');
                if (userData) {
                    try {
                        const user = JSON.parse(userData);
                        return user.id;
                    } catch (e) { return null; }
                }
                return null;
            }

            function getAuthHeaders() {
                const userData = sessionStorage.getItem('bedcheck_user');
                if (userData) {
                    try {
                        const user = JSON.parse(userData);
                        return { 'X-Staff-ID': user.id };
                    } catch (e) { return {}; }
                }
                return {};
            }

            async function apiCall(endpoint, options = {}) {
                try {
                    const headers = {
                        'Content-Type': 'application/json',
                        ...getAuthHeaders(),
                        ...(options.headers || {})
                    };
                    let url = `${API_BASE}${endpoint}`;
                    if (endpoint === '/hra/hostel') {
                        const staffId = getStaffId();
                        if (staffId) url += `?staff_id=${staffId}`;
                    }
                    const response = await fetch(url, { ...options, headers });
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                    const data = await response.json();
                    if (!data.success) throw new Error(data.message || 'API error');
                    return data;
                } catch (error) {
                    showToast('Error: ' + error.message, 'error');
                    throw error;
                }
            }

            function updateUserDisplay() {
                if (currentUser) {
                    const name = currentUser.name || 'User';
                    const initials = currentUser.initials || name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase() ||
                    'U';
                    profileAvatar.textContent = initials;
                    profileName.textContent = name;
                    profileRoleLabel.textContent = currentUser.role || 'HRA';
                    roleLabel.textContent = currentUser.role || 'HRA';
                    if (hostelData) {
                        roleScope.textContent = hostelData.name + ' · Hostel Representative Admin';
                    }
                }
            }

            function setNotice(msg) { noticeText.textContent = msg; }

            function statusBadge(status) {
                const map = {
                    'Active': 'badge-active',
                    'Inactive': 'badge-inactive',
                    'Working': 'badge-active',
                    'Idle': 'badge-pending',
                    'Completed': 'badge-approved',
                    'Not Started': 'badge-pending',
                    'Present': 'badge-approved',
                    'Absent': 'badge-inactive',
                    'Pending': 'badge-pending',
                    'Full': 'badge-approved',
                    'Available': 'badge-pending',
                    'Maintenance': 'badge-inactive',
                    'Scanning': 'badge-live',
                    'Submitted': 'badge-approved',
                    'Waiting': 'badge-pending',
                    'Needs Review': 'badge-review'
                };
                return `<span class="badge ${map[status] || 'badge-pending'}">${status || 'Unknown'}</span>`;
            }

            function startClock() {
                if (clockInterval) clearInterval(clockInterval);
                clockInterval = setInterval(() => {
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    const heroClock = document.getElementById('heroClock');
                    const heroCountdown = document.getElementById('heroCountdown');
                    if (heroClock) heroClock.textContent = timeStr;

                    const end = new Date();
                    end.setHours(23, 59, 59, 0);
                    const diff = Math.max(0, Math.floor((end - now) / 1000));
                    const hrs = Math.floor(diff / 3600);
                    const mins = Math.floor((diff % 3600) / 60);
                    const secs = diff % 60;
                    const countdownStr = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                    if (heroCountdown) heroCountdown.textContent = `⏱ ${countdownStr}`;
                }, 1000);
            }

            // ===== RENDER DASHBOARD =====
            async function renderDashboard() {
                if (!hostelData) {
                    screenContent.innerHTML = `
                        <div class="card mt-4">
                            <div class="text-center p-4">
                                <i class="fas fa-building" style="font-size:3rem;color:#b9c7db;"></i>
                                <h2 class="mt-3">No Hostel Assigned</h2>
                                <p class="text-muted">You are not assigned to any hostel. Please contact the administrator.</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                const now = new Date();
                const hostelName = hostelData.name || 'Your Hostel';
                const totalStudents = students.length;
                const present = students.filter(s => s.status === 'Present' || s.status === 'Verified').length;
                const verified = present;
                const pending = totalStudents - verified;
                const completion = totalStudents > 0 ? Math.round((verified / totalStudents) * 100) : 0;

                const roomsCompleted = rooms.filter(r => {
                    const roomStudents = students.filter(s => s.room_id === r.id);
                    return roomStudents.length > 0 && roomStudents.every(s => s.status === 'Present' || s.status === 'Verified');
                }).length;
                const totalRoomsWithStudents = rooms.filter(r => students.some(s => s.room_id === r.id)).length;

                const raStaff = staff.filter(s => s.role === 'RA' || s.role === 'Resident Advisor');
                const onlineRA = raStaff.filter(s => s.submission_status && s.submission_status !== 'Not Started').length;

                const faceMatches = scans.filter(s => s.status === 'Verified' || s.status === 'Present').length;
                const lowConfidence = scans.filter(s => s.confidence && s.confidence < 85).length;
                const identityMismatch = scans.filter(s => s.mismatch === true).length;

                const avgConfidence = scans.length > 0 ?
                    Math.round(scans.reduce((sum, s) => sum + (s.confidence || 0), 0) / scans.length) : 0;

                const hasSession = sessionData !== null && sessionData.status === 'Active';
                const sessionStart = sessionData?.start_time || '10:00 PM';
                const sessionEnd = sessionData?.end_time || '11:30 PM';

                const hour = now.getHours();
                let greeting = 'Good Evening';
                if (hour < 12) greeting = 'Good Morning';
                else if (hour < 17) greeting = 'Good Afternoon';

                // Floor/Flat Progress
                const floorData = floors.map(f => {
                    const floorStudents = students.filter(s => s.floor_flat_id === f.id);
                    const total = floorStudents.length;
                    const checked = floorStudents.filter(s => s.status === 'Present' || s.status === 'Verified').length;
                    const progress = total > 0 ? Math.round((checked / total) * 100) : 0;
                    const ra = staff.find(s => s.assigned_floor === f.id && (s.role === 'RA' || s.role === 'Resident Advisor'));
                    return {
                        name: f.name || 'Floor ' + f.id,
                        total: total,
                        checked: checked,
                        progress: progress,
                        ra: ra?.name || 'Not assigned',
                        status: progress === 100 ? 'Completed' : progress > 50 ? 'In progress' : 'Pending',
                        rooms: rooms.filter(r => r.floor_flat_id === f.id).length
                    };
                });

                // RA Activity
                const raActivity = raStaff.map(ra => {
                    const area = ra.assigned_floor ? floors.find(f => f.id === ra.assigned_floor) : null;
                    const areaName = area?.name || 'Unassigned';
                    const status = ra.submission_status || 'Not Started';
                    let statusDisplay = 'Waiting';
                    if (status === 'Completed' || status === 'Submitted') statusDisplay = '✅ Submitted';
                    else if (status === 'In Progress') statusDisplay = '🟢 Scanning';
                    else if (status === 'Not Started') statusDisplay = '⏳ Waiting';
                    else if (status === 'Needs Review') statusDisplay = '⚠️ Needs Review';
                    return {
                        name: ra.name,
                        room: areaName,
                        status: statusDisplay,
                        rawStatus: status
                    };
                });

                // Pending Rooms (rooms with students not fully verified)
                const pendingRooms = rooms.filter(r => {
                    const roomStudents = students.filter(s => s.room_id === r.id);
                    return roomStudents.length > 0 && !roomStudents.every(s => s.status === 'Present' || s.status === 'Verified');
                }).slice(0, 4).map(r => {
                    const roomStudents = students.filter(s => s.room_id === r.id);
                    const verifiedCount = roomStudents.filter(s => s.status === 'Present' || s.status === 'Verified').length;
                    const totalCount = roomStudents.length;
                    const ra = staff.find(s => s.assigned_floor === r.floor_flat_id && (s.role === 'RA' || s.role ===
                        'Resident Advisor'));
                    return {
                        room: r.room_code || 'Room ' + r.id,
                        ra: ra?.name || 'Unknown',
                        verified: verifiedCount,
                        total: totalCount,
                        lowConfidence: roomStudents.filter(s => s.confidence && s.confidence < 85).length,
                        mismatch: roomStudents.filter(s => s.mismatch === true).length
                    };
                });

                // AI Alerts
                const aiAlerts = [];
                scans.forEach(s => {
                    if (s.confidence && s.confidence < 80) {
                        const student = students.find(st => st.id === s.student_id);
                        aiAlerts.push({
                            type: 'low-confidence',
                            title: `Low Confidence`,
                            desc: `${student?.name || 'Student'} matched at ${s.confidence}%`,
                            room: s.room || 'Unknown'
                        });
                    }
                    if (s.mismatch === true) {
                        const student = students.find(st => st.id === s.student_id);
                        aiAlerts.push({
                            type: 'mismatch',
                            title: `Identity Mismatch`,
                            desc: `Expected ${student?.name || 'Unknown'}`,
                            room: s.room || 'Unknown'
                        });
                    }
                });
                // Add some sample alerts if none exist
                if (aiAlerts.length === 0 && scans.length > 0) {
                    aiAlerts.push({
                        type: 'info',
                        title: 'All Systems Normal',
                        desc: `${scans.length} face matches recorded`,
                        room: ''
                    });
                }

                // Recent Activity
                const recentActivity = scans.slice(0, 5).map(s => {
                    const student = students.find(st => st.id === s.student_id);
                    const time = new Date(s.created_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                    let text = `${student?.name || 'Student'} verified at ${s.confidence || 97}%`;
                    return { time, text, status: s.status };
                });

                if (recentActivity.length === 0) {
                    raStaff.forEach(ra => {
                        if (ra.submission_status && ra.submission_status !== 'Not Started') {
                            recentActivity.push({
                                time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
                                text: `${ra.name} submitted ${ra.assigned_floor ? 'floor' : 'area'} report`,
                                status: 'Submitted'
                            });
                        }
                    });
                }

                const html = `
                    <!-- HERO HEADER -->
                    <div class="hero-header">
                        <div class="hero-left">
                            <div class="hostel-name">${hostelName}</div>
                            <div class="hostel-sub">
                                <span class="badge ${hasSession ? 'badge-live' : 'badge-inactive'}" style="font-size:0.7rem;">
                                    ${hasSession ? '🟢 BEDCHECK LIVE' : '⏳ No Active Session'}
                                </span>
                                <span>· ${hostelData.type || 'Hostel'}</span>
                                <span>· ${totalStudents} students</span>
                            </div>
                            <div class="greeting">${greeting}, <span class="highlight">${currentUser?.name || 'HRA'}</span></div>
                        </div>
                        <div class="hero-right">
                            <div class="clock" id="heroClock">--:--:--</div>
                            <div class="clock-label">Night Session · ${sessionStart} — ${sessionEnd}</div>
                            <div class="countdown" id="heroCountdown">⏱ --:--:--</div>
                        </div>
                    </div>

                    <!-- TOP STATISTICS - 8 Cards -->
                    <div class="stat-card-grid">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-users"></i></div>
                            <div class="stat-number">${totalStudents}</div>
                            <div class="stat-label">Students</div>
                            <div class="stat-sub">Total</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-check-circle" style="color:#2d6545;"></i></div>
                            <div class="stat-number" style="color:#2d6545;">${verified}</div>
                            <div class="stat-label">Verified</div>
                            <div class="stat-sub">${completion}%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-hourglass-half" style="color:#d97706;"></i></div>
                            <div class="stat-number" style="color:#d97706;">${pending}</div>
                            <div class="stat-label">Pending</div>
                            <div class="stat-sub">Not verified</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-door-open" style="color:#a77915;"></i></div>
                            <div class="stat-number" style="color:#a77915;">${roomsCompleted} / ${totalRoomsWithStudents}</div>
                            <div class="stat-label">Rooms Completed</div>
                            <div class="stat-sub">${totalRoomsWithStudents > 0 ? Math.round((roomsCompleted/totalRoomsWithStudents)*100) : 0}%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-wifi" style="color:#2563eb;"></i></div>
                            <div class="stat-number" style="color:#2563eb;">${onlineRA}</div>
                            <div class="stat-label">RA Online</div>
                            <div class="stat-sub">/${raStaff.length}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-fingerprint" style="color:#a77915;"></i></div>
                            <div class="stat-number" style="color:#a77915;">${faceMatches}</div>
                            <div class="stat-label">Face Matches</div>
                            <div class="stat-sub">Verified</div>
                        </div>
                        <div class="stat-card" style="border-left:3px solid #f59e0b;">
                            <div class="stat-icon"><i class="fas fa-exclamation-triangle" style="color:#f59e0b;"></i></div>
                            <div class="stat-number" style="color:#f59e0b;">${lowConfidence}</div>
                            <div class="stat-label">Low Confidence</div>
                            <div class="stat-sub"><85%</div>
                        </div>
                        <div class="stat-card" style="border-left:3px solid #c62828;">
                            <div class="stat-icon"><i class="fas fa-user-slash" style="color:#c62828;"></i></div>
                            <div class="stat-number" style="color:#c62828;">${identityMismatch}</div>
                            <div class="stat-label">Identity Mismatch</div>
                            <div class="stat-sub">Needs review</div>
                        </div>
                    </div>

                    <!-- ROW 2: Hostel Progress + RA Activity -->
                    <div class="grid-2">
                        <!-- Hostel Progress -->
                        <div class="card">
                            <div class="card-title"><span class="icon"><i class="fas fa-chart-line"></i></span> Hostel Progress</div>
                            <div class="flex-between"><span class="text-sm text-muted">${verified} / ${totalStudents} Students Verified</span><span class="font-bold" style="color:#a77915;">${completion}%</span></div>
                            <div class="progress-bar mt-1"><div class="fill" style="width:${completion}%;background:${completion === 100 ? '#2d6545' : '#d6ad4b'};"></div></div>
                            <div class="mt-3">
                                ${floorData.length > 0 ? floorData.map(f => `
                                    <div class="flex-between" style="padding:0.2rem 0;border-bottom:1px solid #f0ebe3;">
                                        <span class="text-sm">${f.name}</span>
                                        <span class="text-sm">
                                            ${f.checked}/${f.total}
                                            <span style="font-weight:600;color:${f.progress === 100 ? '#2d6545' : '#a77915'};">${f.progress}%</span>
                                            ${f.progress === 100 ? '✔' : ''}
                                        </span>
                                    </div>
                                `).join('') : '<p class="text-muted text-sm">No floors configured</p>'}
                            </div>
                        </div>

                        <!-- RA Activity -->
                        <div class="card">
                            <div class="card-title"><span class="icon"><i class="fas fa-user-tie"></i></span> Live RA Activity</div>
                            <div class="scrollable-section" style="max-height:200px;">
                                ${raActivity.length > 0 ? raActivity.map(ra => `
                                    <div class="ra-activity-item">
                                        <span class="ra-name">${ra.name}</span>
                                        <span class="ra-room">${ra.room}</span>
                                        <span class="ra-status">${ra.status}</span>
                                    </div>
                                `).join('') : '<p class="text-muted text-sm">No RAs assigned</p>'}
                            </div>
                        </div>
                    </div>

                    <!-- ROW 3: Pending Rooms + AI Alerts -->
                    <div class="grid-2 mt-4">
                        <!-- Pending Rooms -->
                        <div class="card">
                            <div class="card-title"><span class="icon"><i class="fas fa-clock"></i></span> Rooms Waiting for Approval</div>
                            <div class="scrollable-section" style="max-height:200px;">
                                ${pendingRooms.length > 0 ? pendingRooms.map(r => `
                                    <div class="flex-between" style="padding:0.4rem 0;border-bottom:1px solid #f0ebe3;">
                                        <div>
                                            <span class="font-bold">${r.room}</span>
                                            <span class="text-xs text-muted">· ${r.ra}</span>
                                            <div class="text-xs text-muted">${r.verified}/${r.total} verified</div>
                                        </div>
                                        <div class="flex gap-2">
                                            ${r.lowConfidence > 0 ? `<span class="badge badge-low" style="font-size:0.5rem;">${r.lowConfidence} Low</span>` : ''}
                                            ${r.mismatch > 0 ? `<span class="badge badge-mismatch" style="font-size:0.5rem;">${r.mismatch} Mismatch</span>` : ''}
                                            <button class="btn-ghost" style="font-size:0.6rem;" onclick="showToast('Reviewing ${r.room}','info')">Review →</button>
                                        </div>
                                    </div>
                                `).join('') : '<p class="text-muted text-sm">No pending rooms</p>'}
                            </div>
                        </div>

                        <!-- AI Alerts -->
                        <div class="card">
                            <div class="card-title"><span class="icon"><i class="fas fa-bell"></i></span> AI Alerts</div>
                            <div class="scrollable-section" style="max-height:200px;">
                                ${aiAlerts.length > 0 ? aiAlerts.map(alert => `
                                    <div class="alert-item">
                                        <div class="alert-icon">
                                            ${alert.type === 'low-confidence' ? '⚠️' : alert.type === 'mismatch' ? '🔴' : 'ℹ️'}
                                        </div>
                                        <div class="alert-content">
                                            <div class="alert-title">${alert.room ? `${alert.room} · ` : ''}${alert.title}</div>
                                            <div class="alert-desc">${alert.desc}</div>
                                        </div>
                                    </div>
                                `).join('') : '<p class="text-muted text-sm">No alerts</p>'}
                            </div>
                        </div>
                    </div>

                    <!-- ROW 4: Verification Accuracy + Recent Activity -->
                    <div class="grid-2 mt-4">
                        <!-- Face Recognition Health / Verification Accuracy -->
                        <div class="card">
                            <div class="card-title"><span class="icon"><i class="fas fa-fingerprint"></i></span> Face Recognition Health</div>
                            <div class="grid-2 mt-2">
                                <div><span class="text-xs text-muted">Camera Status</span><br><span class="font-bold" style="color:#2d6545;">🟢 Connected</span></div>
                                <div><span class="text-xs text-muted">AI Engine</span><br><span class="font-bold" style="color:#2d6545;">Online</span></div>
                                <div><span class="text-xs text-muted">Average Match</span><br><span class="font-bold" style="color:#a77915;">${avgConfidence || 97}%</span></div>
                                <div><span class="text-xs text-muted">Liveness Detection</span><br><span class="font-bold" style="color:#2d6545;">Enabled</span></div>
                            </div>
                            <div class="mt-3 pt-3 border-t">
                                <div class="text-sm font-bold">Today's Accuracy</div>
                                <div class="grid-3 mt-1">
                                    <div><span class="text-xs text-muted">Verified</span><br><span class="font-bold">${verified}</span></div>
                                    <div><span class="text-xs text-muted">Avg Confidence</span><br><span class="font-bold" style="color:#a77915;">${avgConfidence || 97}%</span></div>
                                    <div><span class="text-xs text-muted">Manual Reviews</span><br><span class="font-bold" style="color:#d97706;">${lowConfidence + identityMismatch}</span></div>
                                </div>
                            </div>
                        </div>

                        <!-- Recent Activity -->
                        <div class="card">
                            <div class="card-title"><span class="icon"><i class="fas fa-clock"></i></span> Recent Activity</div>
                            <div class="scrollable-section" style="max-height:200px;">
                                ${recentActivity.length > 0 ? recentActivity.map(a => `
                                    <div class="activity-item">
                                        <span class="activity-time">${a.time}</span>
                                        <div class="activity-text"><span class="highlight">${a.text}</span></div>
                                        <span class="badge ${a.status === 'Verified' || a.status === 'Present' ? 'badge-approved' : 'badge-pending'}" style="font-size:0.5rem;">${a.status || 'Done'}</span>
                                    </div>
                                `).join('') : '<p class="text-muted text-sm">No recent activity</p>'}
                            </div>
                        </div>
                    </div>

                    <!-- Quick Actions -->
                    <div class="action-bar mt-4">
                        <div class="action-group">
                            <button class="btn-primary" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="showToast('Opening pending rooms review','info')"><i class="fas fa-clock"></i> Review Pending Rooms</button>
                            <button class="btn-outline" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="showToast('Opening live monitor','info')"><i class="fas fa-eye"></i> Live BedCheck Monitor</button>
                            <button class="btn-outline" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="showToast('Opening face recognition logs','info')"><i class="fas fa-fingerprint"></i> Face Recognition Logs</button>
                            <button class="btn-outline" style="font-size:0.7rem;padding:0.3rem 0.8rem;" onclick="showToast('Generating report','success')"><i class="fas fa-file-alt"></i> Generate Report</button>
                        </div>
                    </div>

                    <!-- Today's Summary -->
                    <div class="card mt-4" style="border-color:#d6ad4b;background:#fbf7ef;">
                        <div class="card-title"><span class="icon"><i class="fas fa-chart-pie"></i></span> Today's Summary</div>
                        <div class="grid-3">
                            <div><span class="text-xs text-muted">Hostel</span><br><span class="font-bold">${hostelName}</span></div>
                            <div><span class="text-xs text-muted">Students</span><br><span class="font-bold">${totalStudents}</span></div>
                            <div><span class="text-xs text-muted">Verified</span><br><span class="font-bold" style="color:#2d6545;">${verified}</span></div>
                            <div><span class="text-xs text-muted">Pending</span><br><span class="font-bold" style="color:#d97706;">${pending}</span></div>
                            <div><span class="text-xs text-muted">Approval Rate</span><br><span class="font-bold" style="color:#a77915;">${completion}%</span></div>
                            <div><span class="text-xs text-muted">Average Match</span><br><span class="font-bold" style="color:#a77915;">${avgConfidence || 97}%</span></div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="mt-6 pt-4 border-t text-center">
                        <p class="text-xs text-muted">
                            BIU BedCheck System v1.0 · © Benson Idahosa University
                            <span class="ml-4"><span class="status-dot green"></span> System Online</span>
                        </p>
                    </div>
                `;

                screenContent.innerHTML = html;
                startClock();
            }

            // ===== DATA LOADING =====
            async function loadAllData() {
                try {
                    const userData = sessionStorage.getItem('bedcheck_user') || localStorage.getItem('bedcheck_user');
                    if (!userData) { window.location.replace('../Login.html'); return; }
                    try {
                        currentUser = JSON.parse(userData);
                        if (!sessionStorage.getItem('bedcheck_user')) sessionStorage.setItem('bedcheck_user', userData);
                        if (!currentUser.id) { showToast('User data incomplete', 'error');
                            setTimeout(() => window.location.replace('../Login.html'), 2000); return; }
                    } catch (e) { window.location.replace('../Login.html'); return; }
                    updateUserDisplay();

                    const hostelRes = await apiCall(`/hra/hostel`);
                    hostelData = hostelRes.data;
                    if (!hostelData) {
                        roleScope.textContent = 'No hostel assigned';
                        showToast('No hostel assigned', 'error');
                        renderDashboard();
                        return;
                    }
                    roleScope.textContent = hostelData.name + ' · Hostel Representative Admin';
                    document.getElementById('mobileRoleFooter').textContent = `HRA · ${hostelData.name} Hostel`;
                    setNotice(`${hostelData.name} · HRA Dashboard`);
                    updateUserDisplay();

                    const [studentsRes, staffRes, floorsRes, roomsRes, sessionRes, scanRes] = await Promise.all([
                        apiCall(`/hostels/${hostelData.id}/students`).catch(() => ({ data: [] })),
                        apiCall(`/hostels/${hostelData.id}/staff`).catch(() => ({ data: [] })),
                        apiCall(`/floors-flats?hostel_id=${hostelData.id}`).catch(() => ({ data: [] })),
                        apiCall(`/rooms?hostel_id=${hostelData.id}`).catch(() => ({ data: [] })),
                        apiCall(`/hostels/${hostelData.id}/session`).catch(() => ({ data: null })),
                        apiCall(`/bedcheck/scans?hostel_id=${hostelData.id}`).catch(() => ({ data: [] }))
                    ]);

                    students = studentsRes.data || [];
                    staff = staffRes.data || [];
                    floors = floorsRes.data || [];
                    rooms = roomsRes.data || [];
                    sessionData = sessionRes.data || null;
                    scans = scanRes.data || [];

                    const now = new Date();
                    document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    renderDashboard();
                } catch (error) {
                    console.error('Load error:', error);
                    showToast('Error loading data: ' + error.message, 'error');
                    setNotice('Error loading dashboard data. Please refresh.');
                    screenContent.innerHTML = `
                        <div class="card mt-4" style="border-color:#a84134;background:#f9e2de;">
                            <div class="text-center p-4">
                                <i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#a84134;"></i>
                                <h2 class="mt-3">Error Loading Data</h2>
                                <p class="text-muted">${error.message}</p>
                                <button class="btn-primary mt-3" onclick="location.reload()"><i class="fas fa-refresh"></i> Refresh</button>
                            </div>
                        </div>
                    `;
                }
            }

            function handleLogout() {
                sessionStorage.removeItem('bedcheck_user');
                localStorage.removeItem('bedcheck_user');
                showToast('Logging out...', 'success');
                setTimeout(() => window.location.replace('../Login.html'), 500);
            }

            function openMobileDrawer() {
                document.getElementById('mobileDrawer').classList.add('open');
                document.getElementById('drawerOverlay').classList.add('show');
            }

            function closeMobileDrawer() {
                document.getElementById('mobileDrawer').classList.remove('open');
                document.getElementById('drawerOverlay').classList.remove('show');
            }

            function init() {
                const userData = sessionStorage.getItem('bedcheck_user') || localStorage.getItem('bedcheck_user');
                if (!userData) { window.location.replace('../Login.html'); return; }
                try {
                    currentUser = JSON.parse(userData);
                    if (!sessionStorage.getItem('bedcheck_user')) sessionStorage.setItem('bedcheck_user', userData);
                    if (!currentUser.id) { showToast('User data incomplete', 'error');
                        setTimeout(() => window.location.replace('../Login.html'), 2000); return; }
                    updateUserDisplay();
                    loadAllData();
                } catch (e) { console.error('Error parsing user data:', e);
                    window.location.replace('../Login.html'); }

                logoutBtn.addEventListener('click', handleLogout);
                menuToggle.addEventListener('click', openMobileDrawer);
                document.getElementById('closeDrawer').addEventListener('click', closeMobileDrawer);
                document.getElementById('drawerOverlay').addEventListener('click', closeMobileDrawer);
            }

            window.showToast = showToast;
            window.loadAllData = loadAllData;

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>

</body>
</html>
