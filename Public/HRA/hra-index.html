    <script>
        (function() {
            'use strict';

            const API_BASE = 'https://bedcheck-biu.onrender.com/api';

            let currentUser = null;
            let hostelData = null;
            let students = [];
            let staff = [];
            let floors = [];
            let rooms = [];
            let scans = [];
            let sessionData = null;
            let clockInterval = null;
            let roomStructure = {};
            let sessionCheckerInterval = null;

            // Session state
            let isSessionActive = false;
            let sessionStatus = 'Closed';
            let currentSession = null;

            const screenContent = document.getElementById('screenContent');
            const noticeText = document.getElementById('noticeText');
            const roleLabel = document.getElementById('roleLabel');
            const roleScope = document.getElementById('roleScope');
            const profileAvatar = document.getElementById('profileAvatar');
            const profileName = document.getElementById('profileName');
            const profileRoleLabel = document.getElementById('profileRoleLabel');
            const logoutBtn = document.getElementById('logoutBtn');
            const menuToggle = document.getElementById('menuToggle');

            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => toast.classList.remove('show'), 4000);
            }
            window.showToast = showToast;

            function getStaffId() {
                const userData = sessionStorage.getItem('bedcheck_user');
                if (userData) {
                    try {
                        const user = JSON.parse(userData);
                        return user.id;
                    } catch (e) { return null; }
                }
                return null;
            }

            // =============================================
            // AUTHENTICATED API HELPER
            // =============================================
            async function apiCall(endpoint, options = {}) {
                const token = sessionStorage.getItem('bedcheck_token');
                
                if (!token) {
                    showToast('No authentication token found. Please login again.', 'error');
                    setTimeout(() => {
                        window.location.replace('../Login.html');
                    }, 1500);
                    throw new Error('No authentication token');
                }

                try {
                    const headers = {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        ...(options.headers || {})
                    };
                    const response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
                    
                    if (response.status === 401) {
                        showToast('Session expired. Please login again.', 'error');
                        sessionStorage.removeItem('bedcheck_token');
                        sessionStorage.removeItem('bedcheck_user');
                        sessionStorage.removeItem('bedcheck_role');
                        setTimeout(() => {
                            window.location.replace('../Login.html');
                        }, 1500);
                        throw new Error('Authentication required');
                    }
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                    const data = await response.json();
                    if (!data.success) throw new Error(data.message || 'API error');
                    return data;
                } catch (error) {
                    if (!error.message.includes('Authentication required') && !error.message.includes('No authentication token')) {
                        showToast('Error: ' + error.message, 'error');
                    }
                    throw error;
                }
            }

            // =============================================
            // GET HRA'S HOSTEL
            // =============================================
            async function getHRAHostel() {
                try {
                    const userData = sessionStorage.getItem('bedcheck_user');
                    if (userData) {
                        const user = JSON.parse(userData);
                        if (user.hostel_id) {
                            const result = await apiCall(`/hostels/${user.hostel_id}`);
                            return result.data;
                        }
                    }
                    
                    const staffId = getStaffId();
                    if (staffId) {
                        const staffResult = await apiCall(`/staff/${staffId}`);
                        if (staffResult.data && staffResult.data.hostel_id) {
                            const hostelResult = await apiCall(`/hostels/${staffResult.data.hostel_id}`);
                            return hostelResult.data;
                        }
                    }
                    
                    return null;
                } catch (error) {
                    console.error('Error fetching HRA hostel:', error);
                    return null;
                }
            }

            // =============================================
            // LOAD SESSION STATUS
            // =============================================
            async function loadSessionStatus() {
                try {
                    // Check if there's an active global session
                    const sessionResult = await apiCall('/sessions/active');
                    
                    if (sessionResult && sessionResult.data && sessionResult.is_active) {
                        currentSession = sessionResult.data;
                        isSessionActive = true;
                        sessionStatus = currentSession.status || 'Active';
                    } else {
                        // Check for any session in the hostel
                        if (hostelData && hostelData.id) {
                            const hostelSessionResult = await apiCall(`/sessions?hostel_id=${hostelData.id}`);
                            if (hostelSessionResult && hostelSessionResult.data && hostelSessionResult.data.length > 0) {
                                const latest = hostelSessionResult.data[0];
                                currentSession = latest;
                                sessionStatus = latest.status || 'Closed';
                                isSessionActive = sessionStatus === 'Active' || sessionStatus === 'Running' || sessionStatus === 'Open' || sessionStatus === 'started';
                            } else {
                                currentSession = null;
                                isSessionActive = false;
                                sessionStatus = 'Closed';
                            }
                        } else {
                            currentSession = null;
                            isSessionActive = false;
                            sessionStatus = 'Closed';
                        }
                    }

                    // If we have a session, also check RA bedcheck status
                    if (isSessionActive && currentSession) {
                        try {
                            const statusResult = await apiCall('/ra/bedcheck/status');
                            if (statusResult && statusResult.data) {
                                // Update session status based on RA status
                                if (statusResult.data.effective_status === 'started') {
                                    sessionStatus = 'Active';
                                    isSessionActive = true;
                                } else if (statusResult.data.effective_status === 'completed') {
                                    sessionStatus = 'Completed';
                                    isSessionActive = false;
                                } else if (statusResult.data.effective_status === 'ready') {
                                    sessionStatus = 'Ready';
                                    isSessionActive = true;
                                }
                            }
                        } catch (e) {
                            // Silent fail - use session data
                        }
                    }

                    return { isSessionActive, sessionStatus, session: currentSession };
                } catch (error) {
                    console.error('Error loading session status:', error);
                    return { isSessionActive: false, sessionStatus: 'Closed', session: null };
                }
            }

            // =============================================
            // START SESSION CHECKER
            // =============================================
            function startSessionChecker() {
                if (sessionCheckerInterval) clearInterval(sessionCheckerInterval);
                sessionCheckerInterval = setInterval(async () => {
                    try {
                        const oldStatus = isSessionActive;
                        await loadSessionStatus();
                        if (oldStatus !== isSessionActive) {
                            renderDashboard();
                        }
                    } catch (error) {
                        // Silent fail
                    }
                }, 30000);
            }

            // =============================================
            // FORMAT HELPERS
            // =============================================
            function formatTimeStr(timeStr) {
                if (!timeStr) return '—';
                try {
                    if (typeof timeStr === 'string' && timeStr.includes(':')) {
                        let timePart = timeStr;
                        if (timeStr.includes(' ')) timePart = timeStr.split(' ')[1];
                        if (timeStr.includes('T')) timePart = timeStr.split('T')[1];
                        timePart = timePart.replace(/\.\d+/, '').replace(/[+-]\d{2}:\d{2}$/, '').replace(/Z$/, '');
                        const parts = timePart.split(':');
                        if (parts.length >= 2) {
                            const hour = parseInt(parts[0]);
                            const minute = parseInt(parts[1]);
                            if (!isNaN(hour) && !isNaN(minute)) {
                                const ampm = hour >= 12 ? 'PM' : 'AM';
                                const hour12 = hour % 12 || 12;
                                return `${hour12}:${String(minute).padStart(2, '0')} ${ampm}`;
                            }
                        }
                    }
                    const dateObj = new Date(timeStr);
                    if (!isNaN(dateObj.getTime())) {
                        return dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                    }
                    return timeStr;
                } catch (e) {
                    return timeStr || '—';
                }
            }

            function formatDateStr(dateStr) {
                if (!dateStr) return '—';
                try {
                    const dateObj = new Date(dateStr);
                    if (!isNaN(dateObj.getTime())) {
                        return dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                    }
                    return dateStr;
                } catch (e) {
                    return dateStr || '—';
                }
            }

            function updateUserDisplay() {
                if (currentUser) {
                    const name = currentUser.name || 'User';
                    const initials = currentUser.initials || name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase() || 'U';
                    profileAvatar.textContent = initials;
                    profileName.textContent = name;
                    profileRoleLabel.textContent = currentUser.role || 'HRA';
                    roleLabel.textContent = currentUser.role || 'HRA';
                    if (hostelData) {
                        roleScope.textContent = hostelData.name + ' · Hostel Representative Admin';
                    }
                }
            }

            function setNotice(msg) { noticeText.textContent = msg; }

            function statusBadge(status) {
                const map = {
                    'Active': 'badge-active',
                    'Inactive': 'badge-inactive',
                    'Working': 'badge-active',
                    'Idle': 'badge-pending',
                    'Completed': 'badge-approved',
                    'Not Started': 'badge-pending',
                    'Present': 'badge-approved',
                    'Absent': 'badge-inactive',
                    'Pending': 'badge-pending',
                    'Full': 'badge-approved',
                    'Available': 'badge-pending',
                    'Maintenance': 'badge-inactive',
                    'Scanning': 'badge-live',
                    'Submitted': 'badge-approved',
                    'Waiting': 'badge-pending',
                    'Needs Review': 'badge-review',
                    'Verified': 'badge-approved'
                };
                return `<span class="badge ${map[status] || 'badge-pending'}">${status || 'Unknown'}</span>`;
            }

            function startClock() {
                if (clockInterval) clearInterval(clockInterval);
                clockInterval = setInterval(() => {
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    const heroClock = document.getElementById('heroClock');
                    const heroCountdown = document.getElementById('heroCountdown');
                    if (heroClock) heroClock.textContent = timeStr;

                    const end = new Date();
                    end.setHours(23, 59, 59, 0);
                    const diff = Math.max(0, Math.floor((end - now) / 1000));
                    const hrs = Math.floor(diff / 3600);
                    const mins = Math.floor((diff % 3600) / 60);
                    const secs = diff % 60;
                    const countdownStr = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                    if (heroCountdown) heroCountdown.textContent = isSessionActive ? `⏱ ${countdownStr}` : '⏸ Session Closed';
                }, 1000);
            }

            // =============================================
            // BUILD ROOM STRUCTURE
            // =============================================
            function buildRoomStructure() {
                roomStructure = { type: hostelData?.type || 'floor', areas: [], floorRanges: {} };

                if (hostelData?.type === 'flat') {
                    const flatNumbers = [];
                    students.forEach(s => {
                        if (s.flat) {
                            const num = parseInt(s.flat.match(/\d+/)?.[0]);
                            if (num) flatNumbers.push(num);
                        }
                    });
                    const sortedFlats = [...new Set(flatNumbers)].sort((a, b) => a - b);
                    roomStructure.type = 'flat';
                    roomStructure.areas = sortedFlats.map(num => ({
                        name: `Flat ${num}`,
                        key: `Flat ${num}`,
                        rooms: students.filter(s => s.flat === `Flat ${num}`).map(s => s.room).filter(Boolean)
                    }));
                } else {
                    const floorLetters = [];
                    students.forEach(s => {
                        if (s.floor) {
                            const letter = s.floor.replace('Floor ', '');
                            if (letter) floorLetters.push(letter);
                        }
                    });
                    const sortedLetters = [...new Set(floorLetters)].sort();
                    roomStructure.type = 'floor';

                    const raStaff = staff.filter(s => s.role === 'RA' || s.role === 'Resident Advisor');
                    const isGirlsHostel = checkIfGirlsHostel(raStaff, sortedLetters);

                    sortedLetters.forEach(letter => {
                        const floorRooms = students
                            .filter(s => s.floor === `Floor ${letter}`)
                            .map(s => s.room)
                            .filter(Boolean)
                            .sort((a, b) => {
                                const numA = parseInt(a.replace(letter, ''));
                                const numB = parseInt(b.replace(letter, ''));
                                return numA - numB;
                            });

                        let roomRanges = [];

                        if (isGirlsHostel) {
                            const range1 = floorRooms.filter(r => {
                                const num = parseInt(r.replace(letter, ''));
                                return num >= 1 && num <= 8;
                            });
                            const range2 = floorRooms.filter(r => {
                                const num = parseInt(r.replace(letter, ''));
                                return num >= 9 && num <= 14;
                            });
                            const range3 = floorRooms.filter(r => {
                                const num = parseInt(r.replace(letter, ''));
                                return num >= 15 && num <= 18;
                            });

                            if (range1.length > 0) {
                                roomRanges.push({ name: `${letter}1-${letter}8`, key: `${letter}1-${letter}8`, rooms: range1, prefix: letter, start: 1, end: 8 });
                            }
                            if (range2.length > 0) {
                                roomRanges.push({ name: `${letter}9-${letter}14`, key: `${letter}9-${letter}14`, rooms: range2, prefix: letter, start: 9, end: 14 });
                            }
                            if (range3.length > 0) {
                                roomRanges.push({ name: `${letter}15-${letter}18`, key: `${letter}15-${letter}18`, rooms: range3, prefix: letter, start: 15, end: 18 });
                            }
                        } else {
                            const range1 = floorRooms.filter(r => {
                                const num = parseInt(r.replace(letter, ''));
                                return num >= 1 && num <= 9;
                            });
                            const range2 = floorRooms.filter(r => {
                                const num = parseInt(r.replace(letter, ''));
                                return num >= 10 && num <= 18;
                            });

                            if (range1.length > 0) {
                                roomRanges.push({ name: `${letter}1-${letter}9`, key: `${letter}1-${letter}9`, rooms: range1, prefix: letter, start: 1, end: 9 });
                            }
                            if (range2.length > 0) {
                                roomRanges.push({ name: `${letter}10-${letter}18`, key: `${letter}10-${letter}18`, rooms: range2, prefix: letter, start: 10, end: 18 });
                            }
                        }

                        if (roomRanges.length === 0) {
                            if (isGirlsHostel) {
                                roomRanges.push({ name: `${letter}1-${letter}8`, key: `${letter}1-${letter}8`, rooms: Array.from({ length: 8 }, (_, i) => `${letter}${i+1}`), prefix: letter, start: 1, end: 8 });
                                roomRanges.push({ name: `${letter}9-${letter}14`, key: `${letter}9-${letter}14`, rooms: Array.from({ length: 6 }, (_, i) => `${letter}${i+9}`), prefix: letter, start: 9, end: 14 });
                                roomRanges.push({ name: `${letter}15-${letter}18`, key: `${letter}15-${letter}18`, rooms: Array.from({ length: 4 }, (_, i) => `${letter}${i+15}`), prefix: letter, start: 15, end: 18 });
                            } else {
                                roomRanges.push({ name: `${letter}1-${letter}9`, key: `${letter}1-${letter}9`, rooms: Array.from({ length: 9 }, (_, i) => `${letter}${i+1}`), prefix: letter, start: 1, end: 9 });
                                roomRanges.push({ name: `${letter}10-${letter}18`, key: `${letter}10-${letter}18`, rooms: Array.from({ length: 9 }, (_, i) => `${letter}${i+10}`), prefix: letter, start: 10, end: 18 });
                            }
                        }

                        roomRanges.forEach(range => {
                            roomStructure.areas.push({
                                name: range.name,
                                key: range.key,
                                rooms: range.rooms,
                                floor: `Floor ${letter}`,
                                prefix: range.prefix,
                                start: range.start,
                                end: range.end
                            });
                        });

                        roomStructure.floorRanges[letter] = roomRanges;
                    });
                }

                if (roomStructure.areas.length === 0) {
                    if (hostelData?.type === 'flat') {
                        const totalFlats = hostelData.total_flats || 9;
                        for (let i = 1; i <= totalFlats; i++) {
                            const rooms = Array.from({ length: 4 }, (_, r) => `F${i}R${r + 1}`);
                            roomStructure.areas.push({ name: `Flat ${i}`, key: `Flat ${i}`, rooms: rooms });
                        }
                    } else {
                        const totalFloors = hostelData?.total_floors || 3;
                        const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
                        for (let i = 0; i < totalFloors; i++) {
                            const letter = letters[i];
                            roomStructure.areas.push({ name: `${letter}1-${letter}9`, key: `${letter}1-${letter}9`, rooms: Array.from({ length: 9 }, (_, r) => `${letter}${r+1}`), floor: `Floor ${letter}`, prefix: letter, start: 1, end: 9 });
                            roomStructure.areas.push({ name: `${letter}10-${letter}18`, key: `${letter}10-${letter}18`, rooms: Array.from({ length: 9 }, (_, r) => `${letter}${r+10}`), floor: `Floor ${letter}`, prefix: letter, start: 10, end: 18 });
                        }
                    }
                }
            }

            function checkIfGirlsHostel(raStaff, floorLetters) {
                let girlsHostelPattern = false;
                floorLetters.forEach(letter => {
                    const rasOnFloor = raStaff.filter(ra => {
                        const area = ra.assigned_floor || '';
                        return area.includes(`Floor ${letter}`);
                    });
                    if (rasOnFloor.length === 3) {
                        const hasRange1 = rasOnFloor.some(ra => {
                            const area = ra.assigned_floor || '';
                            return area.includes(`${letter}1-${letter}8`);
                        });
                        const hasRange2 = rasOnFloor.some(ra => {
                            const area = ra.assigned_floor || '';
                            return area.includes(`${letter}9-${letter}14`);
                        });
                        const hasRange3 = rasOnFloor.some(ra => {
                            const area = ra.assigned_floor || '';
                            return area.includes(`${letter}15-${letter}18`);
                        });
                        if (hasRange1 && hasRange2 && hasRange3) {
                            girlsHostelPattern = true;
                        }
                    }
                });
                return girlsHostelPattern;
            }

            function getAreaDisplay(areaKey) {
                const area = roomStructure.areas.find(a => a.key === areaKey);
                if (!area) return areaKey;
                if (area.floor) {
                    return `${area.floor} · ${area.name}`;
                }
                return area.name;
            }

            // =============================================
            // RENDER DASHBOARD
            // =============================================
            async function renderDashboard() {
                if (!hostelData) {
                    screenContent.innerHTML = `
                        <div class="card mt-4">
                            <div class="text-center p-4">
                                <i class="fas fa-building" style="font-size:3rem;color:#b9c7db;"></i>
                                <h2 class="mt-3">No Hostel Assigned</h2>
                                <p class="text-muted">You are not assigned to any hostel. Please contact the administrator.</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                // Reload session status
                await loadSessionStatus();
                buildRoomStructure();

                const now = new Date();
                const hostelName = hostelData.name || 'Your Hostel';
                const totalStudents = students.length;
                
                // Determine verified status from scans and student status
                const verified = students.filter(s => {
                    const scan = scans.find(sc => sc.student_id === s.id);
                    return scan?.status === 'Verified' || scan?.status === 'Present' || s.status === 'Present' || s.status === 'Verified';
                }).length || 0;
                
                const pending = totalStudents - verified;
                const completion = totalStudents > 0 ? Math.round((verified / totalStudents) * 100) : 0;

                // Room completion
                const roomsWithStudents = rooms.filter(r => students.some(s => s.room_id === r.id));
                const roomsCompleted = roomsWithStudents.filter(r => {
                    const roomStudents = students.filter(s => s.room_id === r.id);
                    return roomStudents.length > 0 && roomStudents.every(s => {
                        const scan = scans.find(sc => sc.student_id === s.id);
                        return scan?.status === 'Verified' || scan?.status === 'Present' || s.status === 'Present' || s.status === 'Verified';
                    });
                }).length;

                const raStaff = staff.filter(s => s.role === 'RA' || s.role === 'Resident Advisor');
                const activeRA = raStaff.filter(s => {
                    const area = s.assigned_floor || '';
                    return area && students.some(st => {
                        const scan = scans.find(sc => sc.student_id === st.id);
                        return scan && area.includes(st.floor || '');
                    });
                }).length;

                // Session display
                let sessionDisplay = {
                    statusText: 'No active session',
                    badgeClass: 'closed',
                    badgeText: 'Closed',
                    icon: '🔴',
                    detailText: 'BedCheck session is not currently running.'
                };

                if (isSessionActive && sessionStatus === 'Active') {
                    sessionDisplay = {
                        statusText: 'BedCheck Session Active',
                        badgeClass: 'active',
                        badgeText: 'Active',
                        icon: '🟢',
                        detailText: 'RAs are currently verifying students. Controlled by Administrator / RASD.'
                    };
                } else if (isSessionActive && sessionStatus === 'Ready') {
                    sessionDisplay = {
                        statusText: 'BedCheck Session Ready',
                        badgeClass: 'ready',
                        badgeText: 'Ready',
                        icon: '🟡',
                        detailText: 'Session is ready. Waiting for RAs to start verification.'
                    };
                } else if (sessionStatus === 'Completed') {
                    sessionDisplay = {
                        statusText: 'BedCheck Completed',
                        badgeClass: 'completed',
                        badgeText: 'Done',
                        icon: '✅',
                        detailText: 'Today\'s BedCheck has been completed.'
                    };
                } else {
                    sessionDisplay = {
                        statusText: 'No active session',
                        badgeClass: 'closed',
                        badgeText: 'Closed',
                        icon: '🔴',
                        detailText: 'Please wait for the Administrator to start a BedCheck session.'
                    };
                }

                // Session times
                let sessionStart = '—';
                let sessionEnd = '—';
                let sessionDate = '—';
                let sessionGrace = '15';

                if (currentSession) {
                    if (currentSession.start_time) sessionStart = formatTimeStr(currentSession.start_time);
                    if (currentSession.end_time) sessionEnd = formatTimeStr(currentSession.end_time);
                    if (currentSession.date) sessionDate = formatDateStr(currentSession.date);
                    if (currentSession.grace_period) sessionGrace = currentSession.grace_period;
                }

                // Floor progress
                const floorGroups = {};
                roomStructure.areas.forEach(area => {
                    const floorKey = area.floor || area.name;
                    if (!floorGroups[floorKey]) {
                        floorGroups[floorKey] = {
                            name: floorKey,
                            areas: [],
                            total: 0,
                            checked: 0
                        };
                    }
                    const areaStudents = students.filter(s => area.rooms.includes(s.room));
                    const total = areaStudents.length;
                    const checked = areaStudents.filter(s => {
                        const scan = scans.find(sc => sc.student_id === s.id);
                        return scan?.status === 'Verified' || scan?.status === 'Present' || s.status === 'Present' || s.status === 'Verified';
                    }).length;
                    floorGroups[floorKey].areas.push({ name: area.name, total, checked, rooms: area.rooms.length });
                    floorGroups[floorKey].total += total;
                    floorGroups[floorKey].checked += checked;
                });

                const floorData = Object.values(floorGroups).map(group => {
                    const progress = group.total > 0 ? Math.round((group.checked / group.total) * 100) : 0;
                    const ra = staff.find(s => {
                        const assigned = s.assigned_floor || '';
                        return assigned.includes(group.name) && (s.role === 'RA' || s.role === 'Resident Advisor');
                    });
                    return {
                        name: group.name,
                        total: group.total,
                        checked: group.checked,
                        progress: progress,
                        ra: ra?.name || 'Not assigned',
                        status: progress === 100 ? 'Completed' : progress > 50 ? 'In progress' : 'Pending',
                        areas: group.areas
                    };
                });

                // RA Activity
                const raActivity = raStaff.map(ra => {
                    const area = ra.assigned_floor || 'Unassigned';
                    const displayName = getAreaDisplay(area);
                    
                    // Check if RA has submitted
                    let statusDisplay = '⏳ Waiting';
                    let statusClass = 'badge-pending';
                    
                    const raRooms = roomStructure.areas.filter(a => 
                        a.floor && ra.assigned_floor && a.floor.includes(ra.assigned_floor.replace('Floor ', ''))
                    );
                    
                    const raStudents = students.filter(s => 
                        raRooms.some(r => r.rooms.includes(s.room))
                    );
                    
                    const raVerified = raStudents.filter(s => {
                        const scan = scans.find(sc => sc.student_id === s.id);
                        return scan?.status === 'Verified' || scan?.status === 'Present' || s.status === 'Present' || s.status === 'Verified';
                    }).length;
                    
                    if (raStudents.length > 0 && raVerified === raStudents.length) {
                        statusDisplay = '✅ Completed';
                        statusClass = 'badge-approved';
                    } else if (raVerified > 0) {
                        statusDisplay = '🟢 Scanning';
                        statusClass = 'badge-live';
                    }
                    
                    return {
                        name: ra.name,
                        room: displayName,
                        status: statusDisplay,
                        statusClass: statusClass,
                        verified: raVerified,
                        total: raStudents.length
                    };
                });

                // Rooms needing attention
                const pendingRooms = rooms.filter(r => {
                    const roomStudents = students.filter(s => s.room_id === r.id);
                    return roomStudents.length > 0 && !roomStudents.every(s => {
                        const scan = scans.find(sc => sc.student_id === s.id);
                        return scan?.status === 'Verified' || scan?.status === 'Present' || s.status === 'Present' || s.status === 'Verified';
                    });
                }).slice(0, 5).map(r => {
                    const roomStudents = students.filter(s => s.room_id === r.id);
                    const verifiedCount = roomStudents.filter(s => {
                        const scan = scans.find(sc => sc.student_id === s.id);
                        return scan?.status === 'Verified' || scan?.status === 'Present' || s.status === 'Present' || s.status === 'Verified';
                    }).length;
                    const totalCount = roomStudents.length;
                    return {
                        room: r.room_code || 'Room ' + r.id,
                        verified: verifiedCount,
                        total: totalCount,
                        progress: totalCount > 0 ? Math.round((verifiedCount / totalCount) * 100) : 0
                    };
                });

                const hour = now.getHours();
                let greeting = 'Good Evening';
                if (hour < 12) greeting = 'Good Morning';
                else if (hour < 17) greeting = 'Good Afternoon';

                const isGirls = roomStructure.areas.some(a => a.start === 15);
                const hostelTypeLabel = hostelData.type === 'flat' ? 'Flats' :
                    isGirls ? 'Girls (3 RAs/floor)' : 'Boys (2 RAs/floor)';

                const html = `
                    <!-- HERO HEADER -->
                    <div class="hero-header">
                        <div class="hero-left">
                            <div class="hostel-name">${hostelName}</div>
                            <div class="hostel-sub">
                                <span>${hostelTypeLabel}</span>
                                <span>· ${totalStudents} students</span>
                                <span>· ${roomsWithStudents.length} rooms</span>
                                <span class="badge badge-floor" style="font-size:0.55rem;">${roomStructure.areas.length} room ranges</span>
                            </div>
                            <div class="greeting">${greeting}, <span class="highlight">${currentUser?.name || 'HRA'}</span></div>
                        </div>
                        <div class="hero-right">
                            <div class="clock" id="heroClock">--:--:--</div>
                            <div class="clock-label">${isSessionActive ? 'Session Active' : 'Session Closed'}</div>
                            <div class="countdown" id="heroCountdown">${isSessionActive ? '⏱ --:--:--' : '⏸ Session Closed'}</div>
                        </div>
                    </div>

                    <!-- SESSION BANNER -->
                    <div class="session-banner" style="border-color:${isSessionActive ? '#d6ad4b' : '#ded6c9'};background:${isSessionActive ? '#fbf7ef' : '#fffcf6'};">
                        <div class="session-icon">${sessionDisplay.icon}</div>
                        <div class="session-info">
                            <div class="session-title">${sessionDisplay.statusText}</div>
                            <div class="session-sub">${sessionDisplay.detailText}</div>
                            ${currentSession ? `
                                <div class="session-detail">
                                    ${sessionDate} · ${sessionStart} — ${sessionEnd} · Grace: ${sessionGrace}min
                                </div>
                            ` : ''}
                        </div>
                        <div>
                            <span class="session-status-badge ${sessionDisplay.badgeClass}">${sessionDisplay.badgeText}</span>
                        </div>
                    </div>

                    <!-- STAT CARDS - 6 Cards -->
                    <div class="stat-card-grid">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-users"></i></div>
                            <div class="stat-number">${totalStudents}</div>
                            <div class="stat-label">Students</div>
                            <div class="stat-sub">Total</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-check-circle" style="color:#2d6545;"></i></div>
                            <div class="stat-number" style="color:#2d6545;">${verified}</div>
                            <div class="stat-label">Verified</div>
                            <div class="stat-sub">${completion}%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-hourglass-half" style="color:#d97706;"></i></div>
                            <div class="stat-number" style="color:#d97706;">${pending}</div>
                            <div class="stat-label">Pending</div>
                            <div class="stat-sub">Not verified</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-door-open" style="color:#a77915;"></i></div>
                            <div class="stat-number" style="color:#a77915;">${roomsCompleted} / ${roomsWithStudents.length}</div>
                            <div class="stat-label">Rooms Complete</div>
                            <div class="stat-sub">${roomsWithStudents.length > 0 ? Math.round((roomsCompleted/roomsWithStudents.length)*100) : 0}%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-user-tie" style="color:#2563eb;"></i></div>
                            <div class="stat-number" style="color:#2563eb;">${activeRA}</div>
                            <div class="stat-label">RA Active</div>
                            <div class="stat-sub">/${raStaff.length}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-fingerprint" style="color:#a77915;"></i></div>
                            <div class="stat-number" style="color:#a77915;">${scans.length}</div>
                            <div class="stat-label">Face Matches</div>
                            <div class="stat-sub">Total scans</div>
                        </div>
                    </div>

                    <!-- ROW 2: Hostel Progress + RA Activity -->
                    <div class="grid-2 mt-4">
                        <!-- Hostel Progress -->
                        <div class="card">
                            <div class="card-title"><span class="icon"><i class="fas fa-chart-line"></i></span> Hostel Progress</div>
                            <div class="flex-between">
                                <span class="text-sm text-muted">${verified} / ${totalStudents} Verified</span>
                                <span class="font-bold" style="color:#a77915;">${completion}%</span>
                            </div>
                            <div class="progress-bar mt-1">
                                <div class="fill" style="width:${completion}%;background:${completion === 100 ? '#2d6545' : '#d6ad4b'};"></div>
                            </div>
                            <div class="mt-3">
                                ${floorData.length > 0 ? floorData.map(f => `
                                    <div class="floor-progress-item">
                                        <div class="floor-header">
                                            <span class="floor-name">${f.name}</span>
                                            <span class="floor-stats">
                                                ${f.checked}/${f.total} 
                                                <span class="percent">${f.progress}%</span>
                                                ${f.progress === 100 ? '✅' : ''}
                                            </span>
                                        </div>
                                        <div class="floor-progress">
                                            <div class="progress-bar">
                                                <div class="fill" style="width:${f.progress}%;background:${f.progress === 100 ? '#2d6545' : '#d6ad4b'};"></div>
                                            </div>
                                        </div>
                                        ${f.areas.map(area => `
                                            <div class="flex-between" style="padding:0.1rem 0 0.1rem 1rem;font-size:0.7rem;color:#6b778b;border-bottom:1px solid #f5f1e8;">
                                                <span>${area.name}</span>
                                                <span>${area.checked}/${area.total}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                `).join('') : '<p class="text-muted text-sm">No floors configured</p>'}
                            </div>
                        </div>

                        <!-- RA Activity -->
                        <div class="card">
                            <div class="card-title"><span class="icon"><i class="fas fa-user-tie"></i></span> Live RA Activity</div>
                            <div class="scrollable-section" style="max-height:220px;">
                                ${raActivity.length > 0 ? raActivity.map(ra => `
                                    <div class="ra-activity-item">
                                        <span class="ra-name">${ra.name}</span>
                                        <span class="ra-room">${ra.room}</span>
                                        <span class="ra-status">
                                            <span class="badge ${ra.statusClass}" style="font-size:0.5rem;">${ra.status}</span>
                                            ${ra.total > 0 ? `${ra.verified}/${ra.total}` : ''}
                                        </span>
                                    </div>
                                `).join('') : '<p class="text-muted text-sm">No RAs assigned</p>'}
                            </div>
                        </div>
                    </div>

                    <!-- ROW 3: Rooms Needing Attention -->
                    <div class="card mt-4">
                        <div class="card-title"><span class="icon"><i class="fas fa-clock"></i></span> Rooms Needing Attention</div>
                        <div class="scrollable-section" style="max-height:200px;">
                            ${pendingRooms.length > 0 ? pendingRooms.map(r => `
                                <div class="room-attention-item">
                                    <div class="room-info">
                                        <span class="room-code">${r.room}</span>
                                        <span class="room-detail">${r.verified}/${r.total} verified</span>
                                        <div class="progress-bar" style="width:80px;height:0.3rem;">
                                            <div class="fill" style="width:${r.progress}%;background:${r.progress === 100 ? '#2d6545' : '#d97706'};"></div>
                                        </div>
                                    </div>
                                    <div class="room-status">
                                        <span class="badge badge-pending" style="font-size:0.5rem;">
                                            ${r.progress === 100 ? '✅ Complete' : r.progress > 50 ? '🟡 In Progress' : '⏳ Waiting'}
                                        </span>
                                    </div>
                                </div>
                            `).join('') : '<p class="text-muted text-sm">🎉 All rooms completed!</p>'}
                        </div>
                        ${pendingRooms.length > 0 ? `
                            <div class="mt-2 text-right">
                                <button class="btn-ghost" style="font-size:0.8rem;" onclick="showToast('Viewing all rooms','info')">
                                    <i class="fas fa-arrow-right"></i> View All Rooms
                                </button>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Today's Summary -->
                    <div class="card mt-4" style="border-color:#d6ad4b;background:#fbf7ef;">
                        <div class="card-title"><span class="icon"><i class="fas fa-chart-pie"></i></span> Today's Summary</div>
                        <div class="grid-3">
                            <div><span class="text-xs text-muted">Hostel</span><br><span class="font-bold">${hostelName}</span></div>
                            <div><span class="text-xs text-muted">Type</span><br><span class="font-bold">${hostelTypeLabel}</span></div>
                            <div><span class="text-xs text-muted">Session</span><br><span class="font-bold ${isSessionActive ? 'text-gold' : 'text-muted'}">${isSessionActive ? '🟢 Active' : '🔴 Closed'}</span></div>
                            <div><span class="text-xs text-muted">Students</span><br><span class="font-bold">${totalStudents}</span></div>
                            <div><span class="text-xs text-muted">Verified</span><br><span class="font-bold" style="color:#2d6545;">${verified}</span></div>
                            <div><span class="text-xs text-muted">Pending</span><br><span class="font-bold" style="color:#d97706;">${pending}</span></div>
                            <div><span class="text-xs text-muted">Rooms Completed</span><br><span class="font-bold" style="color:#a77915;">${roomsCompleted} / ${roomsWithStudents.length}</span></div>
                            <div><span class="text-xs text-muted">RA Active</span><br><span class="font-bold" style="color:#2563eb;">${activeRA} / ${raStaff.length}</span></div>
                            <div><span class="text-xs text-muted">Face Matches</span><br><span class="font-bold">${scans.length}</span></div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="mt-6 pt-4 border-t text-center">
                        <p class="text-xs text-muted">
                            BIU BedCheck System v1.0 · © Benson Idahosa University
                            <span class="ml-4"><span class="status-dot green"></span> System Online</span>
                        </p>
                    </div>
                `;

                screenContent.innerHTML = html;
                startClock();
            }

            // =============================================
            // DATA LOADING
            // =============================================
            async function loadAllData() {
                try {
                    const userData = sessionStorage.getItem('bedcheck_user');
                    const token = sessionStorage.getItem('bedcheck_token');
                    
                    if (!userData || !token) {
                        window.location.replace('../Login.html');
                        return;
                    }
                    
                    try {
                        currentUser = JSON.parse(userData);
                        if (!sessionStorage.getItem('bedcheck_user')) sessionStorage.setItem('bedcheck_user', userData);
                        if (!currentUser.id) { showToast('User data incomplete', 'error');
                            setTimeout(() => window.location.replace('../Login.html'), 2000); return; }
                    } catch (e) { window.location.replace('../Login.html'); return; }
                    updateUserDisplay();

                    // Get HRA's hostel
                    hostelData = await getHRAHostel();
                    
                    if (!hostelData) {
                        roleScope.textContent = 'No hostel assigned';
                        showToast('No hostel assigned', 'error');
                        renderDashboard();
                        return;
                    }
                    
                    roleScope.textContent = hostelData.name + ' · Hostel Representative Admin';
                    document.getElementById('mobileRoleFooter').textContent = `HRA · ${hostelData.name} Hostel`;
                    setNotice(`${hostelData.name} · HRA Dashboard`);
                    updateUserDisplay();

                    // Load data using standard endpoints with filtering
                    const allStudentsData = await apiCall('/students').catch(() => ({ data: [] }));
                    const allStaffData = await apiCall('/staff').catch(() => ({ data: [] }));
                    const floorsData = await apiCall('/floors-flats').catch(() => ({ data: [] }));
                    const roomsData = await apiCall('/rooms').catch(() => ({ data: [] }));
                    
                    // Filter by hostel ID
                    students = (allStudentsData.data || []).filter(s => s.hostel_id === hostelData.id);
                    staff = (allStaffData.data || []).filter(s => s.hostel_id === hostelData.id);
                    floors = (floorsData.data || []).filter(f => f.hostel_id === hostelData.id);
                    rooms = (roomsData.data || []).filter(r => {
                        const floor = floors.find(f => f.id === r.floor_flat_id);
                        return floor && floor.hostel_id === hostelData.id;
                    });

                    // Load scans for this hostel's students
                    try {
                        const scansData = await apiCall('/bedcheck/scans').catch(() => ({ data: [] }));
                        const studentIds = students.map(s => s.id);
                        scans = (scansData.data || []).filter(s => studentIds.includes(s.student_id));
                    } catch (e) {
                        scans = [];
                    }

                    // Load session status
                    await loadSessionStatus();

                    const now = new Date();
                    document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    renderDashboard();
                    startSessionChecker();
                    
                } catch (error) {
                    console.error('Load error:', error);
                    if (!error.message.includes('Authentication required') && !error.message.includes('No authentication token')) {
                        showToast('Error loading data: ' + error.message, 'error');
                    }
                    setNotice('Error loading dashboard data. Please refresh.');
                    screenContent.innerHTML = `
                        <div class="card mt-4" style="border-color:#a84134;background:#f9e2de;">
                            <div class="text-center p-4">
                                <i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#a84134;"></i>
                                <h2 class="mt-3">Error Loading Data</h2>
                                <p class="text-muted">${error.message}</p>
                                <button class="btn-primary mt-3" onclick="location.reload()"><i class="fas fa-refresh"></i> Refresh</button>
                            </div>
                        </div>
                    `;
                }
            }

            function handleLogout() {
                sessionStorage.removeItem('bedcheck_token');
                sessionStorage.removeItem('bedcheck_user');
                sessionStorage.removeItem('bedcheck_role');
                showToast('Logging out...', 'success');
                setTimeout(() => window.location.replace('../Login.html'), 500);
            }

            function openMobileDrawer() {
                document.getElementById('mobileDrawer').classList.add('open');
                document.getElementById('drawerOverlay').classList.add('show');
            }

            function closeMobileDrawer() {
                document.getElementById('mobileDrawer').classList.remove('open');
                document.getElementById('drawerOverlay').classList.remove('show');
            }

            function init() {
                const userData = sessionStorage.getItem('bedcheck_user');
                const token = sessionStorage.getItem('bedcheck_token');
                
                if (!userData || !token) {
                    window.location.replace('../Login.html');
                    return;
                }
                
                try {
                    currentUser = JSON.parse(userData);
                    if (!sessionStorage.getItem('bedcheck_user')) sessionStorage.setItem('bedcheck_user', userData);
                    if (!currentUser.id) { showToast('User data incomplete', 'error');
                        setTimeout(() => window.location.replace('../Login.html'), 2000); return; }
                    updateUserDisplay();
                    loadAllData();
                } catch (e) { console.error('Error parsing user data:', e);
                    window.location.replace('../Login.html'); }

                logoutBtn.addEventListener('click', handleLogout);
                menuToggle.addEventListener('click', openMobileDrawer);
                document.getElementById('closeDrawer').addEventListener('click', closeMobileDrawer);
                document.getElementById('drawerOverlay').addEventListener('click', closeMobileDrawer);
            }

            window.showToast = showToast;
            window.loadAllData = loadAllData;

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>

</body>
</html>
