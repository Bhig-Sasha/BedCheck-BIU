<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Face ID · Rotate & Enroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0b0b12;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #16161f;
      border-radius: 48px;
      padding: 20px 20px 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.04);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d6ad4b55, transparent);
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding: 0 4px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-left .logo {
      width: 38px;
      height: 38px;
      background: #d6ad4b;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0b12;
      font-weight: 700;
      font-size: 16px;
    }
    .header-left h1 {
      font-size: 18px;
      font-weight: 700;
      color: #f1f1f6;
      letter-spacing: -0.3px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #8e8ea0;
      background: #22222e;
      padding: 6px 14px;
      border-radius: 40px;
      border: 1px solid #2d2d3a;
    }
    .header-right i {
      color: #d6ad4b;
      font-size: 12px;
    }
    .header-right .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .header-right .status-indicator.online { background: #4ade80; }
    .header-right .status-indicator.offline { background: #f87171; }
    .header-right .status-indicator.checking { background: #fbbf24; animation: pulse-dot 0.8s infinite; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* camera */
    .camera-wrapper {
      position: relative;
      background: #0c0c14;
      border-radius: 32px;
      overflow: hidden;
      aspect-ratio: 3 / 4;
      min-height: 380px;
      border: 1px solid #262633;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
      background: #0a0a10;
    }
    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0c0c14;
      color: #8e8ea0;
      z-index: 5;
      gap: 12px;
      backdrop-filter: blur(2px);
    }
    .camera-placeholder i {
      font-size: 44px;
      color: #3d3d4a;
    }
    .camera-placeholder button {
      background: #d6ad4b;
      border: none;
      color: #0b0b12;
      font-weight: 600;
      padding: 10px 28px;
      border-radius: 40px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 20px rgba(214, 173, 75, 0.2);
    }
    .camera-placeholder button:hover {
      transform: scale(1.02);
      background: #e0b85c;
    }
    .camera-placeholder.hidden {
      display: none;
    }

    /* === APPLE-STYLE OVERLAY === */
    .face-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* main ring – exactly like Apple */
    .ring {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.15);
      position: relative;
      transition: border-color 0.3s, box-shadow 0.3s;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02);
    }
    .ring.detected {
      border-color: #4ade80;
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.12);
    }
    .ring.complete {
      border-color: #4ade80;
      box-shadow: 0 0 60px rgba(74, 222, 128, 0.2);
    }

    /* dotted guideline around ring – subtle */
    .ring-dots {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255,255,255,0.08);
      pointer-events: none;
    }
    /* 4 small directional dots (top, right, bottom, left) */
    .ring-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      transition: 0.3s;
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
    }
    .ring-dot.active {
      background: #4ade80;
      box-shadow: 0 0 20px #4ade8070;
    }
    .ring-dot.top { top: -6px; left: 50%; transform: translateX(-50%); }
    .ring-dot.right { right: -6px; top: 50%; transform: translateY(-50%); }
    .ring-dot.bottom { bottom: -6px; left: 50%; transform: translateX(-50%); }
    .ring-dot.left { left: -6px; top: 50%; transform: translateY(-50%); }

    /* center crosshair */
    .crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 30px;
      opacity: 0.3;
      transition: 0.3s;
    }
    .crosshair::before,
    .crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.3);
    }
    .crosshair::before {
      width: 1px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }
    .crosshair::after {
      width: 100%;
      height: 1px;
      top: 50%;
      transform: translateY(-50%);
    }
    .ring.detected .crosshair { opacity: 0.8; }

    /* position label – bottom of ring */
    .position-badge {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      padding: 8px 22px;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.06);
      color: #d0d0dd;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: 0.2s;
      pointer-events: none;
    }
    .position-badge .badge-icon {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d6ad4b;
      margin-right: 4px;
    }
    .position-badge.done {
      border-color: #4ade80;
      color: #b0f0c0;
    }
    .position-badge.done .badge-icon { background: #4ade80; }

    /* progress ring (top right) */
    .progress-ring {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      width: 52px;
      height: 52px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .progress-ring svg {
      transform: rotate(-90deg);
      width: 52px;
      height: 52px;
    }
    .progress-ring .bg {
      fill: none;
      stroke: rgba(255,255,255,0.06);
      stroke-width: 3.5;
    }
    .progress-ring .fg {
      fill: none;
      stroke: #4ade80;
      stroke-width: 3.5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease;
    }
    .progress-ring .pct {
      position: absolute;
      font-size: 12px;
      font-weight: 700;
      color: #f0f0f8;
    }

    /* bottom status */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding: 0 4px;
    }
    .status-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 12px #4ade8040;
      transition: 0.2s;
    }
    .status-dot.idle { background: #8e8ea0; box-shadow: none; }
    .status-dot.capturing { background: #d6ad4b; box-shadow: 0 0 16px #d6ad4b60; animation: pulse-dot 0.8s infinite; }
    .status-dot.done { background: #4ade80; box-shadow: 0 0 20px #4ade8060; }
    .status-text {
      font-size: 14px;
      font-weight: 500;
      color: #c8c8d8;
    }
    .status-count {
      background: #22222e;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
      color: #b0b0c0;
      border: 1px solid #2d2d3a;
    }
    .status-count span { color: #4ade80; }

    /* controls */
    .controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      background: #2a2a38;
      color: #b0b0c0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid #323242;
    }
    .btn-primary {
      background: #d6ad4b;
      color: #0b0b12;
      border: none;
      box-shadow: 0 6px 20px rgba(214, 173, 75, 0.2);
    }
    .btn-primary:hover { background: #e0b85c; transform: scale(1.01); }
    .btn-primary:disabled { opacity: 0.4; pointer-events: none; }
    .btn-success {
      background: #4ade80;
      color: #0b0b12;
      border: none;
    }
    .btn-success:hover { background: #5be88e; }
    .btn-success:disabled { opacity: 0.4; pointer-events: none; }
    .btn-outline { background: transparent; border: 1px solid #3a3a4a; }
    .btn-outline:hover { background: #22222e; }
    .btn-back {
      background: transparent;
      color: #8e8ea0;
      border: none;
      font-size: 14px;
      padding: 10px;
      width: 100%;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-back:hover { color: #d0d0dd; }

    /* toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1c1c28;
      border: 1px solid #3a3a4a;
      padding: 12px 24px;
      border-radius: 60px;
      color: #f0f0f8;
      font-weight: 500;
      font-size: 14px;
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      opacity: 0;
      transition: 0.4s ease;
      z-index: 99;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: #4ade80; }
    .toast.error { border-color: #f87171; }

    /* loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      border-radius: 32px;
      gap: 12px;
    }
    .loading-overlay.show { display: flex; }
    .loading-overlay .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(214, 173, 75, 0.2);
      border-top-color: #d6ad4b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-overlay .loading-text {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 500;
    }
    .loading-overlay .loading-progress {
      width: 60%;
      height: 3px;
      background: rgba(255,255,255,0.05);
      border-radius: 9999px;
      overflow: hidden;
    }
    .loading-overlay .loading-progress .fill {
      height: 100%;
      background: linear-gradient(90deg, #d6ad4b, #4ade80);
      border-radius: 9999px;
      transition: width 0.3s ease;
    }

    /* success overlay */
    .success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(74, 222, 128, 0.08);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      border-radius: 32px;
      backdrop-filter: blur(4px);
      gap: 8px;
    }
    .success-overlay.show { display: flex; }
    .success-overlay .icon { font-size: 56px; color: #4ade80; }
    .success-overlay .title { font-size: 20px; font-weight: 700; color: #4ade80; }
    .success-overlay .sub { font-size: 14px; color: #94a3b8; }

    /* error overlay */
    .error-overlay {
      position: absolute;
      inset: 0;
      background: rgba(248, 113, 113, 0.08);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 15;
      border-radius: 32px;
      backdrop-filter: blur(4px);
      gap: 8px;
    }
    .error-overlay.show { display: flex; }
    .error-overlay .icon { font-size: 56px; color: #f87171; }
    .error-overlay .title { font-size: 20px; font-weight: 700; color: #f87171; }
    .error-overlay .sub { font-size: 14px; color: #94a3b8; text-align: center; max-width: 80%; }
    .error-overlay .btn-retry {
      margin-top: 12px;
      padding: 10px 28px;
      background: #d6ad4b;
      border: none;
      border-radius: 40px;
      color: #0b0b12;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .error-overlay .btn-retry:hover { background: #e0b85c; }

    /* responsiveness */
    @media (max-width: 460px) {
      .card { padding: 12px; border-radius: 32px; }
      .ring { width: 170px; height: 170px; }
      .ring-dots { inset: -8px; }
      .position-badge { font-size: 12px; padding: 6px 16px; bottom: 18px; }
      .progress-ring { width: 44px; height: 44px; }
      .progress-ring svg { width: 44px; height: 44px; }
      .header-left h1 { font-size: 16px; }
    }
  </style>
</head>
<body>
<div class="card" id="app">
  <!-- header -->
  <div class="header">
    <div class="header-left">
      <div class="logo"><i class="fas fa-face-smile"></i></div>
      <h1>Face ID</h1>
    </div>
    <div class="header-right">
      <span class="status-indicator checking" id="apiIndicator"></span>
      <span id="apiStatusText">Connecting...</span>
    </div>
  </div>

  <!-- camera -->
  <div class="camera-wrapper" id="cameraWrapper">
    <video id="video" autoplay playsinline muted></video>
    <div class="camera-placeholder" id="cameraPlaceholder">
      <i class="fas fa-camera"></i>
      <span style="font-weight:500;">Camera required</span>
      <button onclick="requestCamera()">Enable Camera</button>
    </div>

    <!-- Apple-style overlay -->
    <div class="face-overlay">
      <div class="ring" id="ring">
        <div class="ring-dots"></div>
        <span class="ring-dot top" id="dotTop"></span>
        <span class="ring-dot right" id="dotRight"></span>
        <span class="ring-dot bottom" id="dotBottom"></span>
        <span class="ring-dot left" id="dotLeft"></span>
        <div class="crosshair"></div>
      </div>
      <div class="position-badge" id="positionBadge">
        <span class="badge-icon"></span>
        <span id="posLabel">Front</span>
      </div>
    </div>

    <!-- progress ring -->
    <div class="progress-ring">
      <svg viewBox="0 0 52 52">
        <circle class="bg" cx="26" cy="26" r="22" />
        <circle class="fg" id="progressCircle" cx="26" cy="26" r="22"
          stroke-dasharray="138.23" stroke-dashoffset="138.23" />
      </svg>
      <span class="pct" id="pctText">0%</span>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">Enrolling with InsightFace...</div>
      <div class="loading-progress">
        <div class="fill" id="loadingProgressFill" style="width:0%"></div>
      </div>
    </div>

    <!-- Success Overlay -->
    <div class="success-overlay" id="successOverlay">
      <div class="icon">✅</div>
      <div class="title">Face Enrolled!</div>
      <div class="sub">Your face is now registered</div>
    </div>

    <!-- Error Overlay -->
    <div class="error-overlay" id="errorOverlay">
      <div class="icon">❌</div>
      <div class="title">Enrollment Failed</div>
      <div class="sub" id="errorMessage">An error occurred during enrollment</div>
      <button class="btn-retry" onclick="retryEnrollment()">🔄 Retry</button>
    </div>
  </div>

  <!-- status -->
  <div class="status-bar">
    <div class="status-left">
      <span class="status-dot idle" id="statusDot"></span>
      <span class="status-text" id="statusText">Position your face</span>
    </div>
    <div class="status-count"><span id="captureCount">0</span> / 10</div>
  </div>

  <!-- controls -->
  <div class="controls">
    <div class="btn-group">
      <button class="btn btn-primary" id="btnStart" onclick="startCapture()">
        <i class="fas fa-play"></i> Start
      </button>
      <button class="btn btn-outline" onclick="resetAll()">
        <i class="fas fa-rotate-left"></i> Reset
      </button>
    </div>
    <div class="btn-group" id="enrollGroup" style="display:none;">
      <button class="btn btn-success" id="btnEnroll" onclick="enrollFace()">
        <i class="fas fa-check-circle"></i> Enroll
      </button>
    </div>
    <button class="btn-back" onclick="goBack()">
      <i class="fas fa-arrow-left"></i> Back
    </button>
  </div>
</div>

<!-- toast -->
<div class="toast" id="toast"></div>

<script>
  (function(){
    'use strict';

    // =============================================
    // API CONFIGURATION
    // =============================================
    const FACE_API_URL = localStorage.getItem('faceApiUrl') || 'https://face-api-f9k5.onrender.com';
    const NODE_API_BASE = 'https://bedcheck-biu.onrender.com/api';

    // =============================================
    // STATE
    // =============================================
    const TOTAL = 10;
    const POSITIONS = ['Front', 'Right', 'Bottom', 'Left', 'Top'];
    const DIRS = ['center', 'right', 'down', 'left', 'up'];
    let captured = [];
    let isActive = false;
    let isEnrolling = false;
    let stream = null;
    let isCamReady = false;
    let captureInterval = null;
    let faceDetected = false;
    let quality = 0;
    let isApiOnline = false;
    let lastDetectionTime = 0;
    const DETECTION_INTERVAL = 500;
    let healthCheckTimer = null;
    const HEALTH_CHECK_INTERVAL = 30000;

    let studentData = {
      id: null,
      name: '',
      matric: '',
      hostel_id: null,
      hostel_name: '',
      room_id: null,
      room_code: '',
      bed_space_id: null,
      bed_code: ''
    };

    // =============================================
    // DOM REFS
    // =============================================
    const video = document.getElementById('video');
    const ring = document.getElementById('ring');
    const dotTop = document.getElementById('dotTop');
    const dotRight = document.getElementById('dotRight');
    const dotBottom = document.getElementById('dotBottom');
    const dotLeft = document.getElementById('dotLeft');
    const posLabel = document.getElementById('posLabel');
    const posBadge = document.getElementById('positionBadge');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const captureCount = document.getElementById('captureCount');
    const pctText = document.getElementById('pctText');
    const progressCircle = document.getElementById('progressCircle');
    const btnStart = document.getElementById('btnStart');
    const btnEnroll = document.getElementById('btnEnroll');
    const enrollGroup = document.getElementById('enrollGroup');
    const toast = document.getElementById('toast');
    const placeholder = document.getElementById('cameraPlaceholder');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const loadingProgressFill = document.getElementById('loadingProgressFill');
    const successOverlay = document.getElementById('successOverlay');
    const errorOverlay = document.getElementById('errorOverlay');
    const errorMessage = document.getElementById('errorMessage');
    const apiIndicator = document.getElementById('apiIndicator');
    const apiStatusText = document.getElementById('apiStatusText');

    const circumference = 138.23;

    // =============================================
    // TOAST
    // =============================================
    function showToast(msg, type='info') {
      toast.textContent = msg;
      toast.className = `toast ${type}`;
      setTimeout(() => toast.classList.add('show'), 20);
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // =============================================
    // API STATUS CHECK
    // =============================================
    async function checkApiStatus() {
      try {
        apiIndicator.className = 'status-indicator checking';
        apiStatusText.textContent = 'Checking API...';
        
        const response = await fetch(`${FACE_API_URL}/health`, {
          method: 'GET',
          signal: AbortSignal.timeout(5000)
        });
        
        if (response.ok) {
          const data = await response.json();
          isApiOnline = data.status === 'running' || data.status === 'healthy' || data.status === 'ok';
          apiIndicator.className = `status-indicator ${isApiOnline ? 'online' : 'offline'}`;
          apiStatusText.textContent = isApiOnline ? '✅ Online' : '⚠️ Unknown';
          return isApiOnline;
        } else {
          isApiOnline = false;
          apiIndicator.className = 'status-indicator offline';
          apiStatusText.textContent = '❌ Offline';
          return false;
        }
      } catch (error) {
        isApiOnline = false;
        apiIndicator.className = 'status-indicator offline';
        apiStatusText.textContent = '❌ Offline';
        return false;
      }
    }

    // =============================================
    // FACE DETECTION WITH API
    // =============================================
    async function detectFaceWithAPI(imageData) {
      const now = Date.now();
      if (now - lastDetectionTime < DETECTION_INTERVAL) {
        return faceDetected;
      }
      lastDetectionTime = now;

      if (!isApiOnline) return faceDetected;

      try {
        let base64Image = imageData;
        if (base64Image.startsWith('data:image')) {
          base64Image = base64Image.split(',')[1];
        }
        
        const response = await fetch(`${FACE_API_URL}/detect-face`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image })
        });
        
        if (!response.ok) return false;
        const data = await response.json();
        return data.success && data.faces && data.faces.length > 0;
      } catch (error) {
        console.warn('Face detection error:', error);
        return false;
      }
    }

    // =============================================
    // CAMERA
    // =============================================
    async function startCamera() {
      try {
        if (stream) stopCamera();
        const constraints = { 
          video: { 
            facingMode: 'user', 
            width: { ideal: 640 }, 
            height: { ideal: 480 } 
          }, 
          audio: false 
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        isCamReady = true;
        placeholder.classList.add('hidden');
        showToast('Camera ready', 'success');
        monitorFace();
        return true;
      } catch(e) {
        console.warn(e);
        placeholder.classList.remove('hidden');
        showToast('Camera access denied', 'error');
        return false;
      }
    }

    function stopCamera() {
      if (stream) { 
        stream.getTracks().forEach(t => t.stop()); 
        stream = null; 
      }
      isCamReady = false;
    }

    window.requestCamera = startCamera;

    // =============================================
    // FACE MONITORING
    // =============================================
    function monitorFace() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      async function check() {
        if (!isCamReady || !video || video.readyState < 2) { 
          requestAnimationFrame(check); 
          return; 
        }
        try {
          canvas.width = video.videoWidth || 320;
          canvas.height = video.videoHeight || 240;
          ctx.save();
          ctx.scale(-1, 1);
          ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
          ctx.restore();
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          
          const detected = await detectFaceWithAPI(dataUrl);
          faceDetected = detected;
          
          if (detected) {
            ring.classList.add('detected');
            quality = Math.min(95, quality + 4);
          } else {
            ring.classList.remove('detected');
            quality = Math.max(0, quality - 2);
          }
          
          if (isActive && faceDetected && quality > 45 && captured.length < TOTAL) {
            // Capture will be handled by interval
          }
          updateUI();
        } catch(e) {
          console.warn('Monitor error:', e);
        }
        requestAnimationFrame(check);
      }
      check();
    }

    // =============================================
    // UI UPDATES
    // =============================================
    function updateUI() {
      const done = captured.length;
      const pct = Math.min(100, (done / TOTAL) * 100);
      pctText.textContent = Math.round(pct) + '%';
      const offset = circumference - (pct / 100) * circumference;
      progressCircle.style.strokeDashoffset = offset;
      captureCount.textContent = done;

      [dotTop, dotRight, dotBottom, dotLeft].forEach(d => d.classList.remove('active'));
      if (done < TOTAL) {
        const idx = done % 5;
        const dir = DIRS[idx];
        if (dir === 'top') dotTop.classList.add('active');
        else if (dir === 'right') dotRight.classList.add('active');
        else if (dir === 'bottom') dotBottom.classList.add('active');
        else if (dir === 'left') dotLeft.classList.add('active');
        posLabel.textContent = POSITIONS[idx];
        posBadge.classList.remove('done');
      } else {
        posLabel.textContent = '✓ Complete';
        posBadge.classList.add('done');
        ring.classList.add('complete');
      }

      if (done === TOTAL) {
        ring.classList.add('complete');
        statusDot.className = 'status-dot done';
        statusText.textContent = '✅ All angles captured';
        btnStart.disabled = true;
        btnStart.innerHTML = '<i class="fas fa-check"></i> Done';
        enrollGroup.style.display = 'flex';
        if (captureInterval) {
          clearInterval(captureInterval);
          captureInterval = null;
        }
        isActive = false;
      } else if (isActive) {
        statusDot.className = 'status-dot capturing';
        statusText.textContent = faceDetected ? 'Capturing...' : 'Move your head';
      } else {
        statusDot.className = 'status-dot idle';
        statusText.textContent = faceDetected ? 'Face detected' : 'Position your face';
      }
    }

    // =============================================
    // START CAPTURE
    // =============================================
    async function startCapture() {
      if (captured.length >= TOTAL) { 
        showToast('Already complete!', 'info'); 
        return; 
      }
      if (!isCamReady) { 
        const ok = await startCamera(); 
        if (!ok) return; 
      }
      if (isActive) return;
      
      await checkApiStatus();
      if (!isApiOnline) {
        showToast('Face API is offline. Please try again.', 'error');
        return;
      }

      isActive = true;
      btnStart.disabled = true;
      btnStart.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Capturing';
      statusDot.className = 'status-dot capturing';
      statusText.textContent = 'Rotate your head slowly';
      showToast('🔄 Move your head in a circle', 'info');
      
      if (captureInterval) clearInterval(captureInterval);
      captureInterval = setInterval(async () => {
        if (!isActive) return;
        if (faceDetected && quality > 40 && captured.length < TOTAL) {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = video.videoWidth || 320;
          canvas.height = video.videoHeight || 240;
          ctx.save();
          ctx.scale(-1, 1);
          ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
          ctx.restore();
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          const idx = captured.length % 5;
          captured.push({ 
            index: captured.length, 
            direction: DIRS[idx], 
            image: dataUrl, 
            quality: quality 
          });
          updateUI();
          if (captured.length === TOTAL) {
            clearInterval(captureInterval);
            captureInterval = null;
            isActive = false;
            updateUI();
            showToast('✅ All 10 positions captured!', 'success');
            btnStart.innerHTML = '<i class="fas fa-check"></i> Done';
            enrollGroup.style.display = 'flex';
          }
        } else {
          statusText.textContent = faceDetected ? 'Hold still...' : 'Move your head';
        }
      }, 1200);
      updateUI();
    }

    // =============================================
    // LOAD STUDENT DATA
    // =============================================
    function loadStudentData() {
      try {
        const stored = localStorage.getItem('studentForFaceID');
        if (stored) {
          studentData = JSON.parse(stored);
          console.log('✅ Student data loaded:', studentData);
        } else {
          showToast('No student data found. Please register first.', 'error');
          setTimeout(() => { window.location.href = 'hub.html'; }, 2000);
        }
      } catch (error) {
        console.error('Error loading student data:', error);
      }
    }

    // =============================================
    // ENROLL FACE WITH API
    // =============================================
    async function enrollFace() {
      if (captured.length < TOTAL) { 
        showToast('Capture all 10 positions first', 'error'); 
        return; 
      }
      if (isEnrolling) return;
      
      await checkApiStatus();
      if (!isApiOnline) {
        showToast('Face API is offline. Please try again.', 'error');
        return;
      }

      if (!studentData.id && !studentData.matric) {
        loadStudentData();
        if (!studentData.id && !studentData.matric) {
          showToast('Student data not found. Please register first.', 'error');
          return;
        }
      }

      isEnrolling = true;
      btnEnroll.disabled = true;
      btnEnroll.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enrolling...';
      errorOverlay.classList.remove('show');
      successOverlay.classList.remove('show');
      loadingOverlay.classList.add('show');
      loadingText.textContent = 'Preparing enrollment...';
      loadingProgressFill.style.width = '10%';

      try {
        let studentId = studentData.id;

        if (!studentId && studentData.matric) {
          const searchRes = await fetch(`${NODE_API_BASE}/students?search=${encodeURIComponent(studentData.matric)}`);
          if (searchRes.ok) {
            const data = await searchRes.json();
            if (data.data && data.data.length > 0) {
              studentId = data.data[0].id;
              studentData.id = studentId;
            }
          }
        }

        if (!studentId) {
          throw new Error('Student ID not found. Please complete registration first.');
        }

        loadingText.textContent = 'Selecting best face capture...';
        loadingProgressFill.style.width = '20%';

        let bestFrame = captured.reduce((best, current) => {
          return (current.quality || 0) > (best.quality || 0) ? current : best;
        }, captured[0]);

        loadingText.textContent = 'Enrolling with InsightFace...';
        loadingProgressFill.style.width = '40%';

        let imageData = bestFrame.image;
        if (imageData.startsWith('data:image')) {
          imageData = imageData.split(',')[1];
        }

        const enrollResponse = await fetch(`${FACE_API_URL}/enroll-face`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            student_id: studentId,
            image: imageData,
            name: studentData.name || '',
            matric: studentData.matric || '',
            hostel: studentData.hostel_id || '',
            room: studentData.room_id || ''
          })
        });

        loadingProgressFill.style.width = '60%';

        if (!enrollResponse.ok) {
          let errorMsg = `HTTP ${enrollResponse.status}`;
          try {
            const errorData = await enrollResponse.json();
            errorMsg = errorData.message || errorData.detail || errorMsg;
          } catch (e) {
            errorMsg = enrollResponse.statusText || errorMsg;
          }
          throw new Error(`Enrollment failed: ${errorMsg}`);
        }

        const enrollResult = await enrollResponse.json();
        loadingProgressFill.style.width = '75%';

        if (enrollResult.success || enrollResult.status === 'success' || enrollResult.verified) {
          loadingText.textContent = 'Saving to database...';
          loadingProgressFill.style.width = '90%';

          try {
            const updateResponse = await fetch(`${NODE_API_BASE}/students/${studentId}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ face_enrolled: true })
            });
            
            if (updateResponse.ok) {
              console.log('✅ Student marked as face_enrolled');
            }
          } catch (saveError) {
            console.warn('Save error:', saveError);
          }

          loadingText.textContent = '✅ Enrollment successful!';
          loadingProgressFill.style.width = '100%';

          setTimeout(() => {
            loadingOverlay.classList.remove('show');
            btnEnroll.innerHTML = '<i class="fas fa-check"></i> Enrolled ✓';
            successOverlay.classList.add('show');
            showToast('✅ Face enrolled successfully!', 'success');
            
            setTimeout(() => {
              localStorage.removeItem('studentForFaceID');
              window.location.href = 'hub.html';
            }, 2500);
          }, 1000);
        } else {
          throw new Error(enrollResult.message || 'Enrollment failed');
        }
      } catch (error) {
        console.error('Enrollment error:', error);
        loadingOverlay.classList.remove('show');
        errorMessage.textContent = error.message || 'An error occurred during enrollment. Please try again.';
        errorOverlay.classList.add('show');
        showToast('Error: ' + error.message, 'error');
        isEnrolling = false;
        btnEnroll.disabled = false;
        btnEnroll.innerHTML = '<i class="fas fa-check-circle"></i> Enroll';
      }
    }

    // =============================================
    // RETRY ENROLLMENT
    // =============================================
    function retryEnrollment() {
      errorOverlay.classList.remove('show');
      enrollFace();
    }

    // =============================================
    // RESET
    // =============================================
    function resetAll() {
      if (captured.length > 0 && !confirm('Reset all captures?')) return;
      if (captureInterval) {
        clearInterval(captureInterval);
        captureInterval = null;
      }
      isActive = false;
      isEnrolling = false;
      captured = [];
      faceDetected = false;
      quality = 0;
      ring.classList.remove('detected', 'complete');
      btnStart.disabled = false;
      btnStart.innerHTML = '<i class="fas fa-play"></i> Start';
      enrollGroup.style.display = 'none';
      btnEnroll.disabled = false;
      btnEnroll.innerHTML = '<i class="fas fa-check-circle"></i> Enroll';
      statusDot.className = 'status-dot idle';
      statusText.textContent = 'Position your face';
      posBadge.classList.remove('done');
      posLabel.textContent = 'Front';
      errorOverlay.classList.remove('show');
      successOverlay.classList.remove('show');
      loadingOverlay.classList.remove('show');
      updateUI();
      showToast('Reset', 'info');
    }

    // =============================================
    // GO BACK
    // =============================================
    function goBack() {
      if (captured.length > 0 && captured.length < TOTAL) {
        if (!confirm('You have unsaved captures. Go back?')) return;
      }
      stopCamera();
      if (healthCheckTimer) {
        clearInterval(healthCheckTimer);
        healthCheckTimer = null;
      }
      localStorage.removeItem('studentForFaceID');
      window.location.href = 'hub.html';
    }

    // =============================================
    // INIT
    // =============================================
    async function init() {
      loadStudentData();
      await checkApiStatus();
      
      healthCheckTimer = setInterval(checkApiStatus, HEALTH_CHECK_INTERVAL);
      
      await startCamera();
      updateUI();
      
      // Show API status
      if (!isApiOnline) {
        showToast('⚠️ Face API is offline. Please check the connection.', 'error');
      }
    }

    // =============================================
    // EXPOSE GLOBALLY
    // =============================================
    window.startCapture = startCapture;
    window.enrollFace = enrollFace;
    window.resetAll = resetAll;
    window.goBack = goBack;
    window.requestCamera = startCamera;
    window.retryEnrollment = retryEnrollment;
    window.checkApiStatus = checkApiStatus;

    // =============================================
    // START
    // =============================================
    document.addEventListener('DOMContentLoaded', init);
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', function() {
      if (healthCheckTimer) {
        clearInterval(healthCheckTimer);
        healthCheckTimer = null;
      }
      stopCamera();
    });

  })();
</script>
