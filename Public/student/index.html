<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration · BIU BedCheck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- RESET & BASE ----- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f5f1e8 0%, #e8e0d5 100%);
            color: #17233c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .register-container {
            max-width: 950px;
            width: 100%;
            background: #fffcf6;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .register-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #d6ad4b, #10233f, #d6ad4b);
        }

        .register-header {
            text-align: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #eee8de;
            margin-bottom: 1.5rem;
        }
        .register-header .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        .register-header .logo .logo-badge {
            display: grid;
            place-items: center;
            width: 3rem;
            height: 3rem;
            background: #d6ad4b;
            border-radius: 0.5rem;
            font-family: 'Merriweather',serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: #10233f;
        }
        .register-header .logo h1 {
            font-family: 'Merriweather',serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #10233f;
        }
        .register-header .subtitle {
            color: #68768a;
            font-size: 0.95rem;
        }
        .register-header .subtitle i { color: #a77915; }

        /* ----- FORM ELEMENTS ----- */
        .card {
            border: 1px solid #ded6c9;
            border-radius: 0.75rem;
            background: #fffcf6;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .card:last-child { margin-bottom: 0; }

        .field { display: flex; flex-direction: column; gap: 0.25rem; }
        .field label { font-weight: 700; font-size: 0.85rem; }
        .field label .required { color: #a84134; }
        .field input, .field select, .field textarea {
            padding: 0.7rem 0.75rem;
            border: 1px solid #cbd2db;
            border-radius: 0.5rem;
            background: white;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
            font-family: inherit;
            transition: border-color 0.15s;
        }
        .field input:focus, .field select:focus, .field textarea:focus { border-color: #a77915; }
        .field textarea { resize: vertical; min-height: 4rem; }
        .field input:disabled, .field select:disabled { background: #f5f1e8; cursor: not-allowed; }

        .grid-2 { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
        .grid-3 { display: grid; gap: 1rem; grid-template-columns: repeat(3, 1fr); }
        @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex-center { display: flex; align-items: center; gap: 0.5rem; }
        .flex-wrap { flex-wrap: wrap; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 0.75rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-5 { margin-top: 1.25rem; }
        .mt-6 { margin-top: 1.5rem; }
        .text-sm { font-size: 0.9rem; }
        .text-xs { font-size: 0.7rem; }
        .text-gold { color: #a77915; }
        .text-muted { color: #68768a; }
        .text-green { color: #2d6545; }
        .font-bold { font-weight: 700; }
        .font-serif { font-family: 'Merriweather',serif; }
        .w-full { width: 100%; }
        .text-center { text-align: center; }
        .border { border: 1px solid #ded6c9; }
        .border-t { border-top: 1px solid #ded6c9; }
        .rounded-lg { border-radius: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }

        /* ----- BUTTONS ----- */
        .btn-primary {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.7rem 1.2rem;
            border: none; border-radius: 0.5rem;
            background: #10233f; color: white;
            font-weight: 700; font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
        }
        .btn-primary:hover { background: #18345a; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-outline {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.7rem 1.2rem;
            border: 1px solid #bfc8d5; border-radius: 0.5rem;
            background: #fffcf6;
            font-weight: 600; font-size: 0.9rem;
            color: #17233c;
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
        }
        .btn-outline:hover { background: #f5f1e8; }

        .btn-success {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.7rem 1.2rem;
            border: none; border-radius: 0.5rem;
            background: #2d6545; color: white;
            font-weight: 700; font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
        }
        .btn-success:hover { background: #1f4a32; }
        .btn-success:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ----- DECLARATION ----- */
        .declaration-item {
            display: flex; align-items: flex-start; gap: 0.75rem;
            padding: 0.4rem 0;
        }
        .declaration-item input[type="checkbox"] {
            margin-top: 0.2rem;
            width: 1.1rem;
            height: 1.1rem;
            accent-color: #2d6545;
            cursor: pointer;
        }

        /* ----- BED VISUAL ----- */
        .bed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 0.5rem;
            padding: 0.5rem;
        }
        .bed-dot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 50px;
            border: 2px solid #cbd2db;
            background: #f8f9fa;
            text-align: center;
        }
        .bed-dot.available {
            background: #e1f0e5;
            color: #2d6545;
            border-color: #2d6545;
        }
        .bed-dot.available:hover { 
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(45, 101, 69, 0.3);
        }
        .bed-dot.occupied {
            background: #f8e1dc;
            color: #9b3c31;
            border-color: #9b3c31;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .bed-dot.selected {
            background: #10233f;
            color: white;
            border-color: #10233f;
            transform: scale(1.05);
            box-shadow: 0 2px 12px rgba(16, 35, 63, 0.4);
        }
        .bed-dot .bed-label {
            font-size: 0.65rem;
            font-weight: 600;
        }
        .bed-dot .bed-status {
            font-size: 0.5rem;
            opacity: 0.7;
        }

        /* ----- SUCCESS SCREEN ----- */
        .success-screen {
            text-align: center;
            padding: 2rem;
        }
        .success-screen .success-icon {
            font-size: 4rem;
            color: #2d6545;
            margin-bottom: 1rem;
        }
        .success-screen .ref-number {
            font-family: 'Merriweather',serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #10233f;
            background: #e7edf5;
            padding: 0.5rem 1.5rem;
            border-radius: 0.5rem;
            display: inline-block;
            margin: 0.5rem 0;
        }
        .success-screen .student-detail-card {
            background: white;
            border-radius: 0.75rem;
            padding: 1.25rem;
            max-width: 420px;
            margin: 0 auto;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid #eee8de;
        }
        .success-screen .student-detail-card .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px solid #f0ebe3;
            font-size: 0.85rem;
        }
        .success-screen .student-detail-card .detail-row:last-child {
            border-bottom: none;
        }
        .success-screen .student-detail-card .detail-label {
            color: #68768a;
        }
        .success-screen .student-detail-card .detail-value {
            font-weight: 600;
        }

        /* ----- FACE ENROLLMENT ----- */
        .face-enrollment {
            background: #f8f6f0;
            border-radius: 0.75rem;
            padding: 1.25rem;
            border: 2px solid #d6ad4b;
        }
        .face-camera-preview {
            background: #1a1a2e;
            border-radius: 0.75rem;
            padding: 1rem;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
        }
        .face-camera-preview .camera-placeholder {
            font-size: 4rem;
            color: #d6ad4b;
            opacity: 0.6;
        }
        .face-camera-preview .camera-status {
            font-size: 0.8rem;
            color: #a0aec0;
            margin-top: 0.5rem;
        }
        .face-camera-preview .quality-panel {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: rgba(0,0,0,0.7);
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.65rem;
            text-align: left;
            min-width: 120px;
        }
        .face-camera-preview .quality-panel .quality-row {
            display: flex;
            justify-content: space-between;
            padding: 0.1rem 0;
            color: #cbd5e1;
        }
        .face-camera-preview .quality-panel .quality-row .good { color: #4ade80; }
        .face-camera-preview .quality-panel .quality-row .waiting { color: #fbbf24; }

        .face-capture-progress {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            margin: 0.75rem 0;
        }
        .face-capture-step {
            text-align: center;
            padding: 0.5rem;
            border-radius: 0.5rem;
            border: 2px solid #e2e8f0;
            font-size: 0.6rem;
            background: white;
            transition: all 0.3s;
        }
        .face-capture-step.done {
            border-color: #4ade80;
            background: #dcfce7;
        }
        .face-capture-step.active {
            border-color: #d6ad4b;
            background: #fef3c7;
            transform: scale(1.05);
        }
        .face-capture-step .step-icon {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 0.2rem;
        }
        .face-capture-step .step-label {
            font-weight: 600;
        }

        .face-progress-bar {
            height: 0.5rem;
            background: #e2e8f0;
            border-radius: 9999px;
            overflow: hidden;
            margin: 0.75rem 0;
        }
        .face-progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #d6ad4b, #2d6545);
            border-radius: 9999px;
            transition: width 0.5s ease;
        }

        .face-quality-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            background: #f1f5f9;
            border-radius: 0.5rem;
        }
        .face-quality-bar .quality-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #475569;
            min-width: 60px;
        }
        .face-quality-bar .quality-track {
            flex: 1;
            height: 0.4rem;
            background: #e2e8f0;
            border-radius: 9999px;
            overflow: hidden;
        }
        .face-quality-bar .quality-track .fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.5s ease;
        }
        .face-quality-bar .quality-value {
            font-size: 0.75rem;
            font-weight: 700;
            min-width: 40px;
            text-align: right;
        }

        /* Security Box */
        .security-box {
            background: #f0f4f8;
            border: 1px solid #d6ad4b;
            border-radius: 0.75rem;
            padding: 1rem;
            margin: 0.75rem 0;
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
        }
        .security-box .security-icon {
            font-size: 1.5rem;
            color: #d6ad4b;
            flex-shrink: 0;
        }
        .security-box .security-text {
            font-size: 0.8rem;
            color: #475569;
        }
        .security-box .security-text strong {
            color: #10233f;
        }

        /* Loading spinner */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .loading-spinner i { font-size: 2rem; color: #a77915; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            background: #10233f;
            color: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 100;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            max-width: 400px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #3f755d; }
        .toast.error { background: #a84134; }
        .toast.info { background: #1e3a5f; }

        .hostel-info-badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            font-size: 0.6rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        .hostel-info-badge.flat { background: #dbeafe; color: #1e40af; }
        .hostel-info-badge.floor-4 { background: #d1fae5; color: #065f46; }
        .hostel-info-badge.floor-6 { background: #fef3c7; color: #92400e; }

        .section-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #eee8de;
        }
        .section-header .section-number {
            display: grid;
            place-items: center;
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: #d6ad4b;
            color: #10233f;
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .section-header h3 {
            font-family: 'Merriweather',serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #17233c;
        }
        .section-header .section-badge {
            font-size: 0.6rem;
            padding: 0.15rem 0.6rem;
            border-radius: 9999px;
            background: #e7edf5;
            color: #24466f;
            font-weight: 600;
            margin-left: auto;
        }
        .section-header .section-badge.done {
            background: #dcfce7;
            color: #065f46;
        }

        .form-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #ded6c9;
        }

        @media (max-width: 640px) {
            .register-container { padding: 1rem; }
            .register-header .logo h1 { font-size: 1.3rem; }
            .bed-grid { grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); }
            .bed-dot { min-height: 40px; font-size: 0.6rem; }
            .section-header h3 { font-size: 1rem; }
            .face-capture-progress { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <div class="register-container" id="registerContainer">

        <!-- Header -->
        <div class="register-header">
            <div class="logo">
                <div class="logo-badge">BIU</div>
                <h1>BedCheck Registration</h1>
            </div>
            <p class="subtitle"><i class="fas fa-user-graduate"></i> Benson Idahosa University · Complete your hostel registration with Face Enrollment</p>
        </div>

        <!-- Registration Content -->
        <div id="registrationContent">
            <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // =============================================
            // STUDENT REGISTRATION - Face Enrollment
            // =============================================

            const API_BASE = 'https://bedcheck-biu.onrender.com/api';

            // ---------- STATE ----------
            let hostels = [];
            let floorsFlats = [];
            let rooms = [];
            let bedSpaces = [];
            let isLoading = true;
            let submitted = false;
            let occupiedBedIds = [];
            let currentStep = 0; // 0-4
            let faceCaptures = [];
            let isCapturing = false;
            let captureProgress = 0;
            let isEnrolling = false;
            
            const totalCaptures = 10;
            const captureInstructions = [
                'Looking Straight',
                'Looking Left',
                'Looking Right',
                'Look Up',
                'Look Down',
                'Blink',
                'Smile',
                'Neutral Face',
                'Slight Turn',
                'Straight'
            ];

            let studentData = {
                surname: '',
                firstName: '',
                middleName: '',
                gender: '',
                dob: '',
                phone: '',
                email: '',
                matric: '',
                faculty: '',
                department: '',
                level: '',
                session: '2025/2026',
                hostel_id: '',
                floor_flat_id: '',
                room_id: '',
                bed_space_id: '',
                hostel_name: '',
                floor_name: '',
                room_code: '',
                bed_code: '',
                status: 'Active',
                notes: '',
                declaration: false,
                face_embedding: null,
                face_template_id: null,
                face_enrolled: false
            };

            const facultyDepartments = {
                'Science': ['Computer Science', 'Microbiology', 'Geography', 'Mathematics', 'Physics', 'Chemistry', 'Biochemistry'],
                'Engineering': ['Electrical/Electronic', 'Mechanical', 'Civil', 'Chemical', 'Computer Engineering'],
                'Law': ['Law', 'International Law', 'Commercial Law'],
                'Allied Health': ['Nursing', 'Medical Lab Science', 'Public Health', 'Physiotherapy'],
                'Medicine': ['Medicine', 'Surgery', 'Pharmacology'],
                'Education': ['Instructional Design', 'Educational Technology', 'Curriculum Studies', 'Education Administration'],
                'Arts': ['English', 'History', 'Philosophy', 'Theatre Arts', 'Mass Communication']
            };

            // ---------- DOM REFS ----------
            const registrationContent = document.getElementById('registrationContent');

            // ---------- TOAST ----------
            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => { toast.classList.remove('show'); }, 4000);
            }

            // ---------- API HELPERS ----------
            async function apiCall(endpoint, options = {}) {
                try {
                    const response = await fetch(`${API_BASE}${endpoint}`, {
                        ...options,
                        headers: {
                            'Content-Type': 'application/json',
                            ...(options.headers || {})
                        }
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                    const data = await response.json();
                    if (!data.success) {
                        throw new Error(data.message || 'API error');
                    }
                    return data;
                } catch (error) {
                    showToast('Error: ' + error.message, 'error');
                    throw error;
                }
            }

            // ---------- DATA LOADING ----------
            async function loadAllData() {
                try {
                    isLoading = true;
                    renderLoading();

                    const savedDraft = localStorage.getItem('studentRegistrationDraft');
                    if (savedDraft) {
                        try {
                            const parsed = JSON.parse(savedDraft);
                            if (Object.values(parsed).some(v => v !== '' && v !== false && v !== null)) {
                                studentData = parsed;
                                if (studentData.face_embedding) {
                                    studentData.face_enrolled = true;
                                }
                                showToast('Draft loaded. Continue where you left off.', 'info');
                            }
                        } catch (e) {
                            console.warn('Could not parse draft:', e);
                        }
                    }

                    const [hostelsRes, floorsRes, roomsRes, bedRes] = await Promise.all([
                        apiCall('/hostels'),
                        apiCall('/floors-flats'),
                        apiCall('/rooms'),
                        apiCall('/bed-spaces')
                    ]);

                    hostels = hostelsRes.data || [];
                    floorsFlats = floorsRes.data || [];
                    rooms = roomsRes.data || [];
                    bedSpaces = bedRes.data || [];

                    isLoading = false;
                    renderRegistrationForm();

                } catch (error) {
                    console.error('Load error:', error);
                    isLoading = false;
                    showToast('Error loading data: ' + error.message, 'error');
                    renderError();
                }
            }

            // ---------- RENDER FUNCTIONS ----------
            function renderLoading() {
                registrationContent.innerHTML = `
                    <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
                    <p class="text-center text-muted">Loading registration form...</p>
                `;
            }

            function renderError() {
                registrationContent.innerHTML = `
                    <div class="card mt-4" style="border-color:#a84134;background:#f9e2de;">
                        <div class="text-center p-4">
                            <i class="fas fa-exclamation-triangle" style="font-size:3rem;color:#a84134;"></i>
                            <h2 class="mt-3">Error Loading Data</h2>
                            <p class="text-muted">There was an error loading the registration form. Please refresh the page.</p>
                            <button class="btn-primary mt-3" onclick="location.reload()"><i class="fas fa-refresh"></i> Refresh</button>
                        </div>
                    </div>
                `;
            }

            function getStepStatus(step) {
                if (step < currentStep) return 'done';
                if (step === currentStep) return 'active';
                return '';
            }

            function renderRegistrationForm() {

            // ---------- STEP NAVIGATION ----------

                if (captureBtn) captureBtn.disabled = true;
                document.getElementById('captureStatus').textContent = 'Capturing...';

                // Simulate capture with progress
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 5;
                    document.getElementById('faceProgressFill').style.width = `${(faceCaptures.length / totalCaptures) * 100 + progress / 10}%`;
                    if (progress >= 100) {
                        clearInterval(interval);
                        // Simulate successful capture
                        faceCaptures.push({ index: faceCaptures.length, timestamp: Date.now() });
                        const stepEl = document.getElementById(`step_${faceCaptures.length - 1}`);
                        if (stepEl) {
                            stepEl.className = 'face-capture-step done';
                            stepEl.querySelector('.step-icon').textContent = '✅';

                        document.getElementById('captureCount').textContent = `${faceCaptures.length} / ${totalCaptures} captures`;

                        const quality = Math.min(96 + faceCaptures.length * 0.5, 99);

                        document.getElementById('qualityValue').textContent = `${Math.round(quality)}%`;
                        document.getElementById('overallQuality').textContent = `${Math.round(quality)}%`;

                        isCapturing = false;
                        if (captureBtn) captureBtn.disabled = false;
                        
                        if (faceCaptures.length >= totalCaptures) {

                                captureBtn.textContent = '✅ Complete';
                                captureBtn.disabled = true;

                            const stepBadges = document.querySelectorAll('.face-capture-step');

                            const nextStep = document.getElementById(`step_${faceCaptures.length}`);

                                nextStep.className = 'face-capture-step active';
                                nextStep.querySelector('.step-icon').textContent = '📸';

                                captureBtn.textContent = `Capture ${faceCaptures.length + 1}/${totalCaptures}`;

            // ---------- ENROLL FACE (UPDATED) ----------
            async function enrollFace() {
                if (faceCaptures.length < totalCaptures) {
                    showToast(`Please capture all ${totalCaptures} faces first.`, 'error');
                    return;
                }

                if (isEnrolling) return;
                isEnrolling = true;

                // First, check if student exists (we need student_id)
                if (!studentData.matric) {
                    showToast('Please complete academic information first.', 'error');
                    isEnrolling = false;
                    return;
                }

                showToast('Generating face template...', 'info');
                
                // Simulate face recognition processing
                // In production, this would send each capture image to a face recognition API
                // and get back embedding vectors for each capture
                
                try {
                    // Simulate processing delay
                    let progress = 0;
                    const statusEl = document.getElementById('captureStatus');
                    const progressFill = document.getElementById('faceProgressFill');
                    
                    // Generate simulated embeddings
                    const embeddings = faceCaptures.map((cap, index) => {
                        // In production, this would be a real embedding from a face recognition model
                        // For demo, generate a random 512-dim vector
                        return Array.from({ length: 512 }, () => (Math.random() - 0.5) * 2);
                    });
                    
                    const qualityScores = faceCaptures.map(() => 95 + Math.random() * 4);
                    const livenessScores = faceCaptures.map(() => 97 + Math.random() * 3);
                    const captureLabels = captureInstructions.slice(0, faceCaptures.length);

                    // We'll create a temporary student record first if it doesn't exist
                    // For demo, we'll use the student data we have
                    
                    // For the API call, we need a student_id. 
                    // Since we haven't created the student yet, we'll use 0 for now
                    // and the server will handle it, OR we create the student first.
                    
                    // Check if student already exists by matric
                    let existingStudent = null;
                    try {
                        const searchRes = await apiCall(`/students?search=${encodeURIComponent(studentData.matric)}`);
                        if (searchRes.data && searchRes.data.length > 0) {
                            existingStudent = searchRes.data[0];
                        }
                    } catch (e) {
                        // Student doesn't exist yet
                    }

                    let studentId = existingStudent?.id || 0;

                    // If student doesn't exist, we need to create them first
                    if (!existingStudent) {
                        showToast('Creating student record...', 'info');
                        const hostel = hostels.find(h => h.id == parseInt(studentData.hostel_id));
                        const floor = floorsFlats.find(f => f.id == parseInt(studentData.floor_flat_id));
                        const room = rooms.find(r => r.id == parseInt(studentData.room_id));
                        const bed = bedSpaces.find(b => b.id == parseInt(studentData.bed_space_id));

                        const newStudent = {
                            name: `${studentData.surname} ${studentData.firstName} ${studentData.middleName}`.trim(),
                            matric: studentData.matric,
                            gender: studentData.gender,
                            phone: studentData.phone,
                            email: studentData.email || null,
                            faculty: studentData.faculty,
                            department: studentData.department,
                            level: studentData.level,
                            session: studentData.session,
                            hostel_id: parseInt(studentData.hostel_id) || null,
                            hostel_name: hostel?.name || null,
                            floor_flat_id: parseInt(studentData.floor_flat_id) || null,
                            floor_name: floor?.name || null,
                            room_id: parseInt(studentData.room_id) || null,
                            room_code: room?.room_code || studentData.room_code || null,
                            bed_space_id: parseInt(studentData.bed_space_id) || null,
                            bed_code: bed?.bed_code || studentData.bed_code || null,
                            status: 'Active',
                            notes: studentData.notes || null
                        };

                        try {
                            const createResult = await apiCall('/students', {
                                method: 'POST',
                                body: JSON.stringify(newStudent)
                            });
                            studentId = createResult.data.id;
                            
                            // Update bed space status
                            if (studentData.bed_space_id) {
                                await apiCall(`/bed-spaces/${studentData.bed_space_id}`, {
                                    method: 'PATCH',
                                    body: JSON.stringify({ 
                                        status: 'occupied',
                                        student_id: studentId
                                    })
                                });
                            }
                            showToast('Student record created successfully!', 'success');
                        } catch (createError) {
                            showToast('Error creating student: ' + createError.message, 'error');
                            isEnrolling = false;
                            return;
                        }
                    }

                    // Now enroll the face
                    showToast('Enrolling face...', 'info');
                    
                    const enrollResponse = await fetch(`${API_BASE}/face-templates/enroll`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            student_id: studentId,
                            embeddings: embeddings,
                            capture_labels: captureLabels,
                            quality_scores: qualityScores,
                            liveness_scores: livenessScores,
                            device_info: navigator.userAgent || 'web',
                            ip_address: 'client-side'
                        })
                    });

                    const enrollResult = await enrollResponse.json();

                    if (enrollResult.success) {
                        studentData.face_enrolled = true;
                        studentData.face_embedding = embeddings[0]; // Store the first embedding
                        studentData.face_template_id = enrollResult.data.template_id;
                        
                        // Update progress
                        if (progressFill) progressFill.style.width = '100%';
                        if (statusEl) statusEl.textContent = '✅ Face enrolled successfully!';
                        
                        showToast('✅ Face successfully enrolled!', 'success');
                        
                        // Save to draft
                        saveDraft(true);
                        
                        // Re-render with updated state
                        setTimeout(() => {
                            renderRegistrationForm();
                        }, 500);
                    } else {
                        showToast('Face enrollment failed: ' + enrollResult.message, 'error');
                    }
                } catch (error) {
                    console.error('Enrollment error:', error);
                    showToast('Error during face enrollment: ' + error.message, 'error');
                } finally {
                    isEnrolling = false;
                }
            }

            // ---------- FORM INTERACTIONS ----------
            function updateField(field, value) {
                studentData[field] = value;
                clearTimeout(window._draftTimeout);
                window._draftTimeout = setTimeout(() => {
                    saveDraft(true);
                }, 2000);
            }

            function updateFacultyDepartments() {
                const faculty = document.getElementById('faculty')?.value;
                studentData.faculty = faculty;
                studentData.department = '';

                const deptSelect = document.getElementById('department');
                deptSelect.innerHTML = '<option value="">Select Department</option>';
                if (faculty && facultyDepartments[faculty]) {
                    facultyDepartments[faculty].forEach(dept => {
                        const opt = document.createElement('option');
                        opt.value = dept;
                        opt.textContent = dept;
                        deptSelect.appendChild(opt);
                    });
                }
            }

            // ---------- HOSTEL DEPENDENT DROPDOWNS ----------
            function populateHostelDropdowns() {
                const hostelId = document.getElementById('hostelSelect')?.value;
                if (!hostelId) return;

                const hostelFloors = floorsFlats.filter(f => f.hostel_id == parseInt(hostelId));
                const floorSelect = document.getElementById('floorSelect');
                floorSelect.innerHTML = '<option value="">Select Floor/Flat</option>';

                hostelFloors.sort((a, b) => {
                    const aNum = parseInt(a.name.replace(/[^0-9]/g, '')) || 0;
                    const bNum = parseInt(b.name.replace(/[^0-9]/g, '')) || 0;
                    return aNum - bNum;
                });

                hostelFloors.forEach(floor => {
                    const opt = document.createElement('option');
                    opt.value = floor.id;
                    const roomCount = rooms.filter(r => r.floor_flat_id === floor.id).length;
                    opt.textContent = `${floor.name} (${roomCount} rooms)`;
                    if (studentData.floor_flat_id == floor.id) opt.selected = true;
                    floorSelect.appendChild(opt);
                });

                if (studentData.floor_flat_id) {
                    setTimeout(updateRoomDependencies, 50);
                }
            }

            function updateHostelDependencies() {
                const hostelId = document.getElementById('hostelSelect')?.value;
                studentData.hostel_id = hostelId;
                studentData.floor_flat_id = '';
                studentData.room_id = '';
                studentData.bed_space_id = '';
                studentData.room_code = '';
                studentData.bed_code = '';

                const floorSelect = document.getElementById('floorSelect');
                floorSelect.innerHTML = '<option value="">Select Floor/Flat</option>';
                const roomSelect = document.getElementById('roomSelect');
                roomSelect.innerHTML = '<option value="">Select Room</option>';
                const bedSelect = document.getElementById('bedSelect');
                bedSelect.innerHTML = '<option value="">Select Bed</option>';
                document.getElementById('bedVisualContainer').style.display = 'none';

                if (hostelId) {
                    populateHostelDropdowns();
                }
            }

            function updateRoomDependencies() {
                const floorId = document.getElementById('floorSelect')?.value;
                studentData.floor_flat_id = floorId;
                if (!floorId) return;

                const floorRooms = rooms.filter(r => r.floor_flat_id == parseInt(floorId));
                const roomSelect = document.getElementById('roomSelect');
                roomSelect.innerHTML = '<option value="">Select Room</option>';

                floorRooms.sort((a, b) => {
                    const aNum = parseInt(a.room_code.replace(/[^0-9]/g, '')) || 0;
                    const bNum = parseInt(b.room_code.replace(/[^0-9]/g, '')) || 0;
                    return aNum - bNum;
                });

                floorRooms.forEach(room => {
                    const opt = document.createElement('option');
                    opt.value = room.id;
                    const bedCount = bedSpaces.filter(b => b.room_id === room.id).length;
                    opt.textContent = `${room.room_code} (${bedCount} beds)`;
                    if (studentData.room_id == room.id) opt.selected = true;
                    roomSelect.appendChild(opt);
                });

                document.getElementById('bedSelect').innerHTML = '<option value="">Select Bed</option>';
                document.getElementById('bedVisualContainer').style.display = 'none';
                studentData.bed_space_id = '';
                studentData.bed_code = '';

                if (studentData.room_id) {
                    updateBedDependencies();
                }
            }

            async function updateBedDependencies() {
                const roomId = document.getElementById('roomSelect')?.value;
                studentData.room_id = roomId;
                if (!roomId) return;

                const selectedRoom = rooms.find(r => r.id == parseInt(roomId));
                if (selectedRoom) studentData.room_code = selectedRoom.room_code;

                const roomBeds = bedSpaces.filter(b => b.room_id == parseInt(roomId));
                const bedSelect = document.getElementById('bedSelect');
                bedSelect.innerHTML = '<option value="">Select Bed</option>';

                if (roomBeds.length === 0) {
                    document.getElementById('bedVisualContainer').style.display = 'none';
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = 'No bed spaces available';
                    opt.disabled = true;
                    bedSelect.appendChild(opt);
                    return;
                }

                occupiedBedIds = [];
                try {
                    const studentsRes = await apiCall(`/students?room_id=${roomId}`);
                    if (studentsRes.data && studentsRes.data.length > 0) {
                        occupiedBedIds = studentsRes.data.map(s => s.bed_space_id).filter(id => id !== null);
                    }
                } catch (e) {
                    console.warn('Could not fetch occupied beds:', e);
                }

                roomBeds.sort((a, b) => {
                    const aNum = parseInt(a.bed_code.replace(/[^0-9]/g, '')) || 0;
                    const bNum = parseInt(b.bed_code.replace(/[^0-9]/g, '')) || 0;
                    return aNum - bNum;
                });

                const availableBeds = roomBeds.filter(b => !occupiedBedIds.includes(b.id));
                const occupiedCount = roomBeds.filter(b => occupiedBedIds.includes(b.id)).length;

                roomBeds.forEach(bed => {
                    const opt = document.createElement('option');
                    opt.value = bed.id;
                    const isOccupied = occupiedBedIds.includes(bed.id);
                    if (isOccupied) {
                        opt.textContent = `${bed.bed_code} (Occupied)`;
                        opt.disabled = true;
                    } else {
                        opt.textContent = `${bed.bed_code} (Available)`;
                    }
                    if (studentData.bed_space_id == bed.id && !isOccupied) opt.selected = true;
                    bedSelect.appendChild(opt);
                });

                renderBedVisual(roomBeds, occupiedBedIds);
                document.getElementById('bedCountInfo').textContent = 
                    `${availableBeds.length} available · ${occupiedCount} occupied · ${roomBeds.length} total`;
            }

            function renderBedVisual(beds, occupiedBeds) {
                const container = document.getElementById('bedVisualContainer');
                const visual = document.getElementById('bedVisual');
                if (beds.length === 0) { container.style.display = 'none'; return; }
                container.style.display = 'block';
                visual.innerHTML = '';

                beds.sort((a, b) => {
                    const aNum = parseInt(a.bed_code.replace(/[^0-9]/g, '')) || 0;
                    const bNum = parseInt(b.bed_code.replace(/[^0-9]/g, '')) || 0;
                    return aNum - bNum;
                });

                beds.forEach(bed => {
                    const dot = document.createElement('div');
                    dot.className = 'bed-dot';
                    const isOccupied = occupiedBeds.includes(bed.id);
                    if (isOccupied) {
                        dot.classList.add('occupied');
                        dot.innerHTML = `<span class="bed-label">${bed.bed_code}</span><span class="bed-status">⛔ Occupied</span>`;
                    } else {
                        dot.classList.add('available');
                        dot.innerHTML = `<span class="bed-label">${bed.bed_code}</span><span class="bed-status">✓ Available</span>`;
                        dot.onclick = function() {
                            document.getElementById('bedSelect').value = bed.id;
                            document.querySelectorAll('.bed-dot').forEach(d => d.classList.remove('selected'));
                            this.classList.add('selected');
                            studentData.bed_space_id = bed.id;
                            studentData.bed_code = bed.bed_code;
                            showToast(`Selected ${bed.bed_code}`, 'success');
                        };
                        if (studentData.bed_space_id == bed.id) dot.classList.add('selected');
                    }
                    visual.appendChild(dot);
                });
            }

            function onBedSelect() {
                const bedSelect = document.getElementById('bedSelect');
                const selectedId = bedSelect.value;
                if (selectedId) {
                    const bed = bedSpaces.find(b => b.id == parseInt(selectedId));
                    if (bed) {
                        studentData.bed_space_id = bed.id;
                        studentData.bed_code = bed.bed_code;
                        document.querySelectorAll('.bed-dot').forEach(d => d.classList.remove('selected'));
                        const dots = document.querySelectorAll('.bed-dot');
                        dots.forEach(d => {
                            if (d.textContent.includes(bed.bed_code)) d.classList.add('selected');
                        });
                    }
                }
            }

            // ---------- SAVE DRAFT ----------
            function saveDraft(silent = false) {
                // Get current form values if visible
                const fields = ['surname', 'firstName', 'middleName', 'gender', 'dob', 'phone', 'email', 'matric', 'faculty', 'department', 'level', 'session', 'notes'];
                fields.forEach(f => {
                    const el = document.getElementById(f);
                    if (el) studentData[f] = el.value;
                });
                const hostelSelect = document.getElementById('hostelSelect');
                if (hostelSelect) studentData.hostel_id = hostelSelect.value;
                const floorSelect = document.getElementById('floorSelect');
                if (floorSelect) studentData.floor_flat_id = floorSelect.value;
                const roomSelect = document.getElementById('roomSelect');
                if (roomSelect) studentData.room_id = roomSelect.value;
                const bedSelect = document.getElementById('bedSelect');
                if (bedSelect) studentData.bed_space_id = bedSelect.value;
                studentData.face_enrolled = faceCaptures.length >= totalCaptures;

                localStorage.setItem('studentRegistrationDraft', JSON.stringify(studentData));
                if (!silent) showToast('Draft saved successfully!', 'success');
            }

            // ---------- RESET FORM ----------
            function resetForm() {
                if (confirm('Are you sure you want to reset all fields?')) {
                    studentData = {
                        surname: '', firstName: '', middleName: '', gender: '', dob: '', phone: '', email: '',
                        matric: '', faculty: '', department: '', level: '', session: '2025/2026',
                        hostel_id: '', floor_flat_id: '', room_id: '', bed_space_id: '',
                        hostel_name: '', floor_name: '', room_code: '', bed_code: '',
                        status: 'Active', notes: '',
                        declaration: false,
                        face_embedding: null,
                        face_template_id: null,
                        face_enrolled: false
                    };
                    faceCaptures = [];
                    currentStep = 0;
                    localStorage.removeItem('studentRegistrationDraft');
                    renderRegistrationForm();
                    showToast('Form reset successfully', 'success');
                }
            }

            // ---------- SUBMIT REGISTRATION ----------
            async function submitRegistration() {
                if (!studentData.face_enrolled) {
                    showToast('Please complete face enrollment first', 'error');
                    return;
                }
                if (!studentData.declaration) {
                    showToast('Please agree to the declaration', 'error');
                    document.getElementById('declaration')?.focus();
                    return;
                }

                // Check if matric already exists
                try {
                    const existing = await apiCall(`/students?search=${studentData.matric}`);
                    if (existing.data && existing.data.length > 0) {
                        showToast('Matric number already exists!', 'error');
                        return;
                    }
                } catch (e) {}

                const hostel = hostels.find(h => h.id == parseInt(studentData.hostel_id));
                const floor = floorsFlats.find(f => f.id == parseInt(studentData.floor_flat_id));
                const room = rooms.find(r => r.id == parseInt(studentData.room_id));
                const bed = bedSpaces.find(b => b.id == parseInt(studentData.bed_space_id));

                const newStudent = {
                    name: `${studentData.surname} ${studentData.firstName} ${studentData.middleName}`.trim(),
                    matric: studentData.matric,
                    gender: studentData.gender,
                    phone: studentData.phone,
                    email: studentData.email || null,
                    faculty: studentData.faculty,
                    department: studentData.department,
                    level: studentData.level,
                    session: studentData.session,
                    hostel_id: parseInt(studentData.hostel_id) || null,
                    hostel_name: hostel?.name || null,
                    floor_flat_id: parseInt(studentData.floor_flat_id) || null,
                    floor_name: floor?.name || null,
                    room_id: parseInt(studentData.room_id) || null,
                    room_code: room?.room_code || studentData.room_code || null,
                    bed_space_id: parseInt(studentData.bed_space_id) || null,
                    bed_code: bed?.bed_code || studentData.bed_code || null,
                    status: 'Active',
                    notes: studentData.notes || null,
                    face_embedding: studentData.face_embedding || null,
                    face_template_id: studentData.face_template_id || null,
                    face_enrolled: true,
                    enrollment_date: new Date().toISOString()
                };

                try {
                    const result = await apiCall('/students', {
                        method: 'POST',
                        body: JSON.stringify(newStudent)
                    });

                    if (studentData.bed_space_id) {
                        await apiCall(`/bed-spaces/${studentData.bed_space_id}`, {
                            method: 'PATCH',
                            body: JSON.stringify({ 
                                status: 'occupied',
                                student_id: result.data.id
                            })
                        });
                    }

                    submitted = true;
                    localStorage.removeItem('studentRegistrationDraft');
                    renderSuccessScreen(result.data);
                    showToast('Registration submitted successfully! Face enrolled.', 'success');

                } catch (error) {
                    showToast('Error submitting registration: ' + error.message, 'error');
                }
            }

            // ---------- SUCCESS SCREEN ----------
            function renderSuccessScreen(data) {
                const refNumber = data?.id ? `BC-2026-${String(data.id).padStart(6, '0')}` : 'BC-2026-000245';
                const studentName = data?.name || `${studentData.surname} ${studentData.firstName}`.trim();
                const hostelName = data?.hostel_name || hostels.find(h => h.id == parseInt(studentData.hostel_id))?.name || '—';
                const roomCode = data?.room_code || studentData.room_code || '—';
                const bedCode = data?.bed_code || studentData.bed_code || '—';

                registrationContent.innerHTML = `
                    <div class="card mt-4" style="border-color:#2d6545;background:#e1f0e5;">
                        <div class="success-screen">
                            <div class="success-icon"><i class="fas fa-check-circle"></i></div>
                            <h2 class="font-serif text-2xl font-bold" style="color:#14532d;">Registration Successful!</h2>
                            <p class="text-sm text-muted mt-1">Face enrolled for BedCheck verification</p>

                            <div class="student-detail-card mt-4">
                                <div style="font-size:3rem;margin-bottom:0.5rem;">😊</div>
                                <h4 style="font-size:1.1rem;font-weight:700;color:#17233c;">${studentName}</h4>
                                <p style="font-size:0.85rem;color:#68768a;">${data?.matric || studentData.matric}</p>
                                <div style="display:flex;justify-content:center;gap:0.5rem;margin:0.5rem 0;">
                                    <span style="background:#dcfce7;color:#065f46;padding:0.15rem 0.6rem;border-radius:9999px;font-size:0.6rem;font-weight:600;">✅ Face Enrolled</span>
                                    <span style="background:#dbeafe;color:#1e40af;padding:0.15rem 0.6rem;border-radius:9999px;font-size:0.6rem;font-weight:600;">✅ Active</span>
                                </div>
                                <div class="mt-2" style="border-top:1px solid #eee8de;padding-top:0.75rem;">
                                    <div class="detail-row"><span class="detail-label">Hostel</span><span class="detail-value">${hostelName}</span></div>
                                    <div class="detail-row"><span class="detail-label">Room</span><span class="detail-value">${roomCode}</span></div>
                                    <div class="detail-row"><span class="detail-label">Bed</span><span class="detail-value">${bedCode}</span></div>
                                    ${studentData.face_template_id ? `<div class="detail-row"><span class="detail-label">Face Template</span><span class="detail-value" style="font-size:0.7rem;font-family:monospace;color:#d6ad4b;">${studentData.face_template_id}</span></div>` : ''}
                                    <div class="detail-row"><span class="detail-label">Reference</span><span class="detail-value" style="font-size:0.8rem;">${refNumber}</span></div>
                                </div>
                            </div>

                            <div class="flex gap-3 mt-5 justify-center flex-wrap">
                                <button class="btn-success" onclick="window.printSlip()"><i class="fas fa-print"></i> Print Slip</button>
                                <button class="btn-primary" onclick="window.resetRegistration()"><i class="fas fa-plus"></i> Register Another</button>
                            </div>

                            <p class="text-sm text-muted mt-4">
                                <i class="fas fa-info-circle"></i> Your face is now enrolled for automatic BedCheck verification. 
                                You will be recognized by the system during nightly checks.
                            </p>
                        </div>
                    </div>
                `;
            }

            function printSlip() {
                window.print();
            }

            function resetRegistration() {
                studentData = {
                    surname: '', firstName: '', middleName: '', gender: '', dob: '', phone: '', email: '',
                    matric: '', faculty: '', department: '', level: '', session: '2025/2026',
                    hostel_id: '', floor_flat_id: '', room_id: '', bed_space_id: '',
                    hostel_name: '', floor_name: '', room_code: '', bed_code: '',
                    status: 'Active', notes: '',
                    declaration: false,
                    face_embedding: null,
                    face_template_id: null,
                    face_enrolled: false
                };
                faceCaptures = [];
                currentStep = 0;
                submitted = false;
                localStorage.removeItem('studentRegistrationDraft');
                renderRegistrationForm();
            }

            // ---------- INIT ----------
            function init() {
                loadAllData();
            }

            // expose to window
            window.showToast = showToast;
            window.updateField = updateField;
            window.updateFacultyDepartments = updateFacultyDepartments;
            window.updateHostelDependencies = updateHostelDependencies;
            window.updateRoomDependencies = updateRoomDependencies;
            window.updateBedDependencies = updateBedDependencies;
            window.onBedSelect = onBedSelect;
            window.saveDraft = saveDraft;
            window.submitRegistration = submitRegistration;
            window.populateHostelDropdowns = populateHostelDropdowns;
            window.resetRegistration = resetRegistration;
            window.resetForm = resetForm;
            window.goToStep = goToStep;
            window.captureFace = captureFace;
            window.resetFaceCaptures = resetFaceCaptures;
            window.enrollFace = enrollFace;
            window.printSlip = printSlip;

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
