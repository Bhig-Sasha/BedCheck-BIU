<body>

    <script>
        (function() {
            'use strict';

            // =============================================
            // CONFIGURATION
            // =============================================
            const API_BASE_URL = 'https://bedcheck-biu.onrender.com/api';

            // =============================================
            // TOAST
            // =============================================
            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => toast.classList.remove('show'), 4000);
            }

            // =============================================
            // STATE
            // =============================================
            let currentUser = null;
            let currentRole = 'RA';
            let isEditing = false;
            let userData = {};
            let assignedHostelName = '';
            let assignedHostelId = null;
            let assignedRooms = [];
            let campus = 'Legacy';

            // =============================================
            // AUTHENTICATED API HELPER
            // =============================================
            async function apiCall(endpoint, options = {}) {
                const token = sessionStorage.getItem('bedcheck_token');
                
                if (!token) {
                    showToast('No authentication token found. Please login again.', 'error');
                    setTimeout(() => {
                        window.location.replace('../Login.html');
                    }, 1500);
                    throw new Error('No authentication token');
                }

                try {
                    const headers = {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        ...(options.headers || {})
                    };
                    
                    const response = await fetch(`${API_BASE_URL}${endpoint}`, { ...options, headers });
                    
                    if (response.status === 401) {
                        showToast('Session expired. Please login again.', 'error');
                        sessionStorage.removeItem('bedcheck_token');
                        sessionStorage.removeItem('bedcheck_user');
                        sessionStorage.removeItem('bedcheck_role');
                        setTimeout(() => {
                            window.location.replace('../Login.html');
                        }, 1500);
                        throw new Error('Authentication required');
                    }
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                    const data = await response.json();
                    if (!data.success) throw new Error(data.message || 'API error');
                    return data;
                } catch (error) {
                    if (!error.message.includes('Authentication required') && !error.message.includes('No authentication token')) {
                        showToast('Error: ' + error.message, 'error');
                    }
                    throw error;
                }
            }

            // =============================================
            // HELPERS
            // =============================================
            function getInitials(name) {
                if (!name) return 'U';
                return name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
            }

            // =============================================
            // LOAD USER PROFILE
            // =============================================
            async function loadUserProfile() {
                try {
                    const userId = currentUser?.id || sessionStorage.getItem('user_id');

                    if (!userId) {
                        showToast('User ID not found', 'error');
                        return;
                    }

                    const data = await apiCall(`/staff/${userId}`);
                    if (data.data) {
                        userData = data.data;
                        const sessionUser = JSON.parse(sessionStorage.getItem('bedcheck_user') || '{}');
                        
                        // Update session user with fresh data
                        sessionUser.name = userData.name || sessionUser.name;
                        sessionUser.initials = userData.initials || getInitials(userData.name || sessionUser.name);
                        sessionUser.role = userData.role || sessionUser.role || 'RA';
                        sessionUser.email = userData.email || sessionUser.email;
                        sessionUser.phone = userData.phone || sessionUser.phone;
                        sessionUser.department = userData.department || sessionUser.department;
                        sessionUser.staff_id = userData.staff_id || userData.id || sessionUser.id;
                        
                        // Get hostel name from nested data or direct
                        assignedHostelName = userData.hostel_name || userData.hostel || sessionUser.hostel || 'Not assigned';
                        assignedHostelId = userData.hostel_id || sessionUser.hostel_id || null;
                        campus = userData.campus || sessionUser.campus || 'Legacy';
                        
                        sessionUser.hostel = assignedHostelName;
                        sessionUser.hostel_id = assignedHostelId;
                        sessionUser.campus = campus;
                        sessionUser.joined = userData.joined || userData.created_at ? new Date(userData.created_at).toLocaleDateString() : 'Not set';
                        sessionUser.lastLogin = userData.last_login ? new Date(userData.last_login).toLocaleString() : new Date().toLocaleString();
                        sessionUser.scope = userData.scope || 'Assigned hostel · BedCheck';
                        
                        // If we have a hostel_id but no name, try to fetch it from hostels list
                        if (assignedHostelId && !assignedHostelName) {
                            try {
                                const hostelsData = await apiCall('/hostels');
                                const hostels = hostelsData.data || [];
                                const found = hostels.find(h => h.id === assignedHostelId);
                                if (found) {
                                    assignedHostelName = found.name;
                                    sessionUser.hostel = found.name;
                                }
                            } catch (e) {
                                console.warn('Could not fetch hostels for name lookup');
                            }
                        }
                        
                        sessionStorage.setItem('bedcheck_user', JSON.stringify(sessionUser));
                        sessionStorage.setItem('bedcheck_role', userData.role || sessionUser.role || 'RA');
                    }
                } catch (error) {
                    showToast('Error loading profile: ' + error.message, 'error');
                    if (currentUser) {
                        userData = {
                            name: currentUser.name || 'User',
                            initials: currentUser.initials || getInitials(currentUser.name),
                            role: currentUser.role || 'RA',
                            scope: currentUser.scope || 'Assigned hostel · BedCheck',
                            email: currentUser.email || 'Not set',
                            phone: currentUser.phone || 'Not set',
                            department: currentUser.department || 'Not set',
                            staff_id: currentUser.staff_id || currentUser.id || 'Not set',
                            joined: currentUser.joined || 'Not set',
                            hostel: currentUser.hostel || assignedHostelName || 'Not assigned',
                            lastLogin: currentUser.lastLogin || new Date().toLocaleString(),
                            campus: currentUser.campus || 'Legacy'
                        };
                    }
                }
            }

            // =============================================
            // LOAD ASSIGNED ROOMS
            // =============================================
            async function loadAssignedRooms() {
                try {
                    const data = await apiCall('/ra/rooms');
                    assignedRooms = data.data?.rooms || [];
                    return assignedRooms;
                } catch (error) {
                    console.error('Error loading assigned rooms:', error);
                    assignedRooms = [];
                    return assignedRooms;
                }
            }

            // =============================================
            // UPDATE HEADER
            // =============================================
            function updateHeader() {
                if (!currentUser) return;
                const avatar = document.getElementById('profileAvatar');
                const name = document.getElementById('profileName');
                const role = document.getElementById('profileRoleLabel');
                const roleLabel = document.getElementById('roleLabel');
                const roleScope = document.getElementById('roleScope');
                const mobileRole = document.getElementById('mobileRoleFooter');

                const initials = currentUser.initials || getInitials(currentUser.name);
                const displayName = currentUser.name || 'User';

                avatar.textContent = initials;
                name.textContent = displayName;
                role.textContent = 'RA';
                roleLabel.textContent = 'RA';
                
                const hostelDisplay = assignedHostelName || currentUser?.hostel || 'your hostel';
                const roomCount = assignedRooms.length > 0 ? ` · ${assignedRooms.length} rooms` : '';
                roleScope.textContent = `${hostelDisplay}${roomCount}`;
                mobileRole.textContent = `RA · ${hostelDisplay}${roomCount}`;
            }

            // =============================================
            // PROFILE ACTIONS
            // =============================================
            function toggleEdit() {
                isEditing = !isEditing;
                renderProfile();
            }

            async function saveProfile() {
                const name = document.getElementById('editName')?.value;
                const email = document.getElementById('editEmail')?.value;
                const phone = document.getElementById('editPhone')?.value;
                const department = document.getElementById('editDepartment')?.value;

                if (!name || !email) {
                    showToast('Name and email are required', 'error');
                    return;
                }

                try {
                    const userId = currentUser?.id || sessionStorage.getItem('user_id');

                    const payload = {
                        name: name,
                        email: email,
                        phone: phone || userData.phone,
                        department: department || userData.department
                    };

                    await apiCall(`/staff/${userId}`, {
                        method: 'PUT',
                        body: JSON.stringify(payload)
                    });

                    userData.name = name;
                    userData.email = email;
                    userData.phone = phone || userData.phone;
                    userData.department = department || userData.department;
                    userData.initials = name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();

                    const sessionUser = JSON.parse(sessionStorage.getItem('bedcheck_user') || '{}');
                    sessionUser.name = name;
                    sessionUser.initials = userData.initials;
                    sessionUser.email = email;
                    sessionUser.phone = userData.phone;
                    sessionUser.department = userData.department;
                    sessionStorage.setItem('bedcheck_user', JSON.stringify(sessionUser));

                    document.getElementById('profileAvatar').textContent = userData.initials;
                    document.getElementById('profileName').textContent = name;

                    isEditing = false;
                    renderProfile();
                    showToast('Profile updated successfully!', 'success');
                } catch (error) {
                    showToast('Error updating profile: ' + error.message, 'error');
                }
            }

            // =============================================
            // CHANGE PASSWORD
            // =============================================
            function openPasswordModal() {
                document.getElementById('passwordModal').classList.add('active');
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                document.getElementById('currentPassword').focus();
            }

            function closePasswordModal() {
                document.getElementById('passwordModal').classList.remove('active');
            }

            async function changePassword() {
                const currentPassword = document.getElementById('currentPassword')?.value;
                const newPassword = document.getElementById('newPassword')?.value;
                const confirmPassword = document.getElementById('confirmPassword')?.value;

                if (!currentPassword) {
                    showToast('Please enter your current password', 'error');
                    return;
                }

                if (!newPassword || newPassword.length < 6) {
                    showToast('New password must be at least 6 characters', 'error');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showToast('Passwords do not match', 'error');
                    return;
                }

                try {
                    const userId = currentUser?.id || sessionStorage.getItem('user_id');
                    
                    await apiCall(`/staff/${userId}/change-password`, {
                        method: 'PUT',
                        body: JSON.stringify({ currentPassword, newPassword })
                    });

                    closePasswordModal();
                    showToast('Password changed successfully!', 'success');
                } catch (error) {
                    showToast('Error changing password: ' + error.message, 'error');
                }
            }

            function uploadPhoto() {
                showToast('Photo upload functionality coming soon', 'info');
            }

            // =============================================
            // RENDER PROFILE
            // =============================================
            function renderProfile() {
                const container = document.getElementById('screenContent');

                const displayName = userData.name || currentUser?.name || 'User';
                const displayInitials = userData.initials || currentUser?.initials || getInitials(displayName);
                const displayRole = userData.role || currentUser?.role || 'RA';
                const displayScope = userData.scope || currentUser?.scope || 'Assigned hostel · BedCheck';
                const displayEmail = userData.email || currentUser?.email || 'Not set';
                const displayPhone = userData.phone || currentUser?.phone || 'Not set';
                const displayDepartment = userData.department || currentUser?.department || 'Not set';
                const displayStaffId = userData.staff_id || currentUser?.staff_id || currentUser?.id || 'Not set';
                const displayHostel = userData.hostel || currentUser?.hostel || assignedHostelName || 'Not assigned';
                const displayLastLogin = userData.lastLogin || currentUser?.lastLogin || new Date().toLocaleString();
                const displayCampus = userData.campus || currentUser?.campus || 'Legacy';
                const roomCount = assignedRooms.length;

                container.innerHTML = `
                    <div class="page-heading">
                        <div>
                            <p class="eyebrow"><i class="fas fa-user"></i> Account</p>
                            <h1>Profile</h1>
                            <p class="desc">
                                <span class="assigned-hostel-badge">
                                    <i class="fas fa-building"></i> ${displayHostel}
                                </span>
                                <span class="assigned-hostel-badge" style="margin-left:0.5rem;background:#d6ad4b20;">
                                    <i class="fas fa-map-marker-alt"></i> ${displayCampus}
                                </span>
                                <span class="text-muted" style="margin-left:0.5rem;">${displayRole}</span>
                                ${roomCount > 0 ? `<span class="assigned-hostel-badge" style="margin-left:0.5rem;background:#d6ad4b20;">
                                    <i class="fas fa-door-open"></i> ${roomCount} rooms
                                </span>` : ''}
                            </p>
                        </div>
                        <div class="action-group">
                            ${!isEditing ? `
                                <button class="btn-outline" onclick="toggleEdit()"><i class="fas fa-edit"></i> Edit Profile</button>
                            ` : `
                                <button class="btn-outline" onclick="toggleEdit()"><i class="fas fa-times"></i> Cancel</button>
                                <button class="btn-success" onclick="saveProfile()"><i class="fas fa-save"></i> Save Changes</button>
                            `}
                        </div>
                    </div>

                    <div class="card" style="max-width:48rem;">
                        <!-- Profile Header -->
                        <div style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;">
                            <div class="profile-photo-wrapper">
                                <div class="avatar-xl" id="profileAvatarDisplay">${displayInitials}</div>
                                <button class="camera-btn" onclick="uploadPhoto()">
                                    <i class="fas fa-camera"></i>
                                </button>
                            </div>
                            <div style="flex:1;min-width:200px;">
                                ${isEditing ? `
                                    <div class="field">
                                        <label>Full Name</label>
                                        <input id="editName" value="${displayName}" />
                                    </div>
                                ` : `
                                    <h2 class="font-serif font-bold" style="font-size:1.4rem;color:#17233c;">${displayName}</h2>
                                    <p class="text-sm text-muted">${displayRole}</p>
                                    <p class="text-xs text-muted"><i class="fas fa-map-marker-alt"></i> ${displayCampus} Campus</p>
                                `}
                                <div style="display:flex;gap:0.75rem;margin-top:0.5rem;flex-wrap:wrap;">
                                    <span class="badge badge-active" style="display:inline-flex;align-items:center;gap:0.3rem;">
                                        <span class="status-dot green"></span> Active
                                    </span>
                                    <span style="font-size:0.7rem;color:#68768a;">
                                        <i class="fas fa-id-badge"></i> ${displayStaffId}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Profile Details -->
                        <div class="grid-2 mt-4" style="border-top:1px solid #eee8de;padding-top:1rem;">
                            <div>
                                <p class="text-xs font-bold uppercase text-muted">Role</p>
                                <p class="font-bold mt-1" style="color:#17233c;">${displayRole}</p>
                            </div>
                            <div>
                                <p class="text-xs font-bold uppercase text-muted">Scope</p>
                                <p class="font-bold mt-1" style="color:#17233c;">${displayScope}</p>
                            </div>
                            ${isEditing ? `
                                <div class="field">
                                    <label>Email Address</label>
                                    <input id="editEmail" value="${displayEmail}" />
                                </div>
                                <div class="field">
                                    <label>Phone Number</label>
                                    <input id="editPhone" value="${displayPhone}" />
                                </div>
                                <div class="field" style="grid-column:1/-1;">
                                    <label>Department</label>
                                    <input id="editDepartment" value="${displayDepartment}" />
                                </div>
                            ` : `
                                <div>
                                    <p class="text-xs font-bold uppercase text-muted">Email</p>
                                    <p class="font-bold mt-1" style="color:#17233c;">${displayEmail}</p>
                                </div>
                                <div>
                                    <p class="text-xs font-bold uppercase text-muted">Phone</p>
                                    <p class="font-bold mt-1" style="color:#17233c;">${displayPhone}</p>
                                </div>
                                <div>
                                    <p class="text-xs font-bold uppercase text-muted">Department</p>
                                    <p class="font-bold mt-1" style="color:#17233c;">${displayDepartment}</p>
                                </div>
                                <div>
                                    <p class="text-xs font-bold uppercase text-muted">Assigned Hostel</p>
                                    <p class="font-bold mt-1" style="color:#17233c;">${displayHostel}</p>
                                </div>
                            `}
                            <div>
                                <p class="text-xs font-bold uppercase text-muted">Campus</p>
                                <p class="font-bold mt-1" style="color:#17233c;">${displayCampus}</p>
                            </div>
                            <div>
                                <p class="text-xs font-bold uppercase text-muted">Assigned Rooms</p>
                                <p class="font-bold mt-1" style="color:#17233c;">${roomCount}</p>
                            </div>
                            <div>
                                <p class="text-xs font-bold uppercase text-muted">Last Login</p>
                                <p class="font-bold mt-1" style="color:#17233c;">${displayLastLogin}</p>
                            </div>
                        </div>

                        <!-- Assigned Rooms List -->
                        ${assignedRooms.length > 0 ? `
                            <div class="mt-4 pt-4 border-t">
                                <p class="text-xs font-bold uppercase text-muted">Assigned Rooms</p>
                                <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.5rem;">
                                    ${assignedRooms.map(room => `
                                        <span class="badge badge-assigned" style="font-size:0.75rem;padding:0.3rem 0.8rem;">
                                            ${room.room_code}
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}

                        <!-- Security Actions -->
                        <div class="mt-4 pt-4 border-t" style="display:flex;gap:0.75rem;flex-wrap:wrap;">
                            <button class="btn-outline" onclick="openPasswordModal()"><i class="fas fa-key"></i> Change Password</button>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="profile-footer">
                        BedCheck System · Benson Idahosa University · ${displayCampus} Campus
                    </div>
                `;

                document.getElementById('profileAvatarDisplay').textContent = displayInitials;
            }

            // =============================================
            // AUTHENTICATION
            // =============================================
            function checkAuth() {
                const userData = sessionStorage.getItem('bedcheck_user');
                const token = sessionStorage.getItem('bedcheck_token');
                
                if (!userData || !token) {
                    window.location.replace('../Login.html');
                    return false;
                }
                
                currentUser = JSON.parse(userData);
                currentRole = sessionStorage.getItem('bedcheck_role') || 'RA';
                assignedHostelName = currentUser?.hostel || currentUser?.hostel_name || '';
                assignedHostelId = currentUser?.hostel_id || null;
                campus = currentUser?.campus || 'Legacy';

                return true;
            }

            function handleLogout(e) {
                e.preventDefault();
                sessionStorage.removeItem('bedcheck_token');
                sessionStorage.removeItem('bedcheck_user');
                sessionStorage.removeItem('bedcheck_role');
                sessionStorage.removeItem('user_id');
                window.location.replace('../Login.html');
            }

            // =============================================
            // SET DATE
            // =============================================
            function setDate() {
                const now = new Date();
                document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }

            // =============================================
            // MOBILE DRAWER
            // =============================================
            function openMobileDrawer() {
                document.getElementById('mobileDrawer').classList.add('open');
                document.getElementById('drawerOverlay').classList.add('show');
            }

            function closeMobileDrawer() {
                document.getElementById('mobileDrawer').classList.remove('open');
                document.getElementById('drawerOverlay').classList.remove('show');
            }

            // =============================================
            // EXPOSE GLOBALLY
            // =============================================
            window.showToast = showToast;
            window.toggleEdit = toggleEdit;
            window.saveProfile = saveProfile;
            window.openPasswordModal = openPasswordModal;
            window.closePasswordModal = closePasswordModal;
            window.changePassword = changePassword;
            window.uploadPhoto = uploadPhoto;

            // =============================================
            // INIT
            // =============================================
            async function init() {
                if (!checkAuth()) return;

                setDate();

                document.getElementById('menuToggle').addEventListener('click', openMobileDrawer);
                document.getElementById('closeDrawer').addEventListener('click', closeMobileDrawer);
                document.getElementById('drawerOverlay').addEventListener('click', closeMobileDrawer);
                document.getElementById('logoutBtn').addEventListener('click', handleLogout);

                try {
                    // Load assigned rooms first
                    await loadAssignedRooms();
                    
                    // Load user profile (this will fetch hostel info)
                    await loadUserProfile();
                    
                    // Update header with room info
                    updateHeader();
                    
                    renderProfile();
                        
                } catch (error) {
                    console.error('Init error:', error);
                    if (!error.message.includes('Authentication required') && !error.message.includes('No authentication token')) {
                        showToast('Error loading profile: ' + error.message, 'error');
                    }
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
