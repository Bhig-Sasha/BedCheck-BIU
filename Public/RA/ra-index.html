<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BedCheck · RA Dashboard</title>
    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://bedcheck-biu.onrender.com" />
    
    <!-- Load fonts with font-display swap -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&display=swap" rel="stylesheet" />
    
    <!-- Load Font Awesome with defer and SRI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" 
          integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Critical CSS inline, rest loaded async -->
    <style>
        /* CRITICAL CSS - Only what's needed for above-the-fold */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; background-color: #f5f1e8; color: #17233c; min-height: 100vh; }
        .app-wrapper { display: flex; min-height: 100vh; }
        
        /* Minimal loading state */
        .loading-spinner { display: flex; justify-content: center; align-items: center; padding: 2rem; }
        .loading-spinner i { font-size: 2rem; color: #a77915; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .content-container { max-width: 1280px; margin: 0 auto; padding: 1rem; }
        @media (min-width: 640px) { .content-container { padding: 1.75rem; } }
        
        /* Rest of CSS loaded after page render */
    </style>
    
    <!-- Non-critical CSS loaded with media="print" then swapped -->
    <link rel="stylesheet" href="data:text/css;base64,REVBREV..."
          media="print" onload="this.media='all'" />
</head>
<body>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast"></div>

    <!-- ===== APP ===== -->
    <div class="app-wrapper" id="app">
        <!-- Minimal sidebar shell -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-logo" id="sidebarLogo">S</div>
                <div>
                    <div class="brand-text">BedCheck</div>
                    <div class="brand-sub">Management System</div>
                </div>
            </div>
            <p class="workspace-label">Workspace</p>
            <nav id="desktopNav">
                <a href="ra-index.html" class="nav-item active"><i class="fas fa-home"></i> Dashboard</a>
                <a href="BedCheck.html" class="nav-item"><i class="fas fa-clipboard-check"></i> BedCheck</a>
                <a href="student.html" class="nav-item"><i class="fas fa-users"></i> Students</a>
                <a href="Profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>
            </nav>
            <div class="role-card">
                <div class="role-title"><i class="fas fa-user-tag"></i> <span id="roleLabel">RA</span></div>
                <div class="role-scope" id="roleScope">Loading...</div>
            </div>
        </aside>

        <!-- Mobile drawer -->
        <div class="drawer-overlay" id="drawerOverlay"></div>
        <aside class="mobile-drawer" id="mobileDrawer">
            <button class="close-btn" id="closeDrawer"><i class="fas fa-times"></i></button>
            <div class="brand">
                <div class="brand-logo" id="mobileLogo">S</div>
                <div>
                    <div class="brand-text">BedCheck</div>
                    <div class="brand-sub">Management System</div>
                </div>
            </div>
            <nav id="mobileNav">
                <a href="ra-index.html" class="nav-item active"><i class="fas fa-home"></i> Dashboard</a>
                <a href="BedCheck.html" class="nav-item"><i class="fas fa-clipboard-check"></i> BedCheck</a>
                <a href="student.html" class="nav-item"><i class="fas fa-users"></i> Students</a>
                <a href="Profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>
            </nav>
            <div class="drawer-footer" id="mobileRoleFooter">Loading...</div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="header-inner">
                    <div class="header-left">
                        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                        <div>
                            <p class="header-date" id="currentDate">Loading...</p>
                            <p class="header-title">BedCheck</p>
                        </div>
                    </div>
                    <div class="header-right">
                        <a href="#" class="profile-btn" id="profileBtn">
                            <span class="profile-avatar" id="profileAvatar">U</span>
                            <span class="profile-name" id="profileName">User</span>
                            <span class="profile-role" id="profileRoleLabel">RA</span>
                        </a>
                        <button class="logout-btn" id="logoutBtn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
            </header>
            <div class="content-container">
                <div id="screenContent">
                    <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== OPTIMIZED SCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // =============================================
            // OPTIMIZED: Cached API calls with 1s timeout
            // =============================================
            const API_BASE_URL = 'https://bedcheck-biu.onrender.com/api';
            const ITEMS_PER_PAGE = 10;
            const CACHE_TTL = 30000; // 30 second cache

            // Simple in-memory cache
            const cache = new Map();

            function getCached(key) {
                const item = cache.get(key);
                if (item && Date.now() - item.timestamp < CACHE_TTL) {
                    return item.data;
                }
                return null;
            }

            function setCached(key, data) {
                cache.set(key, { data, timestamp: Date.now() });
            }

            // =============================================
            // TOAST
            // =============================================
            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                if (!toast) return;
                toast.textContent = message;
                toast.className = `toast ${type}`;
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => toast.classList.remove('show'), 4000);
            }

            // =============================================
            // STATE
            // =============================================
            let currentUser = null;
            let allStudents = [];
            let filteredStudents = [];
            let assignedRooms = [];
            let hostels = [];
            let staffMembers = [];
            let floorsFlats = [];
            let currentPage = 1;
            let assignedHostelId = null;
            let assignedHostelName = '';
            let assignedFloor = '';
            let assignedFloorName = '';
            let assignedArea = '';
            let currentSession = null;
            let effectiveStatus = 'closed';
            let isSessionActive = false;
            let isRASessionActive = false;
            let globalSessionActive = false;
            let hasCompletedToday = false;
            let bedScanStatus = {};
            let sessionCheckerInterval = null;
            let isInitialized = false;
            let renderTimeout = null;

            // =============================================
            // API HELPER with AbortController for timeout
            // =============================================
            async function apiCall(endpoint, options = {}) {
                const token = sessionStorage.getItem('bedcheck_token');
                if (!token) {
                    showToast('No authentication token found. Please login again.', 'error');
                    setTimeout(() => window.location.replace('../Login.html'), 1500);
                    throw new Error('No authentication token');
                }

                const cacheKey = `${endpoint}-${JSON.stringify(options.body || {})}`;
                const cached = getCached(cacheKey);
                if (cached && options.method !== 'POST') {
                    return cached;
                }

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                try {
                    const headers = {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        ...(options.headers || {})
                    };

                    const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                        ...options,
                        headers,
                        credentials: 'include',
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    if (response.status === 401) {
                        showToast('Session expired. Please login again.', 'error');
                        sessionStorage.removeItem('bedcheck_token');
                        sessionStorage.removeItem('bedcheck_user');
                        sessionStorage.removeItem('bedcheck_role');
                        setTimeout(() => window.location.replace('../Login.html'), 1500);
                        throw new Error('Authentication required');
                    }

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }

                    const data = await response.json();
                    if (!data.success) throw new Error(data.message || 'API error');

                    if (options.method !== 'POST') {
                        setCached(cacheKey, data);
                    }

                    return data;
                } catch (error) {
                    clearTimeout(timeoutId);
                    if (error.name === 'AbortError') {
                        throw new Error('Request timeout');
                    }
                    throw error;
                }
            }

            // =============================================
            // HELPERS - Optimized
            // =============================================
            function getInitials(name) {
                if (!name) return 'U';
                return name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
            }

            function formatTime(date) {
                if (!date) return 'Just now';
                const d = new Date(date);
                return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            }

            // =============================================
            // DATA LOADING - Parallelized
            // =============================================
            async function loadAllData() {
                const token = sessionStorage.getItem('bedcheck_token');
                if (!token) {
                    window.location.replace('../Login.html');
                    return;
                }

                // Parse user from session
                const userData = sessionStorage.getItem('bedcheck_user');
                if (userData) {
                    try {
                        currentUser = JSON.parse(userData);
                        assignedHostelId = currentUser.hostel_id || currentUser.hostelId || null;
                        assignedHostelName = currentUser.hostel || currentUser.hostel_name || '';
                        assignedFloor = currentUser.assigned_floor || currentUser.assigned_flat || '';
                        assignedFloorName = currentUser.assigned_floor_name || '';
                        assignedArea = assignedFloorName || assignedFloor || '';
                    } catch (e) {}
                }

                // Load all data in parallel with Promise.all
                const [hostelsData, roomsData, staffData, studentData, sessionData] = await Promise.all([
                    apiCall('/hostels').catch(() => ({ data: [] })),
                    apiCall('/ra/rooms').catch(() => ({ data: { rooms: [] } })),
                    apiCall('/staff?limit=100').catch(() => ({ data: [] })),
                    apiCall(`/students?limit=100${assignedHostelId ? `&hostel_id=${assignedHostelId}` : ''}`).catch(() => ({ data: [] })),
                    apiCall('/sessions/active').catch(() => ({ data: null, is_active: false }))
                ]);

                hostels = hostelsData.data || [];
                assignedRooms = roomsData.data?.rooms || [];
                staffMembers = staffData.data || [];
                allStudents = studentData.data || [];
                
                // Filter students by assigned rooms
                if (assignedRooms.length > 0) {
                    const assignedRoomIds = assignedRooms.map(r => r.id);
                    filteredStudents = allStudents.filter(s => 
                        s.room_id && assignedRoomIds.includes(s.room_id)
                    );
                } else {
                    filteredStudents = allStudents;
                }

                // Process session
                if (sessionData && sessionData.is_active) {
                    currentSession = sessionData.data;
                    globalSessionActive = true;
                    
                    try {
                        const statusData = await apiCall('/ra/bedcheck/status');
                        if (statusData && statusData.data) {
                            const data = statusData.data;
                            isRASessionActive = data.ra_session_active || false;
                            isSessionActive = data.has_active_session || false;
                            hasCompletedToday = data.has_completed_today || false;
                            effectiveStatus = data.effective_status || 'ready';
                            globalSessionActive = data.global_session_active || false;
                            if (data.active_session) currentSession = data.active_session;
                        }
                    } catch (e) {}
                }

                // Load floors
                if (assignedHostelId) {
                    try {
                        const floorsData = await apiCall(`/floors-flats?hostel_id=${assignedHostelId}`);
                        floorsFlats = floorsData.data || [];
                    } catch (e) {}
                }

                // Update header
                updateHeader();

                // Render
                renderDashboard();
                
                // Start session checker
                if (sessionCheckerInterval) clearInterval(sessionCheckerInterval);
                sessionCheckerInterval = setInterval(async () => {
                    try {
                        const oldStatus = effectiveStatus;
                        const statusData = await apiCall('/ra/bedcheck/status').catch(() => null);
                        if (statusData && statusData.data) {
                            effectiveStatus = statusData.data.effective_status || 'closed';
                            if (oldStatus !== effectiveStatus) renderDashboard();
                        }
                    } catch (e) {}
                }, 30000);

                isInitialized = true;
            }

            // =============================================
            // UPDATE HEADER
            // =============================================
            function updateHeader() {
                if (!currentUser) return;
                const avatar = document.getElementById('profileAvatar');
                const name = document.getElementById('profileName');
                const role = document.getElementById('profileRoleLabel');
                const roleLabel = document.getElementById('roleLabel');
                const roleScope = document.getElementById('roleScope');
                const mobileRole = document.getElementById('mobileRoleFooter');

                const initials = currentUser.initials || getInitials(currentUser.name);
                const displayName = currentUser.name || 'User';

                if (avatar) avatar.textContent = initials;
                if (name) name.textContent = displayName;
                if (role) role.textContent = 'RA';
                if (roleLabel) roleLabel.textContent = 'RA';

                const hostelDisplay = assignedHostelName || 'No Hostel';
                const areaDisplay = assignedArea || 'No Floor';
                const roomCount = assignedRooms.length;
                let statusEmoji = '⏳';
                if (isRASessionActive) statusEmoji = '🟢';
                else if (hasCompletedToday) statusEmoji = '✅';
                else if (globalSessionActive) statusEmoji = '🟡';
                
                if (roleScope) roleScope.textContent = `${hostelDisplay} · ${areaDisplay} · ${roomCount} rooms ${statusEmoji}`;
                if (mobileRole) mobileRole.textContent = `RA · ${hostelDisplay} · ${areaDisplay} · ${roomCount} rooms ${statusEmoji}`;
            }

            // =============================================
            // RENDER DASHBOARD - Optimized
            // =============================================
            function renderDashboard() {
                // Debounce rendering
                if (renderTimeout) cancelAnimationFrame(renderTimeout);
                renderTimeout = requestAnimationFrame(() => {
                    renderDashboardSync();
                    renderTimeout = null;
                });
            }

            function renderDashboardSync() {
                const container = document.getElementById('screenContent');
                if (!container) return;

                const displayHostel = assignedHostelName || 'No Hostel';
                const displayArea = assignedArea || 'No Floor';
                const totalStudents = filteredStudents.length;
                
                const verified = filteredStudents.filter(s => bedScanStatus[s.id]?.verified || s.status === 'Verified' || s.status === 'Present').length || 0;
                const absent = filteredStudents.filter(s => bedScanStatus[s.id]?.status === 'Absent' || s.status === 'Absent').length || 0;
                const pending = totalStudents - verified - absent;
                const completionRate = totalStudents > 0 ? Math.round(((verified + absent) / totalStudents) * 100) : 0;

                const hostelInfo = hostels.find(h => h.id === assignedHostelId);
                let hraName = 'Not Assigned';
                if (assignedHostelId) {
                    const hraStaff = staffMembers.find(s => s.hostel_id === assignedHostelId && s.role === 'HRA' && s.status === 'Active');
                    if (hraStaff) hraName = hraStaff.name;
                }

                let sessionDisplay = {
                    statusText: 'No session available',
                    badgeClass: 'closed',
                    badgeText: 'Closed',
                    showStartButton: false,
                    showCompleteButton: false,
                    showCompletedBadge: false
                };

                if (effectiveStatus === 'started') {
                    sessionDisplay.statusText = 'BedCheck In Progress';
                    sessionDisplay.badgeClass = 'active';
                    sessionDisplay.badgeText = 'Active';
                    sessionDisplay.showCompleteButton = true;
                } else if (effectiveStatus === 'ready') {
                    sessionDisplay.statusText = 'Night Session Ready';
                    sessionDisplay.badgeClass = 'ready';
                    sessionDisplay.badgeText = 'Ready';
                    sessionDisplay.showStartButton = true;
                } else if (effectiveStatus === 'completed' || hasCompletedToday) {
                    sessionDisplay.statusText = 'BedCheck Completed';
                    sessionDisplay.badgeClass = 'completed';
                    sessionDisplay.badgeText = 'Done';
                    sessionDisplay.showCompletedBadge = true;
                } else if (globalSessionActive) {
                    sessionDisplay.statusText = 'Night Session Active';
                    sessionDisplay.badgeClass = 'ready';
                    sessionDisplay.badgeText = 'Ready';
                    sessionDisplay.showStartButton = true;
                }

                const sessionName = currentSession?.name || 'Night BedCheck';
                let sessionDate = '—';
                let sessionStart = '—';
                let sessionEnd = '—';
                let sessionGrace = '15';
                
                if (currentSession) {
                    if (currentSession.date) {
                        const d = new Date(currentSession.date);
                        if (!isNaN(d.getTime())) sessionDate = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                    }
                    if (currentSession.start_time) {
                        const d = new Date(currentSession.start_time);
                        if (!isNaN(d.getTime())) sessionStart = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                    }
                    if (currentSession.end_time) {
                        const d = new Date(currentSession.end_time);
                        if (!isNaN(d.getTime())) sessionEnd = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                    }
                    if (currentSession.grace_period) sessionGrace = currentSession.grace_period;
                }

                // Build HTML with minimal DOM operations
                container.innerHTML = `
                    <div class="page-heading">
                        <div>
                            <p class="eyebrow"><i class="fas fa-clipboard-list"></i> RA Dashboard</p>
                            <h1>${displayHostel}</h1>
                            <p class="desc">
                                <span class="assigned-hostel-badge"><i class="fas fa-building"></i> ${displayHostel}</span>
                                <span class="assigned-hostel-badge" style="margin-left:0.5rem;background:#d6ad4b20;"><i class="fas fa-layer-group"></i> ${displayArea}</span>
                                <span class="text-muted" style="margin-left:0.5rem;">${totalStudents} students</span>
                                <span class="assigned-hostel-badge" style="margin-left:0.5rem;background:#d6ad4b20;"><i class="fas fa-door-open"></i> ${assignedRooms.length} rooms</span>
                            </p>
                        </div>
                        <div class="action-group">
                            ${sessionDisplay.showStartButton && assignedRooms.length > 0 ? `<button class="btn-success" id="startBedCheckBtn"><i class="fas fa-play"></i> Start BedCheck</button>` : ''}
                            ${sessionDisplay.showCompleteButton ? `<button class="btn-danger" id="completeBedCheckBtn"><i class="fas fa-check-double"></i> Complete</button>` : ''}
                            ${sessionDisplay.showCompletedBadge ? `<button class="btn-outline" disabled><i class="fas fa-check-circle"></i> Completed ✓</button>` : ''}
                            ${assignedRooms.length === 0 && effectiveStatus !== 'completed' ? `<button class="btn-outline" disabled><i class="fas fa-exclamation-triangle"></i> No rooms assigned</button>` : ''}
                        </div>
                    </div>

                    <div class="session-banner">
                        <div class="session-icon">🌙</div>
                        <div class="session-info">
                            <div class="session-title">${sessionName}</div>
                            <div class="session-sub">${sessionDisplay.statusText}</div>
                            ${(globalSessionActive || effectiveStatus !== 'closed') ? `
                                <div class="session-sub" style="font-size:0.75rem;margin-top:0.3rem;color:#8899aa;">
                                    ${sessionDate} · ${sessionStart} ${sessionEnd !== '—' ? `— ${sessionEnd}` : ''}
                                    <span style="margin-left:0.75rem;"><i class="fas fa-clock"></i> Grace: ${sessionGrace}min</span>
                                </div>
                            ` : ''}
                        </div>
                        <div><span class="session-status-badge ${sessionDisplay.badgeClass}">${sessionDisplay.badgeText}</span></div>
                    </div>

                    <div class="metric-grid">
                        <div class="metric-card">
                            <div class="metric-icon navy"><i class="fas fa-users"></i></div>
                            <div class="metric-value">${totalStudents}</div>
                            <div class="metric-title">Total Students</div>
                            <div class="metric-detail">In ${displayArea}</div>
                        </div>
                        <div class="metric-card" style="border-left:3px solid #2d6545;">
                            <div class="metric-icon green"><i class="fas fa-check-circle"></i></div>
                            <div class="metric-value" style="color:#2d6545;">${verified}</div>
                            <div class="metric-title">Verified</div>
                            <div class="metric-detail">Students present</div>
                        </div>
                        <div class="metric-card" style="border-left:3px solid #8a3328;">
                            <div class="metric-icon red"><i class="fas fa-user-slash"></i></div>
                            <div class="metric-value" style="color:#8a3328;">${absent}</div>
                            <div class="metric-title">Absent</div>
                            <div class="metric-detail">Students absent</div>
                        </div>
                        <div class="metric-card" style="border-left:3px solid #b9c7db;">
                            <div class="metric-icon gray"><i class="fas fa-hourglass-half"></i></div>
                            <div class="metric-value" style="color:#536274;">${pending}</div>
                            <div class="metric-title">Pending</div>
                            <div class="metric-detail">Awaiting verification</div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title"><span class="icon"><i class="fas fa-building"></i></span> Hostel Details</div>
                        <div>
                            ${[
                                ['Hostel', hostelInfo?.name || displayHostel],
                                ['Type', hostelInfo?.type || '—'],
                                ['Assigned Area', displayArea],
                                ['Assigned Rooms', assignedRooms.length],
                                ['RA', currentUser?.name || 'Not Assigned'],
                                ['HRA', hraName]
                            ].map(([label, value]) => `
                                <div class="flex-between" style="padding:0.4rem 0;border-bottom:1px solid #f0ebe2;">
                                    <span class="text-muted">${label}</span>
                                    <span class="font-bold">${value}</span>
                                </div>
                            `).join('')}
                            <div class="mt-3 pt-3 border-t">
                                <div class="progress-bar"><div class="fill" style="width:${completionRate}%;"></div></div>
                                <div class="flex-between mt-1">
                                    <span class="text-xs text-muted">${completionRate}% completion</span>
                                    <span class="text-xs text-gold">${verified + absent} / ${totalStudents} processed</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card mt-4">
                        <div class="flex-between">
                            <div class="card-title"><span class="icon"><i class="fas fa-users"></i></span> Assigned Students</div>
                            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">
                                <div class="field" style="min-width:120px;">
                                    <select id="statusFilter" onchange="filterStudents()">
                                        <option value="all">All Status</option>
                                        <option value="Verified">Verified</option>
                                        <option value="Absent">Absent</option>
                                        <option value="Pending">Pending</option>
                                    </select>
                                </div>
                                <button class="btn-ghost" onclick="resetFilters()" style="font-size:0.8rem;">
                                    <i class="fas fa-undo"></i> Reset
                                </button>
                            </div>
                        </div>
                        <div class="table-wrap mt-2">
                            <table>
                                <thead><tr>
                                    <th>Student</th>
                                    <th>Matric</th>
                                    <th>Room</th>
                                    <th>Status</th>
                                    <th>Last Updated</th>
                                </tr></thead>
                                <tbody id="studentTableBody"></tbody>
                            </table>
                        </div>
                        <div class="pagination">
                            <div class="info" id="paginationInfo">Showing 1-10 of 0 students</div>
                            <div class="pages" id="paginationControls"></div>
                        </div>
                    </div>

                    <div class="night-session-footer">
                        BedCheck System · Benson Idahosa University
                    </div>
                `;

                // Render student table
                renderStudentTable();

                // Attach event listeners
                document.getElementById('startBedCheckBtn')?.addEventListener('click', startBedCheck);
                document.getElementById('completeBedCheckBtn')?.addEventListener('click', completeBedCheck);
            }

            // =============================================
            // RENDER STUDENT TABLE - Optimized
            // =============================================
            function renderStudentTable() {
                const tbody = document.getElementById('studentTableBody');
                if (!tbody) return;

                const statusFilter = document.getElementById('statusFilter')?.value || 'all';
                let displayStudents = filteredStudents;

                if (statusFilter === 'Pending') {
                    displayStudents = filteredStudents.filter(s => !bedScanStatus[s.id]?.verified && s.status !== 'Absent' && !s.status);
                } else if (statusFilter === 'Verified') {
                    displayStudents = filteredStudents.filter(s => bedScanStatus[s.id]?.verified || s.status === 'Verified' || s.status === 'Present');
                } else if (statusFilter !== 'all') {
                    displayStudents = filteredStudents.filter(s => bedScanStatus[s.id]?.status === statusFilter || s.status === statusFilter);
                }

                const start = (currentPage - 1) * ITEMS_PER_PAGE;
                const end = start + ITEMS_PER_PAGE;
                const pageStudents = displayStudents.slice(start, end);

                if (pageStudents.length === 0) {
                    tbody.innerHTML =
                        `<tr><td colspan="5" class="text-center text-muted" style="padding:2rem;">
                            ${filteredStudents.length === 0 ? 'No students assigned.' : 'No students match the filter.'}
                        </td></tr>`;
                    updatePagination(displayStudents.length);
                    return;
                }

                // Build rows as string for faster DOM
                let rows = '';
                for (const s of pageStudents) {
                    const scan = bedScanStatus[s.id];
                    let status = 'Pending';
                    if (scan?.verified || s.status === 'Verified' || s.status === 'Present') status = 'Verified';
                    else if (scan?.status === 'Absent' || s.status === 'Absent') status = 'Absent';
                    
                    const verifiedTime = scan?.time ? formatTime(scan.time) : (s.updated_at ? formatTime(s.updated_at) : '—');
                    const badgeClass = status === 'Verified' ? 'badge-verified' : status === 'Absent' ? 'badge-absent' : 'badge-pending';

                    rows += `
                        <tr>
                            <td>
                                <div style="display:flex;align-items:center;gap:0.5rem;">
                                    <span class="avatar">${getInitials(s.name)}</span>
                                    <span class="font-bold">${s.name || 'Unknown'}</span>
                                </div>
                            </td>
                            <td>${s.matric || '—'}</td>
                            <td>${s.room_code || s.room || '—'}</td>
                            <td><span class="badge ${badgeClass}">${status}</span></td>
                            <td style="font-size:0.8rem;color:#6b778b;">${verifiedTime}</td>
                        </tr>
                    `;
                }
                tbody.innerHTML = rows;
                updatePagination(displayStudents.length);
            }

            // =============================================
            // UPDATE PAGINATION
            // =============================================
            function updatePagination(total) {
                const totalPages = Math.ceil(total / ITEMS_PER_PAGE);
                const start = (currentPage - 1) * ITEMS_PER_PAGE + 1;
                const end = Math.min(currentPage * ITEMS_PER_PAGE, total);

                const info = document.getElementById('paginationInfo');
                if (info) {
                    info.textContent = `Showing ${total > 0 ? start : 0}-${end} of ${total} students`;
                }

                const controls = document.getElementById('paginationControls');
                if (!controls) return;

                let html = '';
                html += `<button onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;

                for (let i = 1; i <= Math.min(totalPages, 7); i++) {
                    if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                        html += `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                    } else if (i === currentPage - 3 || i === currentPage + 3) {
                        html += `<button disabled>...</button>`;
                    }
                }

                html += `<button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>`;
                controls.innerHTML = html;
            }

            // =============================================
            // FILTERS
            // =============================================
            function filterStudents() {
                currentPage = 1;
                renderStudentTable();
            }

            function resetFilters() {
                const filter = document.getElementById('statusFilter');
                if (filter) filter.value = 'all';
                currentPage = 1;
                renderStudentTable();
            }

            function changePage(page) {
                const total = filteredStudents.length;
                const totalPages = Math.ceil(total / ITEMS_PER_PAGE);
                if (page < 1 || page > totalPages) return;
                currentPage = page;
                renderStudentTable();
            }

            // =============================================
            // BEDCHECK ACTIONS
            // =============================================
            async function startBedCheck() {
                if (isRASessionActive) {
                    showToast('You already have an active session.', 'info');
                    return;
                }
                if (hasCompletedToday) {
                    showToast('You have already completed today\'s BedCheck.', 'info');
                    return;
                }
                if (!globalSessionActive) {
                    showToast('No active session available.', 'error');
                    return;
                }
                if (assignedRooms.length === 0) {
                    showToast('No rooms assigned. Contact your HRA.', 'error');
                    return;
                }

                try {
                    const sessionId = currentSession?.id || currentSession?.session_id;
                    if (!sessionId) {
                        showToast('Could not find session ID.', 'error');
                        return;
                    }

                    const result = await apiCall('/ra/bedcheck/start', {
                        method: 'POST',
                        body: JSON.stringify({ session_id: sessionId })
                    });

                    if (result && result.success) {
                        isSessionActive = true;
                        isRASessionActive = true;
                        effectiveStatus = 'started';
                        currentSession = result.data?.session || { id: sessionId };
                        showToast('✅ BedCheck started!', 'success');
                        renderDashboard();
                    } else {
                        showToast('Failed to start BedCheck.', 'error');
                    }
                } catch (error) {
                    showToast('Failed to start: ' + error.message, 'error');
                }
            }

            async function completeBedCheck() {
                if (!isRASessionActive) {
                    showToast('No active session to complete.', 'error');
                    return;
                }
                if (!confirm('Complete tonight\'s BedCheck? This cannot be undone.')) return;

                try {
                    const sessionId = currentSession?.id || currentSession?.session_id;
                    if (!sessionId || sessionId === 'completed') {
                        showToast('No session found.', 'error');
                        return;
                    }

                    await apiCall('/ra/bedcheck/complete', {
                        method: 'POST',
                        body: JSON.stringify({ session_id: sessionId })
                    });

                    isSessionActive = false;
                    isRASessionActive = false;
                    effectiveStatus = 'completed';
                    hasCompletedToday = true;
                    showToast('✅ BedCheck completed!', 'success');
                    renderDashboard();
                } catch (error) {
                    showToast('Failed to complete: ' + error.message, 'error');
                }
            }

            // =============================================
            // SET DATE
            // =============================================
            function setDate() {
                const now = new Date();
                document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }

            // =============================================
            // MOBILE DRAWER
            // =============================================
            function openMobileDrawer() {
                document.getElementById('mobileDrawer').classList.add('open');
                document.getElementById('drawerOverlay').classList.add('show');
            }

            function closeMobileDrawer() {
                document.getElementById('mobileDrawer').classList.remove('open');
                document.getElementById('drawerOverlay').classList.remove('show');
            }

            // =============================================
            // LOGOUT
            // =============================================
            function handleLogout(e) {
                e.preventDefault();
                sessionStorage.removeItem('bedcheck_token');
                sessionStorage.removeItem('bedcheck_user');
                sessionStorage.removeItem('bedcheck_role');
                window.location.replace('../Login.html');
            }

            // =============================================
            // EXPOSE GLOBALLY
            // =============================================
            window.filterStudents = filterStudents;
            window.resetFilters = resetFilters;
            window.changePage = changePage;
            window.showToast = showToast;

            // =============================================
            // INIT
            // =============================================
            function init() {
                const token = sessionStorage.getItem('bedcheck_token');
                if (!token) {
                    window.location.replace('../Login.html');
                    return;
                }

                setDate();

                // Event listeners
                document.getElementById('menuToggle')?.addEventListener('click', openMobileDrawer);
                document.getElementById('closeDrawer')?.addEventListener('click', closeMobileDrawer);
                document.getElementById('drawerOverlay')?.addEventListener('click', closeMobileDrawer);
                document.getElementById('logoutBtn')?.addEventListener('click', handleLogout);

                // Load data
                loadAllData().catch(error => {
                    console.error('Init error:', error);
                    showToast('Error loading data: ' + error.message, 'error');
                });
            }

            // Start
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
