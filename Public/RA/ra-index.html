<!DOCTYPE html>
<html lang="en">

    <style>

        .mobile-drawer .brand { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
        .mobile-drawer .brand-logo {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 0.5rem;
            background: #d6ad4b;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(225,189,101,0.5);

        .mobile-drawer .brand-logo img {

            height: 100%;

        .mobile-drawer .brand-text { font-family: 'Merriweather',serif; font-weight: 700; font-size: 1.1rem; line-height: 1.2; color: white; }
        .mobile-drawer .brand-sub { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #b9c7db; }
        .mobile-drawer nav { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; }

        .main-content { flex: 1; min-height: 100vh; padding-bottom: 2rem; }
        @media (min-width: 1024px) { .main-content { margin-left: 16rem; } }

        .main-header { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid #dfd8cb; background: rgba(245,241,232,0.95); backdrop-filter: blur(4px); padding: 0.75rem 1rem; }
        @media (min-width: 640px) { .main-header { padding: 0.75rem 1.75rem; } }
        .header-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 0.75rem; }

        .header-title { font-family: 'Merriweather',serif; font-size: 1.2rem; font-weight: 700; }

        .header-right { display: flex; align-items: center; gap: 0.5rem; }
        @media (min-width: 640px) { .header-right { gap: 0.75rem; } }
        .profile-btn { display: flex; align-items: center; gap: 0.5rem; border: 1px solid #d8d0c2; border-radius: 0.5rem; background: #fffcf6; padding: 0.25rem 0.5rem 0.25rem 0.25rem; cursor: pointer; text-decoration: none; }
        .profile-btn:hover { background: #f5f1e8; }
        .profile-avatar { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: #d6ad4b; font-size: 0.6rem; font-weight: 700; color: #10233f; }
        .profile-name { display: none; font-weight: 700; font-size: 0.9rem; color: #17233c; }
        .profile-role { display: none; font-size: 0.6rem; color: #68768a; }
        .logout-btn { background: transparent; border: none; color: #68768a; cursor: pointer; font-size: 1.1rem; padding: 0.5rem; }
        .logout-btn:hover { color: #17233c; }
        @media (min-width: 640px) { .profile-name { display: block; } .profile-role { display: block; } }

        .content-container { max-width: 1280px; margin: 0 auto; padding: 1rem; }
        @media (min-width: 640px) { .content-container { padding: 1.75rem; } }
        @media (max-width: 480px) { .content-container { padding: 0.75rem; } }

        .btn-success { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.2rem; border: none; border-radius: 0.5rem; background: #2d6545; color: white; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: background 0.15s; justify-content: center; }
        .btn-success:hover { background: #1f4a32; }
        .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-danger { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.2rem; border: none; border-radius: 0.5rem; background: #a84134; color: white; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: background 0.15s; justify-content: center; }
        .btn-danger:hover { background: #8a3328; }
        .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-outline { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.2rem; border: 1px solid #bfc8d5; border-radius: 0.5rem; background: transparent; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.15s; text-decoration: none; color: #17233c; justify-content: center; }
        .btn-outline:hover { background: #f5f1e8; border-color: #a77915; }
        .btn-outline:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-ghost { background: transparent; border: none; font-weight: 700; color: #926a13; cursor: pointer; font-size: 0.9rem; }
        .btn-ghost i { margin-right: 0.25rem; }

        .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 9999px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
        .badge-present { background: #e1f0e5; color: #2d6545; }
        .badge-absent { background: #f8e1dc; color: #9b3c31; }
        .badge-pending { background: #e8edf2; color: #536274; }
        .badge-draft { background: #e8edf2; color: #536274; }
        .badge-approved { background: #e1f0e5; color: #2d6545; }
        .badge-assigned { background: #d6ad4b; color: #10233f; }
        .badge-active { background: #d6ad4b; color: #10233f; }
        .badge-inactive { background: #e8edf2; color: #536274; }
        .badge-verified { background: #e1f0e5; color: #2d6545; }

        .card { border: 1px solid #ded6c9; border-radius: 0.75rem; background: #fffcf6; padding: 1.25rem; }
        @media (max-width: 480px) { .card { padding: 0.75rem; } }
        .card-title { font-family: 'Merriweather',serif; font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
        .card-title .icon { color: #a77915; }

        .notice-banner { display: flex; gap: 0.75rem; padding: 0.75rem 1rem; margin-bottom: 1.5rem; border: 1px solid #d8c79e; border-radius: 0.5rem; background: #fff9e9; color: #675121; font-size: 0.9rem; }
        .notice-banner i { margin-top: 0.15rem; font-size: 1rem; }

        .page-heading { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
        @media (min-width: 640px) { .page-heading { flex-direction: row; justify-content: space-between; align-items: flex-end; } }
        .page-heading .eyebrow { font-size: 0.8rem; font-weight: 600; color: #a77915; text-transform: uppercase; letter-spacing: 0.05em; }
        .page-heading h1 { font-family: 'Merriweather',serif; font-size: 1.8rem; font-weight: 700; margin-top: 0.15rem; }
        @media (min-width: 640px) { .page-heading h1 { font-size: 2.25rem; } }
        @media (max-width: 480px) { .page-heading h1 { font-size: 1.4rem; } }
        .page-heading .desc { margin-top: 0.25rem; font-size: 0.9rem; color: #5c6a7d; }
        .page-heading .action-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }

        .assigned-hostel-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0.75rem; background: #e7edf5; border-radius: 0.5rem; font-size: 0.8rem; font-weight: 600; color: #10233f; }

        .mt-1 { margin-top: 0.25rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 0.75rem; }
        .mt-4 { margin-top: 1.25rem; }
        .mt-6 { margin-top: 1.5rem; }
        .text-sm { font-size: 0.85rem; }
        .text-xs { font-size: 0.7rem; }
        .text-muted { color: #68768a; }
        .text-gold { color: #a77915; }
        .font-bold { font-weight: 700; }
        .border-t { border-top: 1px solid #ded6c9; }
        .text-center { text-align: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .flex-wrap { flex-wrap: wrap; }
        .gap-2 { gap: 0.5rem; }
        .ml-4 { margin-left: 1rem; }

        .status-dot { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; }
        .status-dot.green { background: #2d6545; }
        .status-dot.gold { background: #d4af37; }
        .status-dot.red { background: #8a3328; }
        .status-dot.gray { background: #b9c7db; }

        .loading-spinner { display: flex; justify-content: center; align-items: center; padding: 2rem; }
        .loading-spinner i { font-size: 2rem; color: #a77915; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: 0.75rem; background: #10233f; color: white; box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 100; transform: translateY(100px); opacity: 0; transition: all 0.3s ease; max-width: 400px; }
        @media (max-width: 480px) { .toast { bottom: 1rem; right: 1rem; left: 1rem; max-width: none; padding: 0.75rem 1rem; font-size: 0.85rem; } }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #3f755d; }
        .toast.error { background: #a84134; }
        .toast.info { background: #1e3a5f; }

        .metric-grid { display: grid; gap: 0.75rem; grid-template-columns: 1fr 1fr; }
        @media (min-width: 640px) { .metric-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 480px) { .metric-grid { grid-template-columns: 1fr 1fr; gap: 0.5rem; } }
        .metric-card { padding: 0.75rem 1rem; border: 1px solid #ded6c9; border-radius: 0.75rem; background: #fffcf6; }
        @media (max-width: 480px) { .metric-card { padding: 0.5rem 0.75rem; } }
        .metric-icon { display: inline-flex; padding: 0.5rem; border-radius: 0.5rem; font-size: 1rem; }
        .metric-icon.navy { background: #e7edf5; color: #24466f; }
        .metric-icon.gold { background: #fff1c9; color: #8b6513; }
        .metric-icon.red { background: #f9e2de; color: #9c3e32; }
        .metric-icon.gray { background: #eceff2; color: #536274; }
        .metric-icon.green { background: #e1f0e5; color: #2d6545; }
        .metric-value { margin-top: 0.4rem; font-size: 1.5rem; font-weight: 700; }
        @media (max-width: 480px) { .metric-value { font-size: 1.2rem; } }
        .metric-title { margin-top: 0.1rem; font-weight: 700; font-size: 0.85rem; }
        @media (max-width: 480px) { .metric-title { font-size: 0.75rem; } }
        .metric-detail { margin-top: 0.1rem; font-size: 0.7rem; color: #6b778b; }

        .grid-2 { display: grid; gap: 0.75rem; grid-template-columns: 1fr 1fr; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        .table-wrap { overflow-x: auto; border: 1px solid #ded6c9; border-radius: 0.75rem; background: #fffcf6; }
        .table-wrap table { width: 100%; min-width: 500px; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
        @media (max-width: 480px) { .table-wrap table { font-size: 0.75rem; min-width: 400px; } }
        .table-wrap thead { background: #fbf7ef; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; color: #68768a; }
        .table-wrap th { padding: 0.5rem 0.75rem; }
        @media (max-width: 480px) { .table-wrap th { padding: 0.3rem 0.5rem; } }
        .table-wrap td { padding: 0.5rem 0.75rem; border-top: 1px solid #eee8de; }
        @media (max-width: 480px) { .table-wrap td { padding: 0.3rem 0.5rem; } }
        .table-wrap .avatar { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: #e7edf5; font-size: 0.6rem; font-weight: 700; flex-shrink: 0; }
        @media (max-width: 480px) { .table-wrap .avatar { width: 1.6rem; height: 1.6rem; font-size: 0.5rem; } }

        .progress-bar { height: 0.4rem; overflow: hidden; border-radius: 9999px; background: #e6e2da; }
        .progress-bar .fill { height: 100%; background: #d6ad4b; border-radius: 9999px; }

        .pagination { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.75rem; border-top: 1px solid #eee8de; flex-wrap: wrap; gap: 0.5rem; }
        @media (max-width: 480px) { .pagination { flex-direction: column; align-items: center; } }
        .pagination .info { font-size: 0.8rem; color: #6b778b; }
        @media (max-width: 480px) { .pagination .info { font-size: 0.65rem; } }
        .pagination .pages { display: flex; gap: 0.25rem; flex-wrap: wrap; justify-content: center; }
        .pagination .pages button { padding: 0.2rem 0.6rem; border: 1px solid #ded6c9; border-radius: 0.3rem; background: white; font-size: 0.75rem; cursor: pointer; transition: all 0.15s; color: #17233c; }
        .pagination .pages button:hover { border-color: #a77915; }
        .pagination .pages button.active { background: #10233f; color: white; border-color: #10233f; }
        .pagination .pages button:disabled { opacity: 0.4; cursor: not-allowed; }

        .field { display: flex; flex-direction: column; gap: 0.2rem; }
        .field label { font-weight: 700; font-size: 0.75rem; color: #2c3e5a; }
        .field select { padding: 0.4rem 0.6rem; border: 1px solid #cbd2db; border-radius: 0.5rem; background: white; font-size: 0.8rem; outline: none; width: 100%; font-family: inherit; }
        .field select:focus { border-color: #a77915; }

        .session-status-banner { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; background: #f5f1e8; border: 1px solid #ded6c9; }
        .session-status-banner.active { background: #e1f0e5; border-color: #2d6545; color: #1a4a2a; }
        .session-status-banner.draft { background: #f5f1e8; border-color: #d4af37; color: #8a6413; }
        .session-status-banner.completed { background: #e8edf2; border-color: #536274; color: #536274; }

        .error-container { text-align: center; padding: 3rem 1rem; }
        .error-container .error-icon { font-size: 3rem; color: #a84134; margin-bottom: 1rem; }
        .error-container h2 { margin-bottom: 0.5rem; }
        .error-container p { color: #68768a; max-width: 400px; margin: 0 auto 1.5rem; }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 0.5rem;
            background: #10233f;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
            justify-content: center;
        }
        .btn-primary:hover { background: #18345a; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>

                    <i class="fas fa-info-circle"></i>
                    <span id="noticeText">Loading dashboard...</span>
                </div>
                <div id="screenContent">
                    <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        (function() {
            'use strict';

            // =============================================
            // CONFIGURATION
            // =============================================
            const API_BASE_URL = 'https://bedcheck-biu.onrender.com/api';
            const ITEMS_PER_PAGE = 10;

            // =============================================
            // TOAST
            // =============================================
            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => toast.classList.remove('show'), 4000);
            }

            // =============================================
            // STATE
            // =============================================
            let currentUser = null;
            let allStudents = [];
            let filteredStudents = [];
            let assignedRooms = [];
            let hostels = [];
            let staffMembers = [];
            let floorsFlats = [];
            let currentPage = 1;
            let assignedHostelId = null;
            let assignedHostelName = '';
            let assignedFloor = '';
            let assignedFloorName = '';
            let assignedArea = '';
            let currentSession = null;
            let sessionStatus = 'draft';
            let isSessionActive = false;
            let isRASessionActive = false;
            let hasLoadedRooms = false;
            let bedScanStatus = {};
            let timeline = [];

            // =============================================
            // API HELPER
            // =============================================
            async function apiCall(endpoint, options = {}) {
                const token = sessionStorage.getItem('bedcheck_token');
                
                if (!token) {
                    showToast('No authentication token found. Please login again.', 'error');
                    setTimeout(() => {
                        window.location.replace('../Login.html');
                    }, 1500);
                    throw new Error('No authentication token');
                }

                try {
                    const headers = {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        ...(options.headers || {})
                    };

                    const response = await fetch(`${API_BASE_URL}${endpoint}`, { 
                        ...options, 
                        headers,
                        credentials: 'include'
                    });
                    
                    if (response.status === 401) {
                        showToast('Session expired. Please login again.', 'error');
                        sessionStorage.removeItem('bedcheck_token');
                        sessionStorage.removeItem('bedcheck_user');
                        sessionStorage.removeItem('bedcheck_role');
                        setTimeout(() => {
                            window.location.replace('../Login.html');
                        }, 1500);
                        throw new Error('Authentication required');
                    }
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                    const data = await response.json();
                    if (!data.success) throw new Error(data.message || 'API error');
                    return data;
                } catch (error) {
                    if (!error.message.includes('Authentication required') && !error.message.includes('No authentication token')) {
                        showToast('Error: ' + error.message, 'error');
                    }
                    throw error;
                }
            }

            // =============================================
            // HELPERS
            // =============================================
            function getInitials(name) {
                if (!name) return 'U';
                return name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
            }

            function formatTime(date) {
                if (!date) return 'Just now';
                const d = new Date(date);
                return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            }

            function attBadge(status) {
                if (!status || status === 'Pending' || status === '' || status === 'Present') {
                    return `<span class="badge badge-pending">Pending</span>`;
                }
                const map = {
                    'Verified': 'badge-verified',
                    'Present': 'badge-present',
                    'Absent': 'badge-absent'
                };
                return `<span class="badge ${map[status] || 'badge-pending'}">${status || 'Pending'}</span>`;
            }

            function addTimeline(event, details = '') {
                timeline.unshift({ time: new Date().toISOString(), event: event, details: details });
                if (timeline.length > 50) timeline.pop();
            }

            // =============================================
            // DATA LOADING
            // =============================================
            async function loadStudents() {
                const limit = Math.min(ITEMS_PER_PAGE * 10, 100);
                let endpoint = `/students?limit=${limit}`;
                
                if (assignedHostelId) {
                    endpoint += `&hostel_id=${assignedHostelId}`;
                }
                
                const data = await apiCall(endpoint);
                allStudents = data.data || [];
                
                if (assignedRooms.length > 0) {
                    const assignedRoomIds = assignedRooms.map(r => r.id);
                    filteredStudents = allStudents.filter(s => 
                        s.room_id && assignedRoomIds.includes(s.room_id)
                    );
                } else {
                    filteredStudents = allStudents;
                }
                
                return filteredStudents;
            }

            async function loadHostels() {
                const data = await apiCall('/hostels');
                hostels = data.data || [];
                return hostels;
            }

            async function loadStaff() {
                const data = await apiCall('/staff?limit=100');
                staffMembers = data.data || [];
                return staffMembers;
            }

            async function loadFloorsFlats() {
                try {
                    const data = await apiCall(`/floors-flats?hostel_id=${assignedHostelId || ''}`);
                    floorsFlats = data.data || [];
                    return floorsFlats;
                } catch (error) {
                    console.error('Error loading floors/flats:', error);
                    floorsFlats = [];
                    return floorsFlats;
                }
            }

            async function loadAssignedRooms() {
                try {
                    const data = await apiCall('/ra/rooms');
                    assignedRooms = data.data?.rooms || [];
                    hasLoadedRooms = true;
                    return assignedRooms;
                } catch (error) {
                    console.error('Error loading assigned rooms:', error);
                    assignedRooms = [];
                    hasLoadedRooms = true;
                    return assignedRooms;
                }
            }

            // =============================================
            // LOAD SESSION STATUS - FIXED
            // =============================================
            async function loadSessionStatus() {
                try {
                    // Check global active session - REMOVE the hostel_id parameter
                    try {
                        const globalSession = await apiCall('/sessions/active');
                        if (globalSession && globalSession.data && globalSession.data.id) {
                            isSessionActive = true;
                            sessionStatus = 'active';
                            currentSession = globalSession.data;
                            addTimeline('Global session active', 'BedCheck is live');
                            console.log('📋 Global session active:', globalSession.data.id);
                        }
                    } catch (e) {
                        // No global active session
                        console.log('No global active session:', e.message);
                    }

                    // Check RA session status
                    try {
                        const statusData = await apiCall('/ra/bedcheck/status');
                        
                        if (statusData && statusData.data) {
                            const sessions = statusData.data.sessions || [];
                            const active = sessions.find(s => s.status === 'started');
                            
                            if (active) {
                                isRASessionActive = true;
                                if (!isSessionActive) {
                                    sessionStatus = 'active';
                                    isSessionActive = true;
                                }
                                currentSession = active;
                                addTimeline('RA session active', 'BedCheck session is live');
                                console.log('📋 RA session active:', active.id);
                            } else {
                                const today = new Date().toISOString().split('T')[0];
                                const completed = sessions.find(s => 
                                    s.status === 'completed' && 
                                    s.completed_at && 
                                    s.completed_at.startsWith(today)
                                );
                                
                                if (completed) {
                                    if (!isSessionActive) {
                                        sessionStatus = 'completed';
                                        isSessionActive = false;
                                    }
                                    currentSession = completed;
                                    addTimeline('Session completed', 'Today\'s BedCheck is finalized');
                                    console.log('📋 Session completed:', completed.id);
                                } else if (!isSessionActive) {
                                    // No active or completed session
                                    sessionStatus = 'draft';
                                    isSessionActive = false;
                                    currentSession = null;
                                    console.log('📋 Session: draft');
                                }
                            }
                            
                            // Update bedScanStatus from the status data
                            if (sessions.length > 0) {
                                const latestSession = sessions[0];
                                if (latestSession && latestSession.id) {
                                    try {
                                        const scansData = await apiCall(`/bedcheck/scans?session_id=${latestSession.id}`);
                                        if (scansData && scansData.data) {
                                            scansData.data.forEach(scan => {
                                                if (scan.status === 'Verified' || scan.status === 'Present') {
                                                    bedScanStatus[scan.student_id] = {
                                                        verified: true,
                                                        status: 'Verified',
                                                        time: scan.created_at,
                                                        confidence: scan.metadata?.confidence || null
                                                    };
                                                } else if (scan.status === 'Absent') {
                                                    bedScanStatus[scan.student_id] = {
                                                        verified: false,
                                                        status: 'Absent',
                                                        time: scan.created_at
                                                    };
                                                }
                                            });
                                        }
                                    } catch (scanError) {
                                        console.warn('Could not fetch scans:', scanError);
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        console.warn('RA session status unavailable:', e.message);
                    }
                    
                    console.log(`📋 Final session status: ${sessionStatus}`);
                    console.log(`📋 Session active: ${isSessionActive}`);
                    console.log(`📋 RA session active: ${isRASessionActive}`);
                    
                    return { sessionStatus, isSessionActive, isRASessionActive };
                    
                } catch (error) {
                    console.warn('Session status error:', error.message);
                    if (!isSessionActive) {
                        sessionStatus = 'draft';
                        isSessionActive = false;
                    }
                    return { sessionStatus, isSessionActive, isRASessionActive };
                }
            }

            // =============================================
            // LOAD USER PROFILE
            // =============================================
            async function loadUserProfile() {
                if (!currentUser || !currentUser.id) {
                    throw new Error('User not authenticated');
                }
                
                try {
                    console.log('Loading user profile for ID:', currentUser.id);
                    
                    const data = await apiCall(`/staff/${currentUser.id}`);
                    
                    if (data.data) {
                        const userData = data.data;
                        console.log('User profile loaded:', userData);
                        
                        currentUser = { ...currentUser, ...userData };
                        
                        assignedHostelId = userData.hostel_id || currentUser.hostel_id || null;
                        assignedHostelName = userData.hostel_name || userData.hostel || currentUser.hostel || '';
                        assignedFloor = userData.assigned_floor || userData.assigned_flat || currentUser.assigned_floor || '';
                        assignedFloorName = userData.assigned_floor_name || userData.assigned_flat_name || '';
                        assignedArea = assignedFloorName || assignedFloor || '';
                        
                        if (assignedHostelId && !assignedHostelName) {
                            const hostel = hostels.find(h => h.id === assignedHostelId);
                            if (hostel) {
                                assignedHostelName = hostel.name;
                            }
                        }
                        
                        if (!assignedHostelId && currentUser.hostel_id) {
                            assignedHostelId = currentUser.hostel_id;
                        }
                        if (!assignedHostelName && currentUser.hostel) {
                            assignedHostelName = currentUser.hostel;
                        }
                        
                        if (!assignedHostelId) {
                            console.warn('No hostel assigned to user. Using default.');
                            if (hostels.length > 0) {
                                assignedHostelId = hostels[0].id;
                                assignedHostelName = hostels[0].name;
                                console.log('Using default hostel:', assignedHostelName);
                            }
                        }
                        
                        return userData;
                    }
                    throw new Error('User data not found');
                } catch (error) {
                    console.error('Error loading user profile:', error);
                    
                    if (currentUser) {
                        console.log('Using cached user data from session');
                        assignedHostelId = currentUser.hostel_id || currentUser.hostelId || null;
                        assignedHostelName = currentUser.hostel || currentUser.hostel_name || '';
                        assignedFloor = currentUser.assigned_floor || currentUser.assigned_flat || '';
                        assignedFloorName = currentUser.assigned_floor_name || currentUser.assigned_flat_name || '';
                        assignedArea = assignedFloorName || assignedFloor || '';
                        
                        if (assignedHostelId && !assignedHostelName && hostels.length > 0) {
                            const hostel = hostels.find(h => h.id === assignedHostelId);
                            if (hostel) {
                                assignedHostelName = hostel.name;
                            }
                        }
                        
                        if (!assignedHostelId && hostels.length > 0) {
                            assignedHostelId = hostels[0].id;
                            assignedHostelName = hostels[0].name;
                        }
                        
                        return currentUser;
                    }
                    
                    throw new Error('Unable to load user profile: ' + error.message);
                }
            }

            // =============================================
            // UPDATE HEADER
            // =============================================
            function updateHeader() {
                if (!currentUser) return;
                const avatar = document.getElementById('profileAvatar');
                const name = document.getElementById('profileName');
                const role = document.getElementById('profileRoleLabel');
                const roleLabel = document.getElementById('roleLabel');
                const roleScope = document.getElementById('roleScope');
                const mobileRole = document.getElementById('mobileRoleFooter');

                const initials = currentUser.initials || getInitials(currentUser.name);
                const displayName = currentUser.name || 'User';

                avatar.textContent = initials;
                name.textContent = displayName;
                role.textContent = 'RA';
                roleLabel.textContent = 'RA';

                const hostelDisplay = assignedHostelName || 'No Hostel';
                const areaDisplay = assignedArea || 'No Floor';
                const roomCount = assignedRooms.length;
                const statusEmoji = isSessionActive ? '🟢' : sessionStatus === 'completed' ? '✅' : '⏳';
                roleScope.textContent = `${hostelDisplay} · ${areaDisplay} · ${roomCount} rooms ${statusEmoji}`;
                mobileRole.textContent = `RA · ${hostelDisplay} · ${areaDisplay} · ${roomCount} rooms ${statusEmoji}`;
            }

            // =============================================
            // START BEDCHECK SESSION - FIXED
            // =============================================
            async function startBedCheck() {
                if (isSessionActive) {
                    showToast('You already have an active BedCheck session.', 'info');
                    return;
                }

                if (sessionStatus === 'completed') {
                    showToast('Today\'s BedCheck is already completed.', 'info');
                    return;
                }

                try {
                    let sessionId = currentSession?.id || null;
                    
                    if (!sessionId) {
                        // Try to get active session - REMOVE the hostel_id parameter
                        try {
                            const sessionData = await apiCall('/sessions/active');
                            if (sessionData.data) {
                                sessionId = sessionData.data.id;
                                currentSession = sessionData.data;
                            }
                        } catch (e) {
                            // No active session
                            console.log('No active session found:', e.message);
                        }
                    }
                    
                    if (!sessionId) {
                        // Create a new session for today
                        const newSession = await apiCall('/sessions/manage', {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'create',
                                hostel_id: assignedHostelId,
                                date: new Date().toISOString().split('T')[0]
                            })
                        });
                        sessionId = newSession.data.id;
                        currentSession = newSession.data;
                        
                        // Activate it
                        await apiCall('/sessions/manage', {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'activate',
                                session_id: sessionId
                            })
                        });
                    }
                    
                    if (!sessionId) {
                        showToast('Could not create or find a BedCheck session.', 'error');
                        return;
                    }

                    // Start the RA session
                    await apiCall('/ra/bedcheck/start', {
                        method: 'POST',
                        body: JSON.stringify({ session_id: sessionId })
                    });

                    isSessionActive = true;
                    isRASessionActive = true;
                    sessionStatus = 'active';
                    
                    // Refresh session status
                    await loadSessionStatus();
                    
                    showToast('BedCheck session started successfully!', 'success');
                    renderDashboard();
                    
                } catch (error) {
                    console.error('Start BedCheck error:', error);
                    showToast('Failed to start BedCheck: ' + error.message, 'error');
                }
            }

            // =============================================
            // COMPLETE BEDCHECK SESSION
            // =============================================
            async function completeBedCheck() {
                if (!isSessionActive) {
                    showToast('No active BedCheck session to complete.', 'error');
                    return;
                }

                if (!confirm('Are you sure you want to complete tonight\'s BedCheck? This action cannot be undone.')) {
                    return;
                }

                try {
                    const sessionId = currentSession?.id;
                    
                    if (!sessionId) {
                        showToast('No session found to complete.', 'error');
                        return;
                    }

                    // Complete the session
                    await apiCall('/sessions/manage', {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'complete',
                            session_id: sessionId
                        })
                    });

                    // Complete the RA session
                    await apiCall('/ra/bedcheck/complete', {
                        method: 'POST',
                        body: JSON.stringify({ session_id: sessionId })
                    });

                    isSessionActive = false;
                    isRASessionActive = false;
                    sessionStatus = 'completed';
                    
                    // Refresh session status
                    await loadSessionStatus();
                    
                    showToast('BedCheck completed successfully!', 'success');
                    renderDashboard();
                    
                } catch (error) {
                    console.error('Complete BedCheck error:', error);
                    showToast('Failed to complete BedCheck: ' + error.message, 'error');
                }
            }

            // =============================================
            // SHOW ERROR STATE
            // =============================================
            function showError(message) {
                const container = document.getElementById('screenContent');
                container.innerHTML = `
                    <div class="error-container">
                        <div class="error-icon"><i class="fas fa-exclamation-triangle"></i></div>
                        <h2>Unable to Load Dashboard</h2>
                        <p>${message}</p>
                        <button class="btn-success" onclick="location.reload()">
                            <i class="fas fa-refresh"></i> Retry
                        </button>
                    </div>
                `;
            }

            // =============================================
            // RENDER DASHBOARD
            // =============================================
            function renderDashboard() {
                const container = document.getElementById('screenContent');

                const displayHostel = assignedHostelName || 'No Hostel';
                const displayArea = assignedArea || 'No Floor';
                const totalStudents = filteredStudents.length;
                
                // Count students by status
                const verified = filteredStudents.filter(s => bedScanStatus[s.id]?.verified || s.status === 'Verified' || s.status === 'Present').length || 0;
                const absent = filteredStudents.filter(s => bedScanStatus[s.id]?.status === 'Absent' || s.status === 'Absent').length || 0;
                const pending = filteredStudents.filter(s => !bedScanStatus[s.id]?.verified && s.status !== 'Absent' && !s.status).length || 0;
                const completionRate = totalStudents > 0 ? Math.round(((verified + absent) / totalStudents) * 100) : 0;

                const hostelInfo = hostels.find(h => h.id === assignedHostelId);

                let hraName = 'Not Assigned';
                let currentRAName = currentUser?.name || 'Not Assigned';

                if (assignedHostelId) {
                    const hraStaff = staffMembers.find(s => s.hostel_id === assignedHostelId && s.role === 'HRA' && s.status === 'Active');
                    if (hraStaff) hraName = hraStaff.name;
                }

                // Session status display
                let sessionStatusDisplay = 'Inactive';
                let statusClass = '';
                let statusIcon = 'fa-pause-circle';
                let statusBadge = 'inactive';
                let statusMessage = 'Awaiting start';
                
                if (sessionStatus === 'active') {
                    sessionStatusDisplay = 'Active';
                    statusClass = 'active';
                    statusIcon = 'fa-play-circle';
                    statusBadge = 'active';
                    statusMessage = '🟢 Recording enabled';
                } else if (sessionStatus === 'completed') {
                    sessionStatusDisplay = 'Completed';
                    statusClass = 'completed';
                    statusIcon = 'fa-check-circle';
                    statusBadge = 'approved';
                    statusMessage = '✅ Finalized';
                } else if (sessionStatus === 'draft') {
                    sessionStatusDisplay = 'Draft';
                    statusClass = 'draft';
                    statusIcon = 'fa-clock';
                    statusBadge = 'inactive';
                    statusMessage = '⏳ Awaiting activation';
                }

                container.innerHTML = `
                    <div class="page-heading">
                        <div>
                            <p class="eyebrow"><i class="fas fa-clipboard-list"></i> RA Dashboard</p>
                            <h1>${displayHostel}</h1>
                            <p class="desc">
                                <span class="assigned-hostel-badge">
                                    <i class="fas fa-building"></i> ${displayHostel}
                                </span>
                                <span class="assigned-hostel-badge" style="margin-left:0.5rem;background:#d6ad4b20;">
                                    <i class="fas fa-layer-group"></i> ${displayArea}
                                </span>
                                <span class="text-muted" style="margin-left:0.5rem;">${totalStudents} students</span>
                                <span class="assigned-hostel-badge" style="margin-left:0.5rem;background:#d6ad4b20;">
                                    <i class="fas fa-door-open"></i> ${assignedRooms.length} rooms
                                </span>
                            </p>
                        </div>
                        <div class="action-group">
                            ${sessionStatus === 'draft' && assignedRooms.length > 0 ? `
                                <button class="btn-success" id="startBedCheckBtn"><i class="fas fa-play"></i> Start BedCheck</button>
                            ` : ''}
                            ${sessionStatus === 'active' ? `
                                <button class="btn-danger" id="completeBedCheckBtn"><i class="fas fa-check-double"></i> Complete</button>
                            ` : ''}
                            ${sessionStatus === 'completed' ? `
                                <button class="btn-outline" disabled><i class="fas fa-check-circle"></i> Completed</button>
                            ` : ''}
                            ${assignedRooms.length === 0 ? `
                                <button class="btn-outline" disabled><i class="fas fa-exclamation-triangle"></i> No rooms assigned</button>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Session Status -->
                    <div class="session-status-banner ${statusClass}">
                        <i class="fas ${statusIcon}"></i>
                        <span><strong>Session:</strong> ${sessionStatusDisplay}</span>
                        ${sessionStatus === 'active' ? `<span class="badge badge-active">LIVE</span>` : ''}
                        ${sessionStatus === 'completed' ? `<span class="badge badge-approved">DONE</span>` : ''}
                        ${sessionStatus === 'draft' ? `<span class="badge badge-draft">DRAFT</span>` : ''}
                        <span style="margin-left:auto;font-size:0.75rem;opacity:0.7;">
                            ${statusMessage}
                        </span>
                    </div>

                    <!-- Metric Cards -->
                    <div class="metric-grid">
                        <div class="metric-card">
                            <div class="metric-icon navy"><i class="fas fa-users"></i></div>
                            <div class="metric-value">${totalStudents}</div>
                            <div class="metric-title">Total Students</div>
                            <div class="metric-detail">In ${displayArea}</div>
                        </div>
                        <div class="metric-card" style="border-left:3px solid #2d6545;">
                            <div class="metric-icon green"><i class="fas fa-check-circle"></i></div>
                            <div class="metric-value" style="color:#2d6545;">${verified}</div>
                            <div class="metric-title">Verified</div>
                            <div class="metric-detail">Students verified present</div>
                        </div>
                        <div class="metric-card" style="border-left:3px solid #8a3328;">
                            <div class="metric-icon red"><i class="fas fa-user-slash"></i></div>
                            <div class="metric-value" style="color:#8a3328;">${absent}</div>
                            <div class="metric-title">Absent</div>
                            <div class="metric-detail">Students marked absent</div>
                        </div>
                        <div class="metric-card" style="border-left:3px solid #b9c7db;">
                            <div class="metric-icon gray"><i class="fas fa-hourglass-half"></i></div>
                            <div class="metric-value" style="color:#536274;">${pending}</div>
                            <div class="metric-title">Pending</div>
                            <div class="metric-detail">Awaiting verification</div>
                        </div>
                    </div>

                    <!-- Hostel Details -->
                    <div class="grid-2 mt-4">
                        <div class="card">
                            <div class="card-title"><span class="icon"><i class="fas fa-building"></i></span> Hostel Details</div>
                            <div>
                                <div class="flex-between" style="padding:0.4rem 0;border-bottom:1px solid #f0ebe2;">
                                    <span class="text-muted">Hostel</span>
                                    <span class="font-bold">${hostelInfo?.name || displayHostel}</span>
                                </div>
                                <div class="flex-between" style="padding:0.4rem 0;border-bottom:1px solid #f0ebe2;">
                                    <span class="text-muted">Type</span>
                                    <span class="font-bold">${hostelInfo?.type || '—'}</span>
                                </div>
                                <div class="flex-between" style="padding:0.4rem 0;border-bottom:1px solid #f0ebe2;">
                                    <span class="text-muted">Assigned Area</span>
                                    <span class="font-bold">${displayArea}</span>
                                </div>
                                <div class="flex-between" style="padding:0.4rem 0;border-bottom:1px solid #f0ebe2;">
                                    <span class="text-muted">Assigned Rooms</span>
                                    <span class="font-bold">${assignedRooms.length}</span>
                                </div>
                                <div class="flex-between" style="padding:0.4rem 0;border-bottom:1px solid #f0ebe2;">
                                    <span class="text-muted">RA</span>
                                    <span class="font-bold">${currentRAName}</span>
                                </div>
                                <div class="flex-between" style="padding:0.4rem 0;">
                                    <span class="text-muted">HRA</span>
                                    <span class="font-bold">${hraName}</span>
                                </div>
                                <div class="mt-3 pt-3 border-t">
                                    <div class="progress-bar"><div class="fill" style="width:${completionRate}%;"></div></div>
                                    <div class="flex-between mt-1">
                                        <span class="text-xs text-muted">${completionRate}% completion</span>
                                        <span class="text-xs text-gold">${verified + absent} / ${totalStudents} processed</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-title"><span class="icon"><i class="fas fa-door-open"></i></span> Assigned Rooms</div>
                            <div>
                                ${assignedRooms.length > 0 ? `
                                    <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.75rem;">
                                        ${assignedRooms.slice(0, 10).map(room => `
                                            <span class="badge badge-assigned" style="font-size:0.75rem;padding:0.3rem 0.8rem;">
                                                ${room.room_code}
                                            </span>
                                        `).join('')}
                                        ${assignedRooms.length > 10 ? `<span class="badge badge-draft">+${assignedRooms.length - 10} more</span>` : ''}
                                    </div>
                                ` : `
                                    <p class="text-muted text-sm">No rooms assigned. Contact your HRA.</p>
                                `}
                                <div class="mt-2 pt-2 border-t text-xs text-muted">
                                    <i class="fas fa-info-circle"></i> Status updates only during active sessions
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Students Table -->
                    <div class="card mt-4">
                        <div class="flex-between">
                            <div class="card-title"><span class="icon"><i class="fas fa-users"></i></span> Assigned Students</div>
                            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">
                                <div class="field" style="min-width:120px;">
                                    <select id="statusFilter" onchange="filterStudents()">
                                        <option value="all">All Status</option>
                                        <option value="Verified">Verified</option>
                                        <option value="Absent">Absent</option>
                                        <option value="Pending">Pending</option>
                                    </select>
                                </div>
                                <button class="btn-ghost" onclick="resetFilters()" style="font-size:0.8rem;">
                                    <i class="fas fa-undo"></i> Reset
                                </button>
                            </div>
                        </div>

                        <div class="table-wrap mt-2">
                            <table>
                                <thead><tr>
                                    <th>Student</th>
                                    <th>Matric</th>
                                    <th>Room</th>
                                    <th>Status</th>
                                    <th>Last Updated</th>
                                </tr></thead>
                                <tbody id="studentTableBody"></tbody>
                            </table>
                        </div>

                        <div class="pagination">
                            <div class="info" id="paginationInfo">Showing 1-10 of 0 students</div>
                            <div class="pages" id="paginationControls"></div>
                        </div>
                    </div>

                    <!-- Timeline -->
                    <div class="card mt-4">
                        <div class="card-title"><span class="icon"><i class="fas fa-list"></i></span> Activity Log</div>
                        <div>
                            ${timeline.length > 0 ? timeline.slice(0, 8).map(t => `
                                <div class="timeline-item">
                                    <span class="time">${formatTime(t.time)}</span>
                                    <div class="content">
                                        ${t.event}
                                        ${t.details ? `<span style="color:#6b778b;font-size:0.75rem;"> · ${t.details}</span>` : ''}
                                    </div>
                                </div>
                            `).join('') : `
                                <p class="text-muted text-sm">No activity yet. Start verifying students.</p>
                            `}
                        </div>
                    </div>

                    <!-- Footer - Simplified -->
                    <div class="mt-6 pt-4 border-t text-center">
                        <p class="text-xs text-muted">
                            BIU BedCheck System · © Benson Idahosa University
                        </p>
                    </div>
                `;

                renderStudentTable();

                document.getElementById('startBedCheckBtn')?.addEventListener('click', startBedCheck);
                document.getElementById('completeBedCheckBtn')?.addEventListener('click', completeBedCheck);
            }

            // =============================================
            // RENDER STUDENT TABLE
            // =============================================
            function renderStudentTable() {
                const tbody = document.getElementById('studentTableBody');
                if (!tbody) return;

                const statusFilter = document.getElementById('statusFilter')?.value || 'all';

                let displayStudents = filteredStudents;
                if (statusFilter !== 'all') {
                    if (statusFilter === 'Pending') {
                        displayStudents = filteredStudents.filter(s => !bedScanStatus[s.id]?.verified && s.status !== 'Absent' && !s.status);
                    } else if (statusFilter === 'Verified') {
                        displayStudents = filteredStudents.filter(s => bedScanStatus[s.id]?.verified || s.status === 'Verified' || s.status === 'Present');
                    } else {
                        displayStudents = filteredStudents.filter(s => bedScanStatus[s.id]?.status === statusFilter || s.status === statusFilter);
                    }
                }

                const start = (currentPage - 1) * ITEMS_PER_PAGE;
                const end = start + ITEMS_PER_PAGE;
                const pageStudents = displayStudents.slice(start, end);

                if (pageStudents.length === 0) {
                    tbody.innerHTML =
                        `<tr><td colspan="5" class="text-center text-muted" style="padding:2rem;">
                            ${filteredStudents.length === 0 ? 'No students assigned to your rooms.' : 'No students match the selected filter.'}
                        </td></tr>`;
                    updatePagination(displayStudents.length);
                    return;
                }

                tbody.innerHTML = pageStudents.map(s => {
                    const scan = bedScanStatus[s.id];
                    let status = 'Pending';
                    if (scan?.verified || s.status === 'Verified' || s.status === 'Present') {
                        status = 'Verified';
                    } else if (scan?.status === 'Absent' || s.status === 'Absent') {
                        status = 'Absent';
                    }
                    const verifiedTime = scan?.time ? formatTime(scan.time) : '';
                    const confidence = scan?.confidence ? ` · ${scan.confidence}%` : '';

                    return `
                        <tr>
                            <td>
                                <div style="display:flex;align-items:center;gap:0.5rem;">
                                    <span class="avatar">${getInitials(s.name)}</span>
                                    <span class="font-bold">${s.name || 'Unknown'}</span>
                                </div>
                            </td>
                            <td>${s.matric || '—'}</td>
                            <td>${s.room_code || s.room || '—'}</td>
                            <td>${attBadge(status)}</td>
                            <td style="font-size:0.8rem;color:#6b778b;">${verifiedTime || (s.updated_at ? formatTime(s.updated_at) : '—')}</td>
                        </tr>
                    `;
                }).join('');

                updatePagination(displayStudents.length);
            }

            // =============================================
            // UPDATE PAGINATION
            // =============================================
            function updatePagination(total) {
                const totalPages = Math.ceil(total / ITEMS_PER_PAGE);
                const start = (currentPage - 1) * ITEMS_PER_PAGE + 1;
                const end = Math.min(currentPage * ITEMS_PER_PAGE, total);

                const info = document.getElementById('paginationInfo');
                if (info) {
                    info.textContent = `Showing ${total > 0 ? start : 0}-${end} of ${total} students`;
                }

                const controls = document.getElementById('paginationControls');
                if (!controls) return;

                let html = '';
                html +=
                    `<button onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;

                for (let i = 1; i <= Math.min(totalPages, 7); i++) {
                    if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                        html +=
                            `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                    } else if (i === currentPage - 3 || i === currentPage + 3) {
                        html += `<button disabled>...</button>`;
                    }
                }

                html +=
                    `<button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>`;
                controls.innerHTML = html;
            }

            // =============================================
            // FILTERS
            // =============================================
            function filterStudents() {
                currentPage = 1;
                renderStudentTable();
            }

            function resetFilters() {
                const filter = document.getElementById('statusFilter');
                if (filter) filter.value = 'all';
                currentPage = 1;
                renderStudentTable();
            }

            function changePage(page) {
                const total = filteredStudents.length;
                const totalPages = Math.ceil(total / ITEMS_PER_PAGE);
                if (page < 1 || page > totalPages) return;
                currentPage = page;
                renderStudentTable();
            }

            // =============================================
            // AUTHENTICATION
            // =============================================
            function checkAuth() {
                const userData = sessionStorage.getItem('bedcheck_user');
                const token = sessionStorage.getItem('bedcheck_token');
                
                if (!userData || !token) {
                    window.location.replace('../Login.html');
                    return false;
                }
                
                try {
                    currentUser = JSON.parse(userData);
                } catch (e) {
                    window.location.replace('../Login.html');
                    return false;
                }

                // Get initial data from session
                assignedHostelId = currentUser.hostel_id || currentUser.hostelId || null;
                assignedHostelName = currentUser.hostel || currentUser.hostel_name || '';
                assignedFloor = currentUser.assigned_floor || currentUser.assigned_flat || '';
                assignedFloorName = currentUser.assigned_floor_name || '';
                assignedArea = assignedFloorName || assignedFloor || '';

                return true;
            }

            function handleLogout(e) {
                e.preventDefault();
                sessionStorage.removeItem('bedcheck_token');
                sessionStorage.removeItem('bedcheck_user');
                sessionStorage.removeItem('bedcheck_role');
                window.location.replace('../Login.html');
            }

            // =============================================
            // SET DATE
            // =============================================
            function setDate() {
                const now = new Date();
                document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }

            // =============================================
            // MOBILE DRAWER
            // =============================================
            function openMobileDrawer() {
                document.getElementById('mobileDrawer').classList.add('open');
                document.getElementById('drawerOverlay').classList.add('show');
            }

            function closeMobileDrawer() {
                document.getElementById('mobileDrawer').classList.remove('open');
                document.getElementById('drawerOverlay').classList.remove('show');
            }

            // =============================================
            // EXPOSE GLOBALLY
            // =============================================
            window.showToast = showToast;
            window.filterStudents = filterStudents;
            window.resetFilters = resetFilters;
            window.changePage = changePage;

            // =============================================
            // INIT
            // =============================================
            async function init() {
                if (!checkAuth()) return;

                setDate();

                document.getElementById('menuToggle').addEventListener('click', openMobileDrawer);
                document.getElementById('closeDrawer').addEventListener('click', closeMobileDrawer);
                document.getElementById('drawerOverlay').addEventListener('click', closeMobileDrawer);
                document.getElementById('logoutBtn').addEventListener('click', handleLogout);

                try {
                    document.getElementById('noticeText').textContent = 'Loading dashboard...';

                    // Load hostels first
                    await loadHostels();
                    
                    // Load user profile
                    await loadUserProfile();
                    
                    // Load assigned rooms
                    await loadAssignedRooms();

                    // Load floors/flats for the hostel
                    if (assignedHostelId) {
                        await loadFloorsFlats();
                        if (assignedFloor && !assignedFloorName && !isNaN(assignedFloor)) {
                            const floor = floorsFlats.find(f => f.id === parseInt(assignedFloor));
                            if (floor) {
                                assignedFloorName = floor.name;
                                assignedArea = floor.name;
                            }
                        }
                    }

                    // Load staff for HRA info
                    await loadStaff();

                    // Load students
                    await loadStudents();

                    // Load session status using existing endpoints
                    await loadSessionStatus();

                    updateHeader();

                    const hostelDisplay = assignedHostelName || 'No Hostel';
                    const areaDisplay = assignedArea || 'No Floor';
                    const roomDisplay = assignedRooms.length > 0 ? `${assignedRooms.length} rooms` : 'no rooms assigned';
                    const statusText = sessionStatus === 'active' ? '🟢 Active' : sessionStatus === 'completed' ? '✅ Completed' : '⏳ Draft';
                    document.getElementById('noticeText').textContent =
                        `${filteredStudents.length} students in ${hostelDisplay} · ${areaDisplay} · ${roomDisplay} · ${statusText}`;

                    renderDashboard();

                } catch (error) {
                    console.error('Init error:', error);
                    const errorMessage = error.message || 'Failed to load dashboard data.';
                    document.getElementById('noticeText').textContent = 'Error loading dashboard';
                    showError(errorMessage);
                    showToast('Error: ' + errorMessage, 'error');
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
