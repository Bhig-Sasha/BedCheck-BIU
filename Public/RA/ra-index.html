                <a href="ra-index.html" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
                <a href="BedCheck.html" class="nav-item active"><i class="fas fa-clipboard-check"></i> BedCheck</a>
                <a href="Profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>            </nav>
            <div class="drawer-footer" id="mobileRoleFooter">RA · Secure BedCheck</div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="header-inner">
                    <div class="header-left">
                        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                        <div>
                            <p class="header-date" id="currentDate">Loading...</p>
                            <p class="header-title">BIU BedCheck <span class="security-badge"><i class="fas fa-shield-alt"></i> SECURE</span></p>
                        </div>
                    </div>
                    <div class="header-right">
                        <a href="#" class="profile-btn" id="profileBtn">
                            <span class="profile-avatar" id="profileAvatar">U</span>
                            <span class="profile-name" id="profileName">User</span>
                            <span class="profile-role" id="profileRoleLabel">RA</span>
                        </a>
                        <button class="logout-btn" id="logoutBtn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
            </header>
            <div class="content-container">
                <div class="notice-banner" id="noticeBanner">
                    <i class="fas fa-shield-alt"></i>
                    <span id="noticeText">Secure session · Loading RA dashboard...</span>
                </div>
                <div id="screenContent">
                    <div class="loading-spinner"><i class="fas fa-spinner"></i></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        (function() {
            'use strict';

            // =============================================
            // CONFIGURATION - SECURE BACKEND
            // =============================================
            const API_BASE_URL = 'https://bedcheck-biu.onrender.com/api';
            const ITEMS_PER_PAGE = 10;

            // =============================================
            // TOAST
            // =============================================
            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type}`;
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => toast.classList.remove('show'), 4000);
            }

            // =============================================
            // STATE
            // =============================================
            let currentUser = null;
            let currentRole = 'RA';
            let allStudents = [];
            let filteredStudents = [];
            let assignedRooms = [];
            let hostels = [];
            let staffMembers = [];
            let currentPage = 1;
            let assignedHostelId = null;
            let assignedHostelName = '';
            let sessionStatus = 'inactive';
            let isSessionActive = false;
            let bedCheckSessionId = null;

            // =============================================
            // AUTHENTICATED API HELPER
            // =============================================
            async function apiCall(endpoint, options = {}) {
                const token = sessionStorage.getItem('bedcheck_token');
                
                if (!token) {
                    showToast('No authentication token found. Please login again.', 'error');
                    setTimeout(() => {
                        window.location.replace('../Login.html');
                    }, 1500);
                    throw new Error('No authentication token');
                }

                try {
                    const headers = {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        ...(options.headers || {})
                    };

                    const response = await fetch(`${API_BASE_URL}${endpoint}`, { 
                        ...options, 
                        headers,
                        credentials: 'include'
                    });
                    
                    if (response.status === 401) {
                        showToast('Session expired. Please login again.', 'error');
                        sessionStorage.removeItem('bedcheck_token');
                        sessionStorage.removeItem('bedcheck_user');
                        sessionStorage.removeItem('bedcheck_role');
                        setTimeout(() => {
                            window.location.replace('../Login.html');
                        }, 1500);
                        throw new Error('Authentication required');
                    }
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                    const data = await response.json();
                    if (!data.success) throw new Error(data.message || 'API error');
                    return data;
                } catch (error) {
                    if (!error.message.includes('Authentication required') && !error.message.includes('No authentication token')) {
                        showToast('Error: ' + error.message, 'error');
                    }
                    throw error;
                }
            }

            // =============================================
            // HELPERS
            // =============================================
            function getInitials(name) {
                if (!name) return 'U';
                return name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
            }

            function formatTime(date) {
                if (!date) return 'Just now';
                const d = new Date(date);
                return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            }

            function attBadge(status) {
                const map = {
                    'Present': 'badge-present',
                    'Absent': 'badge-absent',
                    'Late': 'badge-late',
                    'Excused': 'badge-approved',
                    'Verified': 'badge-present'
                };
                return `<span class="badge ${map[status] || 'badge-draft'}">${status || 'Unknown'}</span>`;
            }

            // =============================================
            // DATA LOADING
            // =============================================
            async function loadStudents() {
                try {
                    // Get all students in the hostel
                    const data = await apiCall(`/students?hostel_id=${assignedHostelId}&limit=500`);
                    allStudents = data.data || [];
                    
                    // Filter to only show students in rooms assigned to this RA
                    if (assignedRooms.length > 0) {
                        const assignedRoomIds = assignedRooms.map(r => r.id);
                        filteredStudents = allStudents.filter(s => 
                            s.room_id && assignedRoomIds.includes(s.room_id)
                        );
                    } else {
                        filteredStudents = allStudents;
                    }
                    
                    return filteredStudents;
                } catch (error) {
                    console.error('Error loading students:', error);
                    allStudents = [];
                    filteredStudents = [];
                    return [];
                }
            }

            async function loadHostels() {
                try {
                    const data = await apiCall('/hostels');
                    hostels = data.data || [];
                    return hostels;
                } catch (error) {
                    hostels = [];
                    return hostels;
                }
            }

            async function loadStaff() {
                try {
                    const data = await apiCall('/staff');
                    staffMembers = data.data || [];
                    return staffMembers;
                } catch (error) {
                    staffMembers = [];
                    return staffMembers;
                }
            }

            async function loadAssignedRooms() {
                try {
                    const data = await apiCall('/ra/rooms');
                    assignedRooms = data.data?.rooms || [];
                    return assignedRooms;
                } catch (error) {
                    console.error('Error loading assigned rooms:', error);
                    assignedRooms = [];
                    return assignedRooms;
                }
            }

            async function loadSessionStatus() {
                try {
                    const data = await apiCall('/ra/bedcheck/status');
                    const sessions = data.data?.sessions || [];
                    
                    // Check if there's an active session
                    const active = sessions.find(s => s.status === 'started');
                    if (active) {
                        isSessionActive = true;
                        bedCheckSessionId = active.session_id;
                        sessionStatus = 'active';
                    } else {
                        // Check if completed today
                        const today = new Date().toISOString().split('T')[0];
                        const completed = sessions.find(s => 
                            s.status === 'completed' && 
                            s.completed_at && 
                            s.completed_at.startsWith(today)
                        );
                        if (completed) {
                            sessionStatus = 'completed';
                            isSessionActive = false;
                        } else {
                            sessionStatus = 'inactive';
                            isSessionActive = false;
                        }
                    }
                    
                    return { sessionStatus, isSessionActive, bedCheckSessionId };
                } catch (error) {
                    console.error('Error loading session status:', error);
                    sessionStatus = 'inactive';
                    isSessionActive = false;
                    return { sessionStatus: 'inactive', isSessionActive: false, bedCheckSessionId: null };
                }
            }

            // =============================================
            // UPDATE HEADER
            // =============================================
            function updateHeader() {
                if (!currentUser) return;
                const avatar = document.getElementById('profileAvatar');
                const name = document.getElementById('profileName');
                const role = document.getElementById('profileRoleLabel');
                const roleLabel = document.getElementById('roleLabel');
                const roleScope = document.getElementById('roleScope');
                const mobileRole = document.getElementById('mobileRoleFooter');

                const initials = currentUser.initials || getInitials(currentUser.name);
                const displayName = currentUser.name || 'User';

                avatar.textContent = initials;
                name.textContent = displayName;
                role.textContent = 'RA';
                roleLabel.textContent = 'RA';

                const hostelDisplay = assignedHostelName || currentUser?.hostel || 'your hostel';
                const roomCount = assignedRooms.length;
                roleScope.textContent = `${hostelDisplay} · ${roomCount} assigned rooms · Secure BedCheck`;
                mobileRole.textContent = `RA · ${hostelDisplay} · ${roomCount} rooms`;
            }

            // =============================================
            // GET HOSTEL NAME
            // =============================================
            function getHostelName(hostelId) {
                const hostel = hostels.find(h => h.id === hostelId);
                return hostel ? hostel.name : 'Unknown Hostel';
            }

            // =============================================
            // START BEDCHECK SESSION
            // =============================================
            async function startBedCheck() {
                if (isSessionActive) {
                    showToast('You already have an active BedCheck session.', 'info');
                    return;
                }
                
                if (sessionStatus === 'completed') {
                    showToast('You have already completed tonight\'s BedCheck.', 'error');
                    return;
                }

                try {
                    // Get or create session
                    const sessionData = await apiCall('/sessions/active');
                    let sessionId = sessionData.data?.id;
                    
                    if (!sessionId) {
                        // Create new session
                        const newSession = await apiCall('/sessions', {
                            method: 'POST',
                            body: JSON.stringify({
                                date: new Date().toISOString().split('T')[0],
                                status: 'active',
                                campus: 'Legacy'
                            })
                        });
                        sessionId = newSession.data?.id;
                    }
                    
                    if (!sessionId) {
                        showToast('Could not create or find a BedCheck session.', 'error');
                        return;
                    }

                    // Start the RA session
                    await apiCall('/ra/bedcheck/start', {
                        method: 'POST',
                        body: JSON.stringify({ session_id: sessionId })
                    });

                    isSessionActive = true;
                    bedCheckSessionId = sessionId;
                    sessionStatus = 'active';
                    
                    showToast('BedCheck session started successfully!', 'success');
                    renderDashboard();
                    
                } catch (error) {
                    console.error('Start BedCheck error:', error);
                    showToast('Failed to start BedCheck: ' + error.message, 'error');
                }
            }

            // =============================================
            // COMPLETE BEDCHECK SESSION
            // =============================================
            async function completeBedCheck() {
                if (!isSessionActive || !bedCheckSessionId) {
                    showToast('No active BedCheck session to complete.', 'error');
                    return;
                }

                if (!confirm('Are you sure you want to complete tonight\'s BedCheck? This action cannot be undone.')) {
                    return;
                }

                try {
                    await apiCall('/ra/bedcheck/complete', {
                        method: 'POST',
                        body: JSON.stringify({ session_id: bedCheckSessionId })
                    });

                    isSessionActive = false;
                    sessionStatus = 'completed';
                    
                    showToast('BedCheck completed successfully!', 'success');
                    renderDashboard();
                    
                } catch (error) {
                    console.error('Complete BedCheck error:', error);
                    showToast('Failed to complete BedCheck: ' + error.message, 'error');
                }
            }

            // =============================================
            // RENDER DASHBOARD
            // =============================================
            function renderDashboard() {
                const container = document.getElementById('screenContent');

                const displayHostel = assignedHostelName || getHostelName(assignedHostelId) || 'Your Hostel';
                const totalStudents = filteredStudents.length;
                const present = filteredStudents.filter(s => s.status === 'Present' || s.status === 'Verified').length || 0;
                const absent = filteredStudents.filter(s => s.status === 'Absent').length || 0;
                const late = filteredStudents.filter(s => s.status === 'Late').length || 0;
                const attendanceRate = totalStudents > 0 ? Math.round((present / totalStudents) * 100) : 0;

                const hostelInfo = hostels.find(h => h.id === assignedHostelId) || hostels.find(h => h.name === displayHostel);

                let hraName = 'Not Assigned';
                let currentRAName = currentUser?.name || 'Not Assigned';

                if (assignedHostelId || hostelInfo?.id) {
                    const hostelId = assignedHostelId || hostelInfo?.id;
                    const hraStaff = staffMembers.find(s => s.hostel_id === hostelId && s.role === 'HRA' && s.status === 'Active');
                    if (hraStaff) hraName = hraStaff.name;
                }

                // Session status display
                const sessionStatusDisplay = isSessionActive ? 'Active' : 
                    sessionStatus === 'completed' ? 'Completed' : 'Inactive';
                const statusClass = isSessionActive ? 'badge-active' : 
                    sessionStatus === 'completed' ? 'badge-approved' : 'badge-inactive';
                const statusColor = isSessionActive ? 'active' : 
                    sessionStatus === 'completed' ? 'inactive' : 'pending';

                container.innerHTML = `
                    <div class="page-heading">
                        <div>
                            <p class="eyebrow"><i class="fas fa-shield-alt"></i> Secure RA Dashboard</p>
                            <h1>${displayHostel} Dashboard</h1>
                            <p class="desc">
                                <span class="assigned-hostel-badge">
                                    <i class="fas fa-building"></i> ${displayHostel}
                                </span>
                                <span class="text-muted" style="margin-left:0.5rem;">${totalStudents} assigned students</span>
                                <span class="assigned-hostel-badge" style="margin-left:0.5rem;background:#d6ad4b20;">
                                    <i class="fas fa-door-open"></i> ${assignedRooms.length} rooms assigned
                                </span>
                                <span class="security-badge" style="margin-left:0.75rem;"><i class="fas fa-lock"></i> RLS Protected</span>
                            </p>
                        </div>
                        <div class="action-group">
                            ${!isSessionActive && sessionStatus !== 'completed' ? `
                                <button class="btn-success" id="startBedCheckBtn"><i class="fas fa-play"></i> Start BedCheck</button>
                            ` : ''}
                            ${isSessionActive ? `
                                <button class="btn-danger" id="completeBedCheckBtn"><i class="fas fa-check-double"></i> Complete BedCheck</button>
                            ` : ''}
                            ${sessionStatus === 'completed' ? `
                                <button class="btn-outline" disabled><i class="fas fa-check-circle"></i> Completed Today</button>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Session Status Banner -->
                    <div class="session-status-banner ${statusColor}">
                        <i class="fas ${isSessionActive ? 'fa-play-circle' : sessionStatus === 'completed' ? 'fa-check-circle' : 'fa-pause-circle'}"></i>
                        <span><strong>Session Status:</strong> ${sessionStatusDisplay}</span>
                        ${isSessionActive ? `<span class="badge badge-active" style="margin-left:0.5rem;">LIVE</span>` : ''}
                        ${sessionStatus === 'completed' ? `<span class="badge badge-approved" style="margin-left:0.5rem;">DONE</span>` : ''}
                        <span style="margin-left:auto;font-size:0.75rem;opacity:0.7;">
                            ${isSessionActive ? '🟢 Attendance recording enabled' : sessionStatus === 'completed' ? '✅ Session finalized' : '⏳ Awaiting start'}
                        </span>
                    </div>

                    <!-- Security Notice -->
                    <div class="notice-banner" style="background:#e8f0f5;border-color:#aac0d6;color:#1a3a5a;">
                        <i class="fas fa-shield-alt" style="color:#1a5a8a;"></i>
                        <span><strong>Secure Session:</strong> You can only view students in your assigned rooms. Face verification requires liveness detection.</span>
                    </div>

                    <!-- Metric Cards -->
                    <div class="metric-grid">
                        <div class="metric-card">
                            <div class="metric-icon navy"><i class="fas fa-users"></i></div>
                            <div class="metric-value">${totalStudents}</div>
                            <div class="metric-title">Assigned Students</div>
                            <div class="metric-detail">In ${assignedRooms.length} rooms</div>
                        </div>
                        <div class="metric-card" style="border-left:3px solid #2d6545;">
                            <div class="metric-icon green"><i class="fas fa-check-circle"></i></div>
                            <div class="metric-value" style="color:#2d6545;">${present}</div>
                            <div class="metric-title">Present</div>
                            <div class="metric-detail">${attendanceRate}% attendance</div>
                        </div>
                        <div class="metric-card" style="border-left:3px solid #8a3328;">
                            <div class="metric-icon red"><i class="fas fa-user-slash"></i></div>
                            <div class="metric-value" style="color:#8a3328;">${absent}</div>
                            <div class="metric-title">Absent</div>
                            <div class="metric-detail">Students absent</div>
                        </div>
                        <div class="metric-card" style="border-left:3px solid #d4af37;">
                            <div class="metric-icon gold"><i class="fas fa-clock"></i></div>
                            <div class="metric-value" style="color:#d4af37;">${late}</div>
                            <div class="metric-title">Late</div>
                            <div class="metric-detail">Late arrivals</div>
                        </div>
                    </div>

                    <!-- Hostel Details -->
                    <div class="grid-2 mt-4">
                        <div class="card">
                            <div class="card-title"><span class="icon"><i class="fas fa-building"></i></span> Hostel Details</div>
                            <div>
                                <div class="flex-between" style="padding:0.4rem 0;border-bottom:1px solid #f0ebe2;">
                                    <span class="text-muted">Hostel</span>
                                    <span class="font-bold">${hostelInfo?.name || displayHostel}</span>
                                </div>
                                <div class="flex-between" style="padding:0.4rem 0;border-bottom:1px solid #f0ebe2;">
                                    <span class="text-muted">Type</span>
                                    <span class="font-bold">${hostelInfo?.type || '—'}</span>
                                </div>
                                <div class="flex-between" style="padding:0.4rem 0;border-bottom:1px solid #f0ebe2;">
                                    <span class="text-muted">Assigned Rooms</span>
                                    <span class="font-bold">${assignedRooms.length}</span>
                                </div>
                                <div class="flex-between" style="padding:0.4rem 0;border-bottom:1px solid #f0ebe2;">
                                    <span class="text-muted">RA</span>
                                    <span class="font-bold">${currentRAName}</span>
                                </div>
                                <div class="flex-between" style="padding:0.4rem 0;">
                                    <span class="text-muted">HRA</span>
                                    <span class="font-bold">${hraName}</span>
                                </div>
                                <div class="mt-3 pt-3 border-t">
                                    <div class="progress-bar"><div class="fill" style="width:${attendanceRate}%;"></div></div>
                                    <div class="flex-between mt-1">
                                        <span class="text-xs text-muted">${attendanceRate}% attendance</span>
                                        <span class="text-xs text-gold">${present} / ${totalStudents} present</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-title"><span class="icon"><i class="fas fa-door-open"></i></span> Your Assigned Rooms</div>
                            <div>
                                ${assignedRooms.length > 0 ? `
                                    <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.75rem;">
                                        ${assignedRooms.slice(0, 10).map(room => `
                                            <span class="badge badge-assigned" style="font-size:0.75rem;padding:0.3rem 0.8rem;">
                                                ${room.room_code}
                                            </span>
                                        `).join('')}
                                        ${assignedRooms.length > 10 ? `<span class="badge badge-draft">+${assignedRooms.length - 10} more</span>` : ''}
                                    </div>
                                ` : `
                                    <p class="text-muted text-sm">No rooms assigned yet. Please contact your HRA.</p>
                                `}
                                <div class="mt-2 pt-2 border-t text-xs text-muted" style="display:flex;align-items:center;gap:0.3rem;">
                                    <i class="fas fa-lock" style="font-size:0.5rem;"></i> Protected by RLS
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Students Table - READ ONLY -->
                    <div class="card mt-4">
                        <div class="flex-between">
                            <div class="card-title"><span class="icon"><i class="fas fa-users"></i></span> Assigned Students</div>
                            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">
                                <div class="field" style="min-width:120px;">
                                    <select id="statusFilter" onchange="filterStudents()">
                                        <option value="all">All Status</option>
                                        <option value="Present">Present</option>
                                        <option value="Absent">Absent</option>
                                        <option value="Late">Late</option>
                                        <option value="Verified">Verified</option>
                                    </select>
                                </div>
                                <button class="btn-ghost" onclick="resetFilters()" style="font-size:0.8rem;">
                                    <i class="fas fa-undo"></i> Reset
                                </button>
                            </div>
                        </div>
                        <p class="text-xs text-muted" style="margin-bottom:0.5rem;">
                            <i class="fas fa-info-circle"></i> Status updates only available during active BedCheck sessions
                        </p>

                        <div class="table-wrap mt-2">
                            <table>
                                <thead><tr>
                                    <th>Student</th>
                                    <th>Matric</th>
                                    <th>Room</th>
                                    <th>Status</th>
                                    <th>Last Updated</th>
                                </tr></thead>
                                <tbody id="studentTableBody"></tbody>
                            </table>
                        </div>

                        <div class="pagination">
                            <div class="info" id="paginationInfo">Showing 1-10 of 0 students</div>
                            <div class="pages" id="paginationControls"></div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="mt-6 pt-4 border-t text-center">
                        <p class="text-xs text-muted">
                            BIU BedCheck System v2.0 · Secure · © Benson Idahosa University
                            <span class="ml-4"><span class="status-dot green"></span> System Online</span>
                            <span class="ml-4"><i class="fas fa-shield-alt" style="color:#2d6545;"></i> RLS Active</span>
                            <span class="ml-4"><i class="fas fa-door-open" style="color:#a77915;"></i> ${assignedRooms.length} rooms</span>
                        </p>
                    </div>
                `;

                renderStudentTable();

                // Bind buttons
                document.getElementById('startBedCheckBtn')?.addEventListener('click', startBedCheck);
                document.getElementById('completeBedCheckBtn')?.addEventListener('click', completeBedCheck);
            }

            // =============================================
            // RENDER STUDENT TABLE (READ ONLY)
            // =============================================
            function renderStudentTable() {
                const tbody = document.getElementById('studentTableBody');
                if (!tbody) return;

                const statusFilter = document.getElementById('statusFilter')?.value || 'all';

                let displayStudents = filteredStudents;
                if (statusFilter !== 'all') {
                    displayStudents = filteredStudents.filter(s => s.status === statusFilter);
                }

                const start = (currentPage - 1) * ITEMS_PER_PAGE;
                const end = start + ITEMS_PER_PAGE;
                const pageStudents = displayStudents.slice(start, end);

                if (pageStudents.length === 0) {
                    tbody.innerHTML =
                        `<tr><td colspan="5" class="text-center text-muted" style="padding:2rem;">
                            ${filteredStudents.length === 0 ? 'No students assigned to your rooms.' : 'No students match the selected filter.'}
                        </td></tr>`;
                    updatePagination(displayStudents.length);
                    return;
                }

                tbody.innerHTML = pageStudents.map(s => `
                    <tr>
                        <td>
                            <div style="display:flex;align-items:center;gap:0.5rem;">
                                <span class="avatar">${getInitials(s.name)}</span>
                                <span class="font-bold">${s.name || 'Unknown'}</span>
                            </div>
                        </td>
                        <td>${s.matric || '—'}</td>
                        <td>${s.room_code || s.room || '—'}</td>
                        <td>${attBadge(s.status)}</td>
                        <td style="font-size:0.8rem;color:#6b778b;">${s.updated_at ? formatTime(s.updated_at) : '—'}</td>
                    </tr>
                `).join('');

                updatePagination(displayStudents.length);
            }

            // =============================================
            // UPDATE PAGINATION
            // =============================================
            function updatePagination(total) {
                const totalPages = Math.ceil(total / ITEMS_PER_PAGE);
                const start = (currentPage - 1) * ITEMS_PER_PAGE + 1;
                const end = Math.min(currentPage * ITEMS_PER_PAGE, total);

                const info = document.getElementById('paginationInfo');
                if (info) {
                    info.textContent = `Showing ${total > 0 ? start : 0}-${end} of ${total} students`;
                }

                const controls = document.getElementById('paginationControls');
                if (!controls) return;

                let html = '';
                html +=
                    `<button onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;

                for (let i = 1; i <= Math.min(totalPages, 7); i++) {
                    if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                        html +=
                            `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                    } else if (i === currentPage - 3 || i === currentPage + 3) {
                        html += `<button disabled>...</button>`;
                    }
                }

                html +=
                    `<button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>`;
                controls.innerHTML = html;
            }

            // =============================================
            // FILTERS
            // =============================================
            function filterStudents() {
                currentPage = 1;
                renderStudentTable();
            }

            function resetFilters() {
                const filter = document.getElementById('statusFilter');
                if (filter) filter.value = 'all';
                currentPage = 1;
                renderStudentTable();
            }

            function changePage(page) {
                const total = filteredStudents.length;
                const totalPages = Math.ceil(total / ITEMS_PER_PAGE);
                if (page < 1 || page > totalPages) return;
                currentPage = page;
                renderStudentTable();
            }

            // =============================================
            // AUTHENTICATION
            // =============================================
            function checkAuth() {
                const userData = sessionStorage.getItem('bedcheck_user');
                const token = sessionStorage.getItem('bedcheck_token');
                
                if (!userData || !token) {
                    window.location.replace('../Login.html');
                    return false;
                }
                
                try {
                    currentUser = JSON.parse(userData);
                    currentRole = sessionStorage.getItem('bedcheck_role') || 'RA';
                } catch (e) {
                    window.location.replace('../Login.html');
                    return false;
                }

                if (currentUser.hostel_id) assignedHostelId = currentUser.hostel_id;
                if (currentUser.hostel) assignedHostelName = currentUser.hostel;
                if (currentUser.hostel_name) assignedHostelName = currentUser.hostel_name;

                return true;
            }

            function handleLogout(e) {
                e.preventDefault();
                sessionStorage.removeItem('bedcheck_token');
                sessionStorage.removeItem('bedcheck_user');
                sessionStorage.removeItem('bedcheck_role');
                window.location.replace('../Login.html');
            }

            // =============================================
            // SET DATE
            // =============================================
            function setDate() {
                const now = new Date();
                document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }

            // =============================================
            // MOBILE DRAWER
            // =============================================
            function openMobileDrawer() {
                document.getElementById('mobileDrawer').classList.add('open');
                document.getElementById('drawerOverlay').classList.add('show');
            }

            function closeMobileDrawer() {
                document.getElementById('mobileDrawer').classList.remove('open');
                document.getElementById('drawerOverlay').classList.remove('show');
            }

            // =============================================
            // EXPOSE GLOBALLY
            // =============================================
            window.showToast = showToast;
            window.filterStudents = filterStudents;
            window.resetFilters = resetFilters;
            window.changePage = changePage;

            // =============================================
            // INIT
            // =============================================
            async function init() {
                if (!checkAuth()) return;

                setDate();

                document.getElementById('menuToggle').addEventListener('click', openMobileDrawer);
                document.getElementById('closeDrawer').addEventListener('click', closeMobileDrawer);
                document.getElementById('drawerOverlay').addEventListener('click', closeMobileDrawer);
                document.getElementById('logoutBtn').addEventListener('click', handleLogout);

                try {
                    document.getElementById('noticeText').textContent = 'Loading secure RA dashboard...';

                    // Load assigned rooms first
                    await loadAssignedRooms();
                    
                    // Load hostels and staff
                    await loadHostels();
                    await loadStaff();

                    // Get hostel info from assigned rooms
                    if (assignedRooms.length > 0 && !assignedHostelId) {
                        const firstRoom = assignedRooms[0];
                        if (firstRoom.hostel_id) {
                            assignedHostelId = firstRoom.hostel_id;
                            const hostel = hostels.find(h => h.id === assignedHostelId);
                            if (hostel) assignedHostelName = hostel.name;
                        }
                    }

                    // If still no hostel, try user data
                    if (!assignedHostelId && currentUser) {
                        try {
                            const userData = await apiCall(`/staff/${currentUser.id}`);
                            if (userData.data && userData.data.hostel_id) {
                                assignedHostelId = userData.data.hostel_id;
                                const hostel = hostels.find(h => h.id === assignedHostelId);
                                if (hostel) assignedHostelName = hostel.name;
                            }
                        } catch (e) {
                            console.warn('Could not fetch user details:', e);
                        }
                    }

                    // Load students
                    await loadStudents();
                    
                    // Load session status
                    await loadSessionStatus();

                    updateHeader();
                    renderDashboard();

                    const hostelDisplay = assignedHostelName || getHostelName(assignedHostelId) || 'your hostel';
                    const roomDisplay = assignedRooms.length > 0 ? `${assignedRooms.length} rooms` : 'no rooms assigned';
                    document.getElementById('noticeText').textContent =
                        `Secure session · ${filteredStudents.length} students in ${hostelDisplay} · ${roomDisplay} · RLS protected`;

                } catch (error) {
                    console.error('Init error:', error);
                    if (!error.message.includes('Authentication required') && !error.message.includes('No authentication token')) {
                        document.getElementById('noticeText').textContent = 'Error loading data. Please refresh.';
                        showToast('Error loading data: ' + error.message, 'error');
                    }
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
