services:
  # =====================================================
  # NODE.JS BACKEND API SERVICE
  # =====================================================
  - type: web
    name: bedcheck-api
    runtime: node
    plan: starter
    repo: https://github.com/Bhig-Sasha/BedCheck-BIU

    buildCommand: |
      npm install
      npm install express-validator --save

    startCommand: node server.js

    envVars:
      - fromGroup: supabase-creds

      - key: ALLOWED_ORIGINS
        value: https://bedcheck-biu.onrender.com,https://face-api-f9k5.onrender.com,https://your-frontend.vercel.app

      - key: FACE_API_URL
        fromService:
          name: face-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: PORT
        value: 3000

      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        sync: false

      - key: NODE_VERSION
        value: 18.19.0

    healthCheckPath: /health
    autoDeploy: true
    numReplicas: 1

    buildFilter:
      paths:
        - server.js
        - package.json
        - package-lock.json


  # =====================================================
  # PYTHON FACE API SERVICE
  # =====================================================
  - type: web
    name: face-api
    runtime: python
    plan: starter
    repo: https://github.com/Bhig-Sasha/BedCheck-BIU

    buildCommand: |
      pip install --upgrade pip
      pip install -r python/requirements.txt
      # ... your model verification stays the same ...

    startCommand: |
      export PYTHONUNBUFFERED=1
      export TF_CPP_MIN_LOG_LEVEL=3
      export PYTHONPATH=$PYTHONPATH:.
      uvicorn python.app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: INSIGHTFACE_CACHE
        value: ./python/models
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "3"
      - key: PYTHONUNBUFFERED
        value: "1"

    healthCheckPath: /health
    autoDeploy: true