services:
  - type: web
    name: bedcheck-api
    runtime: node
    repo: https://github.com/Bhig-Sasha/BedCheck-BIU
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://bedcheck-biu.onrender.com
      - key: FACE_API_URL
        fromService:
          name: face-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: face-api
    runtime: python
    repo: https://github.com/Bhig-Sasha/BedCheck-BIU
    buildCommand: |
      cd python
      pip install -r requirements.txt
    startCommand: |
      cd python
      uvicorn app:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
    healthCheckPath: /health
    autoDeploy: true