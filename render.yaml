services:
  # =====================================================
  # NODE.JS BACKEND API SERVICE
  # =====================================================
  - type: web
    name: bedcheck-api
    runtime: node
    plan: starter
    repo: https://github.com/Bhig-Sasha/BedCheck-BIU

    buildCommand: |
      npm install
      npm install express-validator --save

    startCommand: node server.js

    envVars:
      - fromGroup: supabase-creds

      - key: ALLOWED_ORIGINS
        value: https://bedcheck-biu.onrender.com,https://face-api-f9k5.onrender.com,https://your-frontend.vercel.app

      - key: FACE_API_URL
        fromService:
          name: face-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: PORT
        value: 3000

      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        sync: false

      - key: NODE_VERSION
        value: 18.19.0

    healthCheckPath: /health
    autoDeploy: true
    numReplicas: 1

    buildFilter:
      paths:
        - server.js
        - package.json
        - package-lock.json


  # =====================================================
  # PYTHON FACE API SERVICE
  # =====================================================
  - type: web
    name: face-api
    runtime: python
    plan: starter
    repo: https://github.com/Bhig-Sasha/BedCheck-BIU

    buildCommand: |
      cd python

      pip install --upgrade pip
      pip install -r requirements.txt

      echo "=========================================="
      echo "Downloading InsightFace antelopev2 model"
      echo "=========================================="

      python -c "
      import os
      import insightface
      import zipfile
      import requests

      from pathlib import Path

      model_root = '../models'
      model_dir = os.path.join(model_root, 'models', 'antelopev2')

      os.makedirs(model_dir, exist_ok=True)

      # -------------------------------------------------
      # Check if model already exists
      # -------------------------------------------------
      required_models = [
          'glintr100.onnx',
          'scrfd_10g_bnkps.onnx'
      ]

      model_ready = all(
          os.path.exists(os.path.join(model_dir, filename))
          for filename in required_models
      )

      if model_ready:
          print('✅ antelopev2 model already exists')
      else:
          print('📥 Downloading antelopev2 model...')

          model_url = 'https://github.com/deepinsight/insightface/releases/download/v0.7/antelopev2.zip'

          zip_path = os.path.join(model_root, 'antelopev2.zip')

          response = requests.get(
              model_url,
              stream=True,
              timeout=300
          )

          response.raise_for_status()

          total_size = int(
              response.headers.get('content-length', 0)
          )

          downloaded = 0
          last_progress = -1

          with open(zip_path, 'wb') as f:
              for chunk in response.iter_content(
                  chunk_size=1024 * 1024
              ):
                  if chunk:
                      f.write(chunk)
                      downloaded += len(chunk)

                      if total_size > 0:
                          progress = int(
                              downloaded / total_size * 100
                          )

                          if progress != last_progress and progress % 10 == 0:
                              print(
                                  f'Download progress: {progress}%'
                              )
                              last_progress = progress

          print('📦 Extracting model...')

          extract_path = os.path.join(
              model_root,
              'models'
          )

          os.makedirs(
              extract_path,
              exist_ok=True
          )

          with zipfile.ZipFile(
              zip_path,
              'r'
          ) as zip_ref:
              zip_ref.extractall(extract_path)

          os.remove(zip_path)

          print(
              '✅ Model downloaded and extracted successfully'
          )

      # -------------------------------------------------
      # Verify model
      # -------------------------------------------------
      print('🔍 Verifying antelopev2 model...')

      try:
          model = insightface.app.FaceAnalysis(
              name='antelopev2',
              root=model_root,
              providers=['CPUExecutionProvider'],
              allowed_modules=[
                  'detection',
                  'recognition'
              ]
          )

          model.prepare(
              ctx_id=0,
              det_size=(640, 640)
          )

          print('✅ Model verified and ready')

      except Exception as e:
          print(
              f'❌ Model verification failed: {e}'
          )
          raise
      "

      # -------------------------------------------------
      # Optional cleanup
      # -------------------------------------------------
      rm -rf /opt/render/project/src/.venv/lib/python3.11/site-packages/tensorflow* 2>/dev/null || true


    # ===================================================
    # IMPORTANT:
    # Start from repository root so python is a package.
    # ===================================================
    startCommand: |
      export PYTHONUNBUFFERED=1
      export TF_CPP_MIN_LOG_LEVEL=3
      uvicorn python.app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: PORT
        value: 8000

      - key: PIP_NO_CACHE_DIR
        value: "true"

      - key: INSIGHTFACE_CACHE
        value: ./models

      - key: TF_CPP_MIN_LOG_LEVEL
        value: "3"

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: UVICORN_TIMEOUT
        value: "120"

    healthCheckPath: /health
    autoDeploy: true
    numReplicas: 1

    buildFilter:
      paths:
        - python/app.py
        - python/requirements.txt
        - python/embeddings.py
        - python/verify.py
        - python/liveness.py
        - python/matcher.py
        - render.yaml