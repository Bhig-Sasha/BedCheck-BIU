services:
  # =====================================================
  # NODE.JS BACKEND API SERVICE
  # =====================================================
  - type: web
    name: bedcheck-api
    runtime: node
    plan: starter
    repo: https://github.com/Bhig-Sasha/BedCheck-BIU

    buildCommand: |
      npm install
      npm install express-validator --save

    startCommand: node server.js

    envVars:
      - fromGroup: supabase-creds

      - key: ALLOWED_ORIGINS
        value: https://bedcheck-biu.onrender.com,https://face-api-f9k5.onrender.com,https://your-frontend.vercel.app

      - key: FACE_API_URL
        fromService:
          name: face-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: PORT
        value: 3000

      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        sync: false

      - key: NODE_VERSION
        value: 18.19.0

    healthCheckPath: /health
    autoDeploy: true

    buildFilter:
      paths:
        - server.js
        - package.json
        - package-lock.json


  # =====================================================
  # PYTHON FACE API SERVICE (UPDATED)
  # =====================================================
  - type: web
    name: face-api
    runtime: python
    plan: starter
    repo: https://github.com/Bhig-Sasha/BedCheck-BIU

    buildCommand: |
      pip install --upgrade pip && \
      pip install -r python/requirements.txt && \
      python -c "
      import os, zipfile, requests, insightface;
      model_dir='./python/models';
      os.makedirs(model_dir, exist_ok=True);
      model_path=os.path.join(model_dir, 'models', 'antelopev2');
      
      if os.path.exists(model_path) and os.listdir(model_path):
          print('✅ Model already exists, skipping download');
      else:
          print('📥 Downloading antelopev2 model...');
          zip_path = os.path.join(model_dir, 'antelopev2.zip');
          try:
              response = requests.get(
                  'https://github.com/deepinsight/insightface/releases/download/v0.7/antelopev2.zip',
                  timeout=300
              );
              response.raise_for_status();
              with open(zip_path, 'wb') as f:
                  f.write(response.content);
              print('📦 Extracting model...');
              with zipfile.ZipFile(zip_path, 'r') as zip_ref:
                  zip_ref.extractall(os.path.join(model_dir, 'models'));
              os.remove(zip_path);
              print('✅ Model extracted successfully');
          except Exception as e:
              print(f'❌ Error downloading model: {e}');
              raise;
      
      print('🔍 Verifying model...');
      model = insightface.app.FaceAnalysis(
          name='antelopev2',
          root=model_dir,
          providers=['CPUExecutionProvider'],
          allowed_modules=['detection', 'recognition']
      );
      model.prepare(ctx_id=0, det_size=(640, 640));
      print('✅ Model verified and ready');
      "

    startCommand: |
      export PYTHONUNBUFFERED=1
      export TF_CPP_MIN_LOG_LEVEL=3
      export PYTHONPATH=$PYTHONPATH:.
      uvicorn python.app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      
      - key: PORT
        value: 8000
      
      - key: INSIGHTFACE_CACHE
        value: ./python/models
      
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "3"
      
      - key: PYTHONUNBUFFERED
        value: "1"
      
      - key: MODEL_NAME
        value: antelopev2
      
      - key: DETECTION_SIZE
        value: "640"
      
      - key: MAX_FACE_DETECTIONS
        value: "10"
      
      - key: DETECTION_THRESHOLD
        value: "0.5"

    healthCheckPath: /health
    autoDeploy: true
    
    buildFilter:
      paths:
        - python/**
        - requirements.txt